<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONDAS – IRONWAVE Technical Help</title>
<meta name="theme-color" content="#0047ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ONDAS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#f2f5fb; --surface:#ffffff; --surface2:#e8eef8; --text:#0a1530; --muted:#55627a;
  --line:#d6deec; --accent:#0047ff; --accent-ink:#ffffff; --accent2:#00b8f0; --ok:#00a870; --danger:#e5193f;
  --head:#0047ff; --head-ink:#ffffff; --head-soft:rgba(255,255,255,.16);
  --code-bg:#0a1530; --code-text:#e6f0ff; --step-bg:#0047ff; --step-fg:#ffffff;
  --font:"Heebo","Segoe UI",Arial,sans-serif;
  --mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#050a17; --surface:#0c1427; --surface2:#141f3a; --text:#eaf1ff; --muted:#8e9fc0;
    --line:#1f2c4b; --accent:#2e6bff; --accent-ink:#ffffff; --accent2:#00d4ff; --ok:#00d68f; --danger:#ff4d6d;
    --head:#0a1f66; --head-ink:#ffffff; --head-soft:rgba(255,255,255,.12);
    --code-bg:#02050d; --code-text:#e6f0ff; --step-bg:#2e6bff; --step-fg:#ffffff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#050a17; --surface:#0c1427; --surface2:#141f3a; --text:#eaf1ff; --muted:#8e9fc0;
  --line:#1f2c4b; --accent:#2e6bff; --accent-ink:#ffffff; --accent2:#00d4ff; --ok:#00d68f; --danger:#ff4d6d;
  --head:#0a1f66; --head-ink:#ffffff; --head-soft:rgba(255,255,255,.12);
  --code-bg:#02050d; --code-text:#e6f0ff; --step-bg:#2e6bff; --step-fg:#ffffff; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
a{color:inherit}
[hidden]{display:none!important}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--head-ink);border-bottom:3px solid var(--accent2)}
.bar{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:1;min-width:0;color:var(--head-ink)}
.wm{font-weight:800;letter-spacing:.14em;font-size:1.35rem;line-height:1;direction:ltr}
.bsub{border-inline-start:1px solid rgba(255,255,255,.4);padding-inline-start:12px;min-width:0;overflow:hidden}
@media (max-width:420px){.wm{font-size:1.1rem;letter-spacing:.1em}.brand{gap:9px}.bsub{padding-inline-start:9px}.pill{padding:5px 10px;font-size:.9rem}}
.bname{font-weight:500;font-size:.92rem;line-height:1.2;white-space:nowrap}
.bver{font-size:.75rem;opacity:.8;white-space:nowrap}
.pill{border:1.5px solid var(--head-ink);background:transparent;color:var(--head-ink);border-radius:8px;padding:6px 14px;font-weight:600;cursor:pointer;min-height:40px}
.pill:hover{background:var(--head-ink);color:var(--head)}
.searchrow{max-width:920px;margin:0 auto;padding:0 16px 14px;display:flex;gap:8px;align-items:center}
.searchrow input{flex:1;min-width:0;border:1px solid transparent;background:var(--head-soft);color:var(--head-ink);border-radius:8px;padding:11px 14px;font-size:1rem}
.searchrow input::placeholder{color:rgba(255,255,255,.75)}
.searchrow input:focus{background:var(--surface);color:var(--text)}
.searchrow input:focus::placeholder{color:var(--muted)}
.offbtn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--head-ink);background:transparent;color:var(--head-ink);border-radius:8px;padding:8px 12px;font-size:.85rem;font-weight:600;cursor:pointer;min-height:46px;white-space:nowrap}
.offbtn::before{content:"";width:9px;height:9px;border-radius:50%;background:#ffb020}
.offbtn.ok::before{background:#29f0a0}
.offbtn.need{background:var(--head-ink);color:var(--head)}
.adminbar{background:var(--accent2);color:#04122e}
.adminbar .in{max-width:920px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600;font-size:.9rem}
.adminbar .in span{flex:1;min-width:160px}
.adminbar button{border:1.5px solid #04122e;background:transparent;color:#04122e;border-radius:6px;padding:5px 12px;font-weight:600;cursor:pointer;min-height:38px}
.adminbar button.solid{background:#04122e;color:#fff}
body.locked .searchrow{display:none}

main{max-width:920px;margin:0 auto;padding:22px 16px 40px}
.crumbs{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem;margin-bottom:12px;flex-wrap:wrap}
.crumbs a{text-decoration:none;color:var(--accent);font-weight:500}
.crumbs a:hover{text-decoration:underline}
h1{font-size:1.75rem;line-height:1.2;margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:22px 0 10px;font-weight:700}
.lead{color:var(--muted);margin:0 0 22px;max-width:60ch}
.note{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--accent2);padding:10px 14px;border-radius:6px;font-size:.9rem;margin-bottom:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--accent);border-radius:8px;padding:18px 18px 16px;min-height:104px}
@media (hover:hover){.tile:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.tile:hover .ct{color:var(--accent-ink);opacity:.85}}
.tile .nm{font-weight:700;font-size:1.12rem}
.tile .ct{color:var(--muted);font-size:.85rem;margin-top:auto}
.tile.add{border:1.5px dashed var(--accent);justify-content:center;align-items:center;color:var(--accent);font-weight:700;cursor:pointer;background:transparent}
.badge{background:var(--accent2);color:#04122e;font-size:.72rem;font-weight:700;border-radius:4px;padding:1px 7px;margin-inline-start:8px;vertical-align:middle;white-space:nowrap}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:15px 18px;text-decoration:none;border-bottom:1px solid var(--line);border-inline-start:4px solid transparent}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface2);border-inline-start-color:var(--accent)}
.row .tx{flex:1;min-width:0}
.row .t1{font-weight:600}
.row .t2{color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtype{font-size:.75rem;font-weight:600;color:var(--accent);background:var(--surface2);border-radius:4px;padding:3px 8px;white-space:nowrap}
.chev{width:9px;height:9px;border-top:2px solid var(--muted);border-inline-end:2px solid var(--muted);transform:rotate(45deg);flex:none}
[dir="rtl"] .chev{transform:rotate(-45deg)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:44px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn.small{min-height:34px;padding:5px 12px;font-size:.85rem}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}

.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.88rem;margin-bottom:18px}
.tag{background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:2px 10px;font-weight:600;font-size:.8rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}
.prose{white-space:pre-wrap;max-width:70ch}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:48px;padding-block:11px;border-bottom:1px solid var(--line)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:9px;width:32px;height:32px;border-radius:6px;background:var(--step-bg);color:var(--step-fg);display:grid;place-items:center;font-weight:700;font-size:.95rem}
.prog{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:4px 0 14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:2px}
.chk.done span{color:var(--muted);text-decoration:line-through}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:360px}
th,td{padding:12px 16px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:.88rem}
td.v{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;font-weight:600}
.codebox{position:relative;background:var(--code-bg);color:var(--code-text);border-radius:8px;overflow:hidden;border-inline-start:4px solid var(--accent2)}
.codebox pre{margin:0;padding:18px;padding-top:48px;overflow-x:auto;font-family:var(--mono);font-size:.9rem;line-height:1.6}
.codebox .btn{position:absolute;top:8px;inset-inline-end:8px}
.mono{font-family:var(--mono);font-size:.88rem;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
.figure{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.figure img{max-width:100%;height:auto;border-radius:4px;cursor:zoom-in;display:block;margin:0 auto}
.figure .cap{color:var(--muted);font-size:.9rem;margin-top:8px}
.pdfbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pdfbar .sp{flex:1}
.pdfbox{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:80vh;min-height:120px}
.pdfbox canvas{display:block;margin:0 auto 10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:baseline;margin-bottom:14px}
.kv dt{color:var(--muted);font-size:.9rem}
.kv dd{margin:0;font-weight:600}
.kv .cp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.modal{position:fixed;inset:0;background:rgba(4,10,28,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;border-top:4px solid var(--accent);padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:12px;padding-bottom:20px}}
.sheet h2{margin:0 0 14px;font-size:1.25rem}
.sheet ol{padding-inline-start:22px}
.sheet li{margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;width:100%}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(0,71,255,.18)}
.field textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.hint{font-size:.84rem;color:var(--muted)}
.err{font-size:.88rem;color:var(--danger);min-height:1.2em}
.bigprog{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:12px 0}
.bigprog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .15s}

.viewer{position:fixed;inset:0;z-index:30;background:#030712;display:flex;flex-direction:column}
.viewer .vbar{display:flex;gap:8px;justify-content:flex-end;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
.viewer .vbar button{background:#0047ff;color:#fff;border:0;border-radius:8px;min-width:46px;min-height:46px;font-size:1.2rem;cursor:pointer}
.viewer .vscroll{flex:1;overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer img{display:block;margin:0 auto;max-width:none}

.lockwrap{max-width:380px;margin:9vh auto 0;text-align:center}
.lockwrap .wm{display:block;font-size:2.6rem;color:var(--accent);margin-bottom:4px}
.lockwrap .sub{font-weight:500;color:var(--muted);margin-bottom:26px;direction:ltr}
.lockwrap input{text-align:center;font-size:1.1rem}
footer{max-width:920px;margin:0 auto;padding:0 16px 28px;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.wm2{font-weight:700;letter-spacing:.06em}
.wm{display:flex;align-items:center;gap:9px}
.logoimg{display:block;height:34px;width:auto;background:#fff;border-radius:8px;padding:4px 6px;object-fit:contain}
.lockwrap .biglogo{display:block;width:min(260px,70%);height:auto;margin:0 auto 14px}
.hero{position:relative}
@media (max-width:480px){.wmt{display:none}.bsub{border-inline-start:0;padding-inline-start:0}}
.heromark{position:absolute;inset-inline-end:-6px;top:-8px;width:120px;opacity:.13;pointer-events:none}
@media (min-width:700px){.heromark{width:170px}}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:22px}
.qbtn{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:12px 14px;min-height:64px;justify-content:center}
.qbtn:hover{filter:brightness(1.1)}
.qbtn .q1{font-weight:700;font-size:.95rem;line-height:1.25}
.qbtn .q2{font-size:.75rem;opacity:.85}
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.alerts a{text-decoration:none;display:block}
.alerts .callout{margin:0}
.recent{margin-bottom:22px}
.tile.soon{opacity:.55;border-inline-start-color:var(--line)}
.row.soon .t1{color:var(--muted)}
.soonb{background:var(--surface2);color:var(--muted);font-size:.72rem;font-weight:700;border-radius:4px;padding:1px 7px;margin-inline-start:8px}
mark{background:color-mix(in srgb,var(--accent2) 35%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.chkres{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:.9rem}
.chkres div{padding:4px 0;border-bottom:1px solid var(--line)}
.chkres div:last-child{border-bottom:0}
.gh{display:flex;align-items:center;gap:10px;margin:26px 0 10px;font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.gh::after{content:"";flex:1;height:1px;background:var(--line)}
.secgrid{margin-bottom:8px}
.tile .kind{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
@media (hover:hover){.tile:hover .kind{color:var(--accent-ink)}}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:8px;padding:16px}
.mcard .mname{font-weight:700;font-size:1.08rem;margin-bottom:10px}
.mcard dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.mcard dt{color:var(--muted);font-size:.85rem}
.mcard dd{margin:0;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 16px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;min-height:44px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:6px}
.atprow{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line)}
.atprow:last-child{border-bottom:0}
.atprow input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:none;margin-top:2px}
.atprow .ab{flex:1;min-width:0}
.atprow .at{display:block;cursor:pointer}
.atprow.done .at{color:var(--muted)}
.atprow .an{margin-top:8px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;font-size:.9rem}
.atph{font-weight:700;color:var(--accent);padding:16px 4px 6px;border-bottom:1px solid var(--line);font-size:.95rem}
.sigwrap{border:1.5px dashed var(--accent);border-radius:8px;background:#fff;touch-action:none;position:relative}
.sigwrap canvas{display:block;width:100%;height:180px;touch-action:none;cursor:crosshair}
.sigwrap .sighint{position:absolute;inset:auto 0 8px 0;text-align:center;color:#8e9fc0;font-size:.85rem;pointer-events:none}
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:8px;padding:12px 14px}
.hrow .tx{flex:1;min-width:180px}
.hrow .t1{font-weight:600}
.hrow .t2{color:var(--muted);font-size:.85rem}
.redit{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--bg)}
.redit .field input,.redit .field select{background:var(--surface)}
.redit .rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:.9rem}
.linkcard{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.doc{max-width:860px}
.doc h2{font-size:1.2rem;margin:28px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.doc h2:first-child{margin-top:4px}
.doc h3{font-size:1.02rem;margin:20px 0 8px;color:var(--accent)}
.doc p{margin:8px 0;max-width:72ch}
.doc ul{margin:8px 0;padding-inline-start:22px}
.doc ul li{margin:4px 0}
.doc ol.steps{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 14px;margin:10px 0}
.doc .tablewrap{margin:12px 0}
.doc .figure{margin:14px 0}
.doc .path{display:inline-flex;gap:8px;align-items:center;background:var(--surface2);border-radius:6px;padding:6px 12px;font-weight:600}
.doc .path .mono{color:var(--accent)}
.doc b{font-weight:700}
.doc code{font-family:var(--mono);font-size:.9em;background:var(--surface2);border-radius:4px;padding:1px 6px;direction:ltr;unicode-bidi:isolate}
.callout{border-radius:8px;padding:12px 14px;margin:14px 0;border-inline-start:4px solid var(--muted);background:var(--surface)}
.callout .ck{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--muted)}
.callout.important{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.callout.important .ck{color:var(--accent)}
.callout.caution{border-color:#ff7a1a;background:color-mix(in srgb,#ff7a1a 10%,var(--surface))}
.callout.caution .ck{color:#e0620a}
