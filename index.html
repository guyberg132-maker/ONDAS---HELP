<style>

:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface2:#e9ecf1; --text:#0a1729; --muted:#586274;
  --line:#dde1e8; --accent:#c53d27; --accent-ink:#ffffff; --accent2:#c53d27; --ok:#1f8a5b; --danger:#c8102e;
  --link:#b2361f; --navy:#0a1729; --navy-ink:#ffffff; --warn:#b77900;
  --head:#0a1729; --head-ink:#ffffff; --head-soft:rgba(255,255,255,.10);
  --code-bg:#0a1729; --code-text:#eef1f6; --step-bg:#0a1729; --step-fg:#ffffff;
  --font:"Heebo","Segoe UI",Arial,sans-serif;
  --mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#060d18; --surface:#0e1a2c; --surface2:#17253b; --text:#eef1f6; --muted:#9aa6b8;
    --line:#22324a; --accent:#c53d27; --accent-ink:#ffffff; --accent2:#c53d27; --ok:#3cc488; --danger:#ff5a6e;
    --link:#f08a72; --navy:#1b2a44; --navy-ink:#ffffff; --warn:#e0a52a;
    --head:#050b15; --head-ink:#ffffff; --head-soft:rgba(255,255,255,.08);
    --code-bg:#02060d; --code-text:#eef1f6; --step-bg:#c53d27; --step-fg:#ffffff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
--bg:#060d18; --surface:#0e1a2c; --surface2:#17253b; --text:#eef1f6; --muted:#9aa6b8;
  --line:#22324a; --accent:#c53d27; --accent-ink:#ffffff; --accent2:#c53d27; --ok:#3cc488; --danger:#ff5a6e;
  --link:#f08a72; --navy:#1b2a44; --navy-ink:#ffffff; --warn:#e0a52a;
  --head:#050b15; --head-ink:#ffffff; --head-soft:rgba(255,255,255,.08);
  --code-bg:#02060d; --code-text:#eef1f6; --step-bg:#c53d27; --step-fg:#ffffff; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
a{color:inherit}
[hidden]{display:none!important}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--head-ink);border-bottom:3px solid var(--accent2)}
.bar{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:1;min-width:0;color:var(--head-ink)}
.wm{font-weight:800;letter-spacing:.14em;font-size:1.35rem;line-height:1;direction:ltr}
.bsub{border-inline-start:1px solid rgba(255,255,255,.4);padding-inline-start:12px;min-width:0;overflow:hidden}
@media (max-width:420px){.wm{font-size:1.1rem;letter-spacing:.1em}.brand{gap:9px}.bsub{padding-inline-start:9px}.pill{padding:5px 10px;font-size:.9rem}}
.bname{font-weight:500;font-size:.92rem;line-height:1.2;white-space:nowrap}
.bver{font-size:.75rem;opacity:.8;white-space:nowrap}
.pill{border:1px solid rgba(255,255,255,.6);background:transparent;color:var(--head-ink);border-radius:4px;padding:6px 14px;font-weight:600;cursor:pointer;min-height:40px}
.pill:hover{background:var(--head-ink);color:var(--head)}
.searchrow{max-width:920px;margin:0 auto;padding:0 16px 14px;display:flex;gap:8px;align-items:center}
.searchrow input{flex:1;min-width:0;border:1px solid transparent;background:var(--head-soft);color:var(--head-ink);border-radius:8px;padding:11px 14px;font-size:1rem}
.searchrow input::placeholder{color:rgba(255,255,255,.75)}
.searchrow input:focus{background:var(--surface);color:var(--text)}
.searchrow input:focus::placeholder{color:var(--muted)}
.offbtn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--head-ink);background:transparent;color:var(--head-ink);border-radius:8px;padding:8px 12px;font-size:.85rem;font-weight:600;cursor:pointer;min-height:46px;white-space:nowrap}
.offbtn::before{content:"";width:9px;height:9px;border-radius:50%;background:#ffb020}
.offbtn.ok::before{background:#29f0a0}
.offbtn.need{background:var(--head-ink);color:var(--head)}
.adminbar{background:var(--accent);color:#ffffff}
.adminbar .in{max-width:920px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600;font-size:.9rem}
.adminbar .in span{flex:1;min-width:160px}
.adminbar button{border:1.5px solid #ffffff;background:transparent;color:#ffffff;border-radius:6px;padding:5px 12px;font-weight:600;cursor:pointer;min-height:38px}
.adminbar button.solid{background:#ffffff;color:#fff}
body.locked .searchrow{display:none}

main{max-width:920px;margin:0 auto;padding:22px 16px 40px}
.crumbs{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem;margin-bottom:12px;flex-wrap:wrap}
.crumbs a{text-decoration:none;color:var(--link);font-weight:500}
.crumbs a:hover{text-decoration:underline}
h1{font-size:1.75rem;line-height:1.2;margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:22px 0 10px;font-weight:700}
.lead{color:var(--muted);margin:0 0 22px;max-width:60ch}
.note{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--accent2);padding:10px 14px;border-radius:6px;font-size:.9rem;margin-bottom:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--accent);border-radius:8px;padding:18px 18px 16px;min-height:104px}
@media (hover:hover){.tile:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.tile:hover .ct{color:var(--accent-ink);opacity:.85}}
.tile .nm{font-weight:700;font-size:1.12rem}
.tile .ct{color:var(--muted);font-size:.85rem;margin-top:auto}
.tile.add{border:1.5px dashed var(--accent);justify-content:center;align-items:center;color:var(--link);font-weight:700;cursor:pointer;background:transparent}
.badge{background:var(--accent2);color:#ffffff;font-size:.72rem;font-weight:700;border-radius:4px;padding:1px 7px;margin-inline-start:8px;vertical-align:middle;white-space:nowrap}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:15px 18px;text-decoration:none;border-bottom:1px solid var(--line);border-inline-start:4px solid transparent}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface2);border-inline-start-color:var(--accent)}
.row .tx{flex:1;min-width:0}
.row .t1{font-weight:600}
.row .t2{color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtype{font-size:.75rem;font-weight:600;color:var(--link);background:var(--surface2);border-radius:4px;padding:3px 8px;white-space:nowrap}
.chev{width:9px;height:9px;border-top:2px solid var(--muted);border-inline-end:2px solid var(--muted);transform:rotate(45deg);flex:none}
[dir="rtl"] .chev{transform:rotate(-45deg)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:44px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn.small{min-height:34px;padding:5px 12px;font-size:.85rem}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}

.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.88rem;margin-bottom:18px}
.tag{background:var(--navy);color:var(--navy-ink);border-radius:4px;padding:2px 10px;font-weight:600;font-size:.8rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}
.prose{white-space:pre-wrap;max-width:70ch}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:48px;padding-block:11px;border-bottom:1px solid var(--line)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:9px;width:32px;height:32px;border-radius:6px;background:var(--step-bg);color:var(--step-fg);display:grid;place-items:center;font-weight:700;font-size:.95rem}
.prog{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:4px 0 14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:2px}
.chk.done span{color:var(--muted);text-decoration:line-through}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:360px}
th,td{padding:12px 16px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{background:var(--navy);color:var(--navy-ink);font-weight:600;font-size:.88rem}
td.v{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;font-weight:600}
.codebox{position:relative;background:var(--code-bg);color:var(--code-text);border-radius:8px;overflow:hidden;border-inline-start:4px solid var(--accent2)}
.codebox pre{margin:0;padding:18px;padding-top:48px;overflow-x:auto;font-family:var(--mono);font-size:.9rem;line-height:1.6}
.codebox .btn{position:absolute;top:8px;inset-inline-end:8px}
.mono{font-family:var(--mono);font-size:.88rem;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
.figure{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.figure img{max-width:100%;height:auto;border-radius:4px;cursor:zoom-in;display:block;margin:0 auto}
.figure .cap{color:var(--muted);font-size:.9rem;margin-top:8px}
.pdfbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pdfbar .sp{flex:1}
.pdfbox{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:80vh;min-height:120px}
.pdfbox canvas{display:block;margin:0 auto 10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:baseline;margin-bottom:14px}
.kv dt{color:var(--muted);font-size:.9rem}
.kv dd{margin:0;font-weight:600}
.kv .cp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.modal{position:fixed;inset:0;background:rgba(4,10,28,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;border-top:4px solid var(--accent);padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:12px;padding-bottom:20px}}
.sheet h2{margin:0 0 14px;font-size:1.25rem}
.sheet ol{padding-inline-start:22px}
.sheet li{margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;width:100%}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(0,71,255,.18)}
.field textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.hint{font-size:.84rem;color:var(--muted)}
.err{font-size:.88rem;color:var(--danger);min-height:1.2em}
.bigprog{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:12px 0}
.bigprog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .15s}

.viewer{position:fixed;inset:0;z-index:30;background:#030712;display:flex;flex-direction:column}
.viewer .vbar{display:flex;gap:8px;justify-content:flex-end;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
.viewer .vbar button{background:#0a1729;color:#fff;border:0;border-radius:8px;min-width:46px;min-height:46px;font-size:1.2rem;cursor:pointer}
.viewer .vscroll{flex:1;overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer img{display:block;margin:0 auto;max-width:none}

.lockwrap{max-width:380px;margin:9vh auto 0;text-align:center}
.lockwrap .wm{display:block;font-size:2.6rem;color:var(--link);margin-bottom:4px}
.lockwrap .sub{font-weight:500;color:var(--muted);margin-bottom:26px;direction:ltr}
.lockwrap input{text-align:center;font-size:1.1rem}
footer{max-width:920px;margin:0 auto;padding:0 16px 28px;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.wm2{font-weight:700;letter-spacing:.06em}
.wm{display:flex;align-items:center;gap:9px}
.logoimg{display:block;height:34px;width:auto;background:#fff;border-radius:8px;padding:4px 6px;object-fit:contain}
.lockwrap .biglogo{display:block;width:min(260px,70%);height:auto;margin:0 auto 14px}
.hero{position:relative}
@media (max-width:480px){.wmt{display:none}.bsub{border-inline-start:0;padding-inline-start:0}}
.heromark{position:absolute;inset-inline-end:-6px;top:-8px;width:120px;opacity:.13;pointer-events:none}
@media (min-width:700px){.heromark{width:170px}}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:22px}
.qbtn{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:12px 14px;min-height:64px;justify-content:center}
.qbtn:hover{filter:brightness(1.1)}
.qbtn .q1{font-weight:700;font-size:.95rem;line-height:1.25}
.qbtn .q2{font-size:.75rem;opacity:.85}
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.alerts a{text-decoration:none;display:block}
.alerts .callout{margin:0}
.recent{margin-bottom:22px}
.tile.soon{opacity:.55;border-inline-start-color:var(--line)}
.row.soon .t1{color:var(--muted)}
.soonb{background:var(--surface2);color:var(--muted);font-size:.72rem;font-weight:700;border-radius:4px;padding:1px 7px;margin-inline-start:8px}
mark{background:color-mix(in srgb,var(--accent2) 35%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.chkres{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:.9rem}
.chkres div{padding:4px 0;border-bottom:1px solid var(--line)}
.chkres div:last-child{border-bottom:0}
.gh{display:flex;align-items:center;gap:10px;margin:26px 0 10px;font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--link)}
.gh::after{content:"";flex:1;height:1px;background:var(--line)}
.secgrid{margin-bottom:8px}
.tile .kind{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--link);text-transform:uppercase}
@media (hover:hover){.tile:hover .kind{color:var(--accent-ink)}}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:8px;padding:16px}
.mcard .mname{font-weight:700;font-size:1.08rem;margin-bottom:10px}
.mcard dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.mcard dt{color:var(--muted);font-size:.85rem}
.mcard dd{margin:0;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 16px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;min-height:44px}
.tabs button.on{color:var(--link);border-bottom-color:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:6px}
.atprow{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line)}
.atprow:last-child{border-bottom:0}
.atprow input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:none;margin-top:2px}
.atprow .ab{flex:1;min-width:0}
.atprow .at{display:block;cursor:pointer}
.atprow.done .at{color:var(--muted)}
.atprow .an{margin-top:8px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;font-size:.9rem}
.atph{font-weight:700;color:var(--link);padding:16px 4px 6px;border-bottom:1px solid var(--line);font-size:.95rem}
.sigwrap{border:1.5px dashed var(--accent);border-radius:8px;background:#fff;touch-action:none;position:relative}
.sigwrap canvas{display:block;width:100%;height:180px;touch-action:none;cursor:crosshair}
.sigwrap .sighint{position:absolute;inset:auto 0 8px 0;text-align:center;color:#8e9fc0;font-size:.85rem;pointer-events:none}
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:8px;padding:12px 14px}
.hrow .tx{flex:1;min-width:180px}
.hrow .t1{font-weight:600}
.hrow .t2{color:var(--muted);font-size:.85rem}
.redit{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--bg)}
.redit .field input,.redit .field select{background:var(--surface)}
.redit .rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:.9rem}
.linkcard{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.area{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ahead{display:flex;align-items:center;gap:12px;padding:16px 18px;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.ahead .chev{border-color:var(--accent-ink)}
.anum{font-weight:800;font-size:1.05rem;min-width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.aname{font-weight:700;font-size:1.15rem;flex:1}
.asubs{display:flex;flex-direction:column}
.asub{display:flex;align-items:center;gap:10px;padding:13px 18px;border-top:1px solid var(--line);text-decoration:none;min-height:48px}
.asub:hover{background:var(--surface2)}
.asn{flex:1;font-weight:600}

const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
const jget=(k,d)=>{try{const v=JSON.parse(ls.get(k));return v??d}catch(e){return d}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const has=v=>Array.isArray(v)?v.length>0:!!(v&&String(v).trim());
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>{if(!d)return"";const p=String(d).slice(0,10).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:d};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
async function sha(s){if(!(window.crypto&&crypto.subtle))return null;const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{s.remove();rej(new Error(src))};document.head.appendChild(s)})}
const libLocal={};
async function needLib(k){
  if(LIBTEST[k]&&LIBTEST[k]())return;
  try{await loadScript(LIB[k][0]);libLocal[k]=true}catch(e){await loadScript(LIB[k][1])}
  if(k==="pdf")pdfjsLib.GlobalWorkerOptions.workerSrc=libLocal.pdf?LIB.pdfw[0]:LIB.pdfw[1];
}

let published=null,draft=null,admin=false,isPreview=false,swOK=false,query="",view={v:"home"},prevSeen=null,atpTab="doc";
const pending=new Map(),pendingURL=new Map();

const other=()=>lang==="he"?"en":"he";
const data=()=>admin&&draft?draft:published;
const dirOf=l=>l==="he"?"rtl":"ltr";
const sec=id=>data().sections.find(s=>s.id===id);
const kids=id=>data().sections.filter(s=>(s.parent||null)===(id||null));
const itemsOf=id=>data().items.filter(i=>i.sec===id);
const item=id=>data().items.find(i=>i.id===id);
const mediaSrc=s=>pendingURL.get(s)||s;
function pathOf(id){const out=[];let s=sec(id),guard=0;while(s&&guard++<20){out.unshift(s);s=s.parent?sec(s.parent):null}return out}
function isEmpty(it){const b=it.body||{},t=it.type;
  if(t==="pdf")return !b.src;
  if(t==="steps"||t==="checklist"||t==="guide")return !((Array.isArray(b.he)&&b.he.length)||(Array.isArray(b.en)&&b.en.length));
  if(t==="text")return !(String(b.he||"").trim()||String(b.en||"").trim());
  if(t==="maint")return !(b.rows||[]).length;
  return false}
function countDeep(id){let n=itemsOf(id).filter(i=>!isEmpty(i)).length;for(const k of kids(id))n+=countDeep(k.id);return n}
function newDeep(id){let n=itemsOf(id).filter(isNew).length;for(const k of kids(id))n+=newDeep(k.id);return n}
function pick(o){if(!o)return{v:"",l:lang,fb:false};if(has(o[lang]))return{v:o[lang],l:lang,fb:false};if(has(o[other()]))return{v:o[other()],l:other(),fb:true};return{v:Array.isArray(o[lang])?[]:"",l:lang,fb:false}}
const P=o=>pick(o).v;
const isNew=it=>!admin&&prevSeen&&it.updated&&it.updated>prevSeen;
const isDirty=()=>admin&&draft&&JSON.stringify(draft)!==JSON.stringify(published);
const secLabel=id=>pathOf(id).map(s=>P(s.name)).join(" › ");
function saveDraft(){ls.set("fk-draft",JSON.stringify(draft))}

/* ---- IndexedDB for pending media (admin) ---- */
const idb={db:null,
  open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{const r=indexedDB.open("ondas",1);r.onupgradeneeded=()=>r.result.createObjectStore("media");r.onsuccess=()=>res(this.db=r.result);r.onerror=()=>rej(r.error)})},
  async put(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("media","readwrite");t.objectStore("media").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  async clear(){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("media","readwrite");t.objectStore("media").clear();t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  async all(){const db=await this.open();return new Promise((res,rej)=>{const out=new Map();const c=db.transaction("media").objectStore("media").openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.set(cur.key,cur.value);cur.continue()}else res(out)};c.onerror=()=>rej(c.error)})}
};
async function loadPending(){try{const m=await idb.all();for(const [k,b] of m){pending.set(k,b);pendingURL.set(k,URL.createObjectURL(b))}}catch(e){}}

function areaOf(sid){let s=sec(sid);while(s){if(s.color)return s;s=s.parent?sec(s.parent):null}return null}
function acStyle(sid){const a=areaOf(sid);return a?`--ac:${a.color};--ac-tint:color-mix(in srgb,${a.color} 10%,var(--surface));--ac-line:color-mix(in srgb,${a.color} 30%,var(--surface))`:""}
function headBand(sid,crumbHTML,title,num){

function tileHTML(s){
  const t=T(),n=countDeep(s.id),k=kids(s.id).length,empty=n===0&&!k&&!admin;
  const st=acStyle(s.id);
  if(s.img)return `<a class="tile photo${s.wide?" wide":""}${empty?" soon":""}" style="${st}" href="#s-${esc(s.id)}"><span class="timg"><img src="${esc(s.img)}" alt="" loading="lazy"></span><span class="tcap">${s.num?`<span class="tnum">${esc(s.num)}</span>`:""}<span class="nm">${esc(P(s.name))}</span></span></a>`;
  if(s.icon)return `<a class="tile area${s.wide?" wide":""}" style="${st}" href="#s-${esc(s.id)}">${s.wideImg?`<img class="tbg" src="${esc(s.wideImg)}" alt="" loading="lazy">`:""}<span class="ttop"><span class="tic">${icon(s.icon,20)}</span>${s.num?`<span class="tno">${esc(s.num)}</span>`:""}</span><span class="nm">${esc(P(s.name))}</span>${s.desc&&P(s.desc)?`<span class="ct">${esc(P(s.desc))}</span>`:""}</a>`;
  return `<a class="tile${empty?" soon":""}" style="${st}" href="#s-${esc(s.id)}">${s.num?`<span class="tnum">${esc(s.num)}</span>`:""}<span class="nm">${esc(P(s.name))}</span>${empty?`<span class="ct">${esc(t.soon)}</span>`:""}</a>`;
}
function hl(txt,words){let h=esc(txt);if(!words||!words.length)return h;for(const w of words){if(w.length<2)continue;const re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");h=h.replace(re,"<mark>$1</mark>")}return h}
const CKINDS={check:1,config:1,trouble:1,data:1,proc:1,doc:1,map:1};
function rowHTML(it,showPath,words){
  const t=T(),ti=pick(it.title),su=pick(it.summary),em=isEmpty(it)&&!admin;
  const sub=showPath?secLabel(it.sec)+(su.v?" · "+su.v:""):su.v;
  const kd=CKINDS[it.kind]?it.kind:"";const tag=(kd?t.ckinds[kd]:(t.types[it.type]||""))+(it.body&&it.body.pages&&it.body.pages.n?" · "+t.pdf.pages(it.body.pages.n):it.body&&it.body.mb?" · "+it.body.mb+"MB":"");
  return `<a class="row${em?" soon":""}" href="#i-${esc(it.id)}"><span class="tx"><div class="t1">${it.num&&!showPath?`<span class="rnum">${esc(it.num)}</span>`:""}<span dir="${dirOf(ti.l)}">${hl(ti.v,words)}</span>${em?`<span class="soonb">${esc(t.soon)}</span>`:""}${isNew(it)?`<span class="badge">${esc(t.isNew)}</span>`:""}</div>${sub?`<div class="t2">${esc(sub)}</div>`:""}</span>
   ${admin&&!showPath?`<button class="btn ghost small" data-act="up" data-id="${esc(it.id)}" aria-label="${esc(t.adm.up)}">▲</button><button class="btn ghost small" data-act="down" data-id="${esc(it.id)}" aria-label="${esc(t.adm.down)}">▼</button>`:""}
   <span class="rtype${kd?" k-"+kd:""}">${esc(tag)}</span><span class="chev" aria-hidden="true"></span></a>`;
}
function vHome(){
  const t=T();let h="";
  if(isPreview)h+=`<div class="note">${esc(t.preview)}</div>`;
  h+=`<div class="hero"><span class="eyebrow">KNOWLEDGE BASE</span><h1 class="htitle">TECHNICAL HELP</h1><p class="hsub">${esc(t.pickProject)}</p></div>`;
  h+=`<div class="projgrid">${kids(null).map(s=>{const empty=countDeep(s.id)===0&&!kids(s.id).length&&!admin;
    if(s.hero&&!empty)return `<a class="proj big" href="#s-${esc(s.id)}"><img src="${esc(s.hero)}" alt=""><span class="pshade"></span><span class="pact">${esc(t.active)}</span><span class="pbody"><span class="pnm">${esc(P(s.name))}</span>${s.desc&&P(s.desc)?`<span class="pds">${esc(P(s.desc))}</span>`:""}${s.stats?`<span class="pstats">${s.stats.map(x=>`<span>${esc(P(x))}</span>`).join("")}</span>`:""}</span></a>`;
    return `<a class="proj${empty?" soon":""}" href="#s-${esc(s.id)}"><span class="pnm">${esc(P(s.name))}</span>${s.desc&&P(s.desc)?`<span class="pds">${esc(P(s.desc))}</span>`:""}${empty?`<span class="psoon">${esc(t.soon)}</span>`:""}</a>`}).join("")}</div>`;

function secAlive(c){return c.kind==="logbook"||c.kind==="forms"||countDeep(c.id)>0}
function areaCard(s){
  const subs=kids(s.id);
  return `<section class="area"><a class="ahead" href="#s-${esc(s.id)}">${s.num?`<span class="anum">${esc(s.num)}</span>`:""}<span class="aname">${esc(P(s.name))}</span><span class="chev" aria-hidden="true"></span></a>
   <div class="asubs">${subs.map(c=>`<a class="asub${secAlive(c)||admin?"":" soon"}" href="#s-${esc(c.id)}"><span class="adot" aria-hidden="true"></span><span class="asn">${esc(P(c.name))}</span><span class="asc">${esc(c.kind==="logbook"||c.kind==="forms"?"":T().items(countDeep(c.id)))}</span></a>`).join("")}</div></section>`;
}
function vSec(id){
  const t=T(),s=sec(id);if(!s)return vHome();
  const path=pathOf(id),subs=kids(id),its=itemsOf(id);
  let h;
  if(s.hero){h=crumbs(path.slice(0,-1))+`<div class="iwhero"><img src="${esc(s.hero)}" alt=""><div class="iwtx"><span class="pnm">${esc(P(s.name))}</span>${s.desc&&P(s.desc)?`<span class="pds">${esc(P(s.desc))}</span>`:""}</div></div>`}
  else h=headBand(id,crumbs(path.slice(0,-1)),esc(P(s.name)),s.num);
  if(admin)h+=`<div class="btnrow"><button class="btn primary" data-act="addItem">${esc(t.adm.addItem)}</button><button class="btn ghost" data-act="addSec">${esc(t.adm.addSec)}</button><button class="btn ghost" data-act="editSec">${esc(t.adm.editSec)}</button><button class="btn danger" data-act="delSec">${esc(t.adm.delSec)}</button></div>`;
  if(subs.length)h+=`<div class="grid secgrid">${subs.map(tileHTML).join("")}</div>`;
  if(s.kind==="logbook"){h+=vLogbook();return h}
  const rel=data().items.filter(i=>(i.rel||[]).includes(id)&&i.sec!==id);
  if(s.groups&&its.length){
    const known=s.groups.map(g=>g.id);
    for(const g of [...s.groups,{id:"_",he:t.groups.other,en:t.groups.other}]){const gi=its.filter(i=>(known.includes(i.group)?i.group:"_")===g.id);if(!gi.length)continue;
      h+=`<div class="gh">${esc(g.id==="_"?t.groups.other:P(g))}</div><div class="list">${gi.map(i=>rowHTML(i,false)).join("")}</div>`}
  }else if(s.kind==="assembly"&&its.length){
    for(const g of [...GROUPS,"other"]){const gi=its.filter(i=>(GROUPS.includes(i.group)?i.group:"other")===g);if(!gi.length)continue;
      h+=`<div class="gh">${esc(t.groups[g])}</div><div class="list">${gi.map(i=>rowHTML(i,false)).join("")}</div>`}
  }else if(its.length){h+=`${subs.length?`<div style="height:18px"></div>`:""}<div class="list">${its.map(i=>rowHTML(i,false)).join("")}</div>`}
  if(rel.length)h+=`<div class="gh">${esc(t.related)}</div><div class="list">${rel.map(i=>rowHTML(i,true)).join("")}</div>`;
  if(!subs.length&&!its.length&&!rel.length)h+=`<div class="empty">${esc(t.empty)}</div>`;
  return h;
}
/* ---------- logbook: all saved records on this device ---------- */
function allRecords(){
  const out=[];
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);const m=/^fk-(chkhist|atp-hist|rephist)-(.+)$/.exec(k||"");if(!m)continue;
    for(const r of jget(k,[]))out.push({rec:r,key:k,itemId:m[2],kind:m[1]})}}catch(e){}
  return out.sort((a,b)=>String(b.rec.f&&b.rec.f.date||b.rec.savedAt).localeCompare(String(a.rec.f&&a.rec.f.date||a.rec.savedAt)));
}
let logFilter="";
function vLogbook(){
  const t=T(),L=t.log,recs=allRecords();
  const kindOf=x=>x.kind==="chkhist"?"chk":x.kind==="rephist"?"rep":"atp";
  let h=`<p class="lead">${esc(L.lead)}</p>`;
  if(!recs.length)return h+`<div class="empty">${esc(L.empty)}</div>`;
  const kinds=[["",L.all],["chk",L.kChk],["atp",L.kAtp],["rep",L.kRep]];
  h+=`<div class="chips">${kinds.map(([k,l])=>{const n=k?recs.filter(x=>kindOf(x)===k).length:recs.length;return n||!k?`<button class="chip${logFilter===k?" on":""}" data-act="logF" data-v="${k}">${esc(l)} (${n})</button>`:""}).join("")}</div>`;
  const shown=recs.filter(x=>!logFilter||kindOf(x)===logFilter);
  h+=`<div class="hist">${shown.map(x=>{const r=x.rec,f=r.f||{},who=f.tester||((f.first||"")+" "+(f.last||"")).trim();
    return `<div class="hrow"><div class="tx"><div class="t1">${esc(r.title||"")}</div><div class="t2">${esc(fmtDate(f.date))}${who?" · "+esc(who):""}${f.platform?" · "+esc(f.platform):""}${r.total?" · "+esc(t.atp.prog(r.done,r.total)):""}</div></div>
      <button class="btn primary small" data-act="logPdf" data-k="${esc(x.key)}" data-id="${esc(r.id)}">${esc(t.atp.download)}</button>${canShareFiles()?`<button class="btn ghost small" data-act="logShare" data-k="${esc(x.key)}" data-id="${esc(r.id)}">${esc(t.atp.share)}</button>`:""}</div>`}).join("")}</div>`;
  return h+`<p class="hint" style="margin-top:12px">${esc(t.cs.local)}</p>`;
}
function recName(r){return r.kind==="chk"?chkPdfName(r):r.kind==="rep"?repPdfName(r):pdfName(r)}
async function logAction(k,id,mode){
  const a=T().atp,r=jget(k,[]).find(x=>x.id===id);if(!r)return;
  openModal(`<h2>${esc(a.making)}</h2><div class="bigprog"><i style="width:60%"></i></div>`);
  try{const blob=await makePdf(r);closeModal();mode==="share"?sharePdf(blob,recName(r)):downloadBlob(blob,recName(r))}
  catch(e){$("sheet").innerHTML=`<p class="err">${esc(a.pdfErr)}</p><button class="btn ghost" onclick="closeModal()">${esc(T().off.close)}</button>`}

function noteOf(o){const n=pick(o);return n.v?`<div class="note" dir="${dirOf(n.l)}">${esc(n.v)}</div>`:""}
function fbNote(p){return p.fb?`<div class="note">${esc(T().fallback)}</div>`:""}
function pagesBlock(src,pg){

  for(let i=1;i<=n;i++){const f=dir+String(i).padStart(3,"0")+".webp";im+=`<img class="pgimg" src="${esc(f)}" width="${pg.w}" height="${pg.h}" loading="${i<=2?"eager":"lazy"}" decoding="async" alt="${esc(t.pdf.pageN(i))}">`}
  return `<div class="pdfbar"><span class="hint">${esc(t.pdf.pages(n))}</span><span class="sp"></span>
   <button class="btn ghost small" data-act="pgOut" aria-label="${esc(t.pdf.zout)}">−</button><button class="btn ghost small" data-act="pgIn" aria-label="${esc(t.pdf.zin)}">+</button>

let pgZoom=1;
function pdfBlock(src,pg){
  const t=T();

  if(!src)return `<div class="empty">${esc(t.pdf.none)}</div>`;
  return `<div class="pdfbar"><span class="hint" id="pdfInfo"></span><span class="sp"></span>
   <button class="btn ghost small" data-act="pdfOut" aria-label="${esc(t.pdf.zout)}">−</button><button class="btn ghost small" data-act="pdfIn" aria-label="${esc(t.pdf.zin)}">+</button>
   ${!String(src).startsWith("data:")?`<a class="btn ghost small" href="${esc(mediaSrc(src))}" target="_blank" rel="noopener">${esc(t.pdf.open)}</a>`:""}</div><div class="pdfbox" id="pdfBox"></div>`;

function vItem(id){
  const t=T(),it=item(id);if(!it)return vHome();
  ls.del("fk-recent");
  const ti=pick(it.title),su=pick(it.summary),b=it.body||{};
  let h=headBand(it.sec,crumbs(pathOf(it.sec)),`<span dir="${dirOf(ti.l)}">${esc(ti.v)}</span>`,it.num);
  if(Array.isArray(it.facts)&&it.facts.length)h+=`<div class="facts">${it.facts.map(f=>`<div class="fact${f.hi?" hi":""}"><b dir="ltr">${esc(f.v)}</b><span>${esc(P(f.l))}</span></div>`).join("")}</div>`;

        p.v.map((s,i)=>isH(s)?`<div class="atph">${esc(s.trim().replace(/^#+\s*/,""))}</div>`:`<label class="chk${st.includes(i)?" done":""}"><input type="checkbox" data-chk="${i}" ${st.includes(i)?"checked":""}><span>${fmt(s)}</span></label>`).join("")+

      rows.map(r=>{const p=pick(r.p);return `<tr><td dir="${dirOf(p.l)}">${esc(p.v)}</td><td class="v"><span dir="ltr">${esc(r.v)}</span></td></tr>`}).join("")+`</tbody></table></div>`:`<div class="empty">${esc(t.empty)}</div>`;break}

       </dl>${url?`<div class="btnrow"><a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener">${esc(t.sw.open)}</a></div>`:""}${b.public?"":`<div class="note">${esc(t.sw.note)}</div>`}`;
      const p=pick(b.install);if(p.v.length)h+=`<h2>${esc(t.sw.install)}</h2>`+fbNote(p)+`<ol class="steps" dir="${dirOf(p.l)}">${p.v.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`;

function aiSearch(q,n,L){
  L=L||(/[\u05d0-\u05ea]/.test(q)?"he":"en");
  const I=aiBuild(L),{terms,pairs,qw}=aiTerms(q);const howQ=/^\s*(איך|כיצד|how|what are the steps)/i.test(q)||/(שלב אחרי שלב|step by step|תהליך)/i.test(q);if(!terms.length)return[];
  const idf=t=>{let d=0;for(const w in I.df)if(t.vars.some(v=>!v.includes(" ")&&w.startsWith(v)))d=Math.max(d,I.df[w]);return Math.log(1+I.N/(1+d))};
  const W=terms.map(t=>Math.max(0.5,idf(t))*(t.root?1.4:1));
  const res=[];
  for(const p of I.P){let s=0,hit=0;
    terms.forEach((t,k)=>{const inT=t.vars.some(v=>p.title.includes(v)),inX=t.vars.some(v=>aiHas(p,v)),inS=t.vars.some(v=>p.sub.includes(v));
      if(inT||inX||inS){hit++;s+=W[k]*(inT?2.5:inX?1:0.6)}});
    if(!hit)continue;
    let pb=0;for(const pr of pairs)if(p.text.includes(" "+pr)||p.title.includes(pr))pb+=4;s+=Math.min(pb,12);
    if(p.head){const hn=aiNorm(p.head);for(const x of qw)if(hn.includes(x)){s+=1.2;break}}
    const cov=hit/terms.length;s*=(0.3+cov)*(0.3+cov);
    s/=Math.pow(0.6+0.4*p.len/I.avg,0.35);if(p.row)s*=0.8;
    if(howQ&&p.blocks.some(x=>x&&x.ol))s+=2;
    if(!p.blocks.length)s*=0.5;if(p.it.type==="pdf")s*=0.6;
    res.push({p,s,cov,L})}
  res.sort((a,b)=>b.s-a.s);
  const out=[],seen=new Set();for(const r of res){const k=r.p.it.id+"|"+r.p.head+"|"+(r.p.row?aiBlockText(r.p.blocks[0]):"");if(seen.has(k))continue;seen.add(k);out.push(r);if(out.length>=n)break}
  return out;
}
function aiAnswerHTML(q){
  const t=T().ai,hits=aiSearch(q,10),L=hits.length?hits[0].L:lang;
  if(!hits.length||hits[0].cov<0.5||hits[0].s<1.0)
    return `<p>${esc(t.none)}</p>`+(hits.length&&hits[0].cov>=0.34?`<div class="more"><b>${esc(t.maybe)}</b>${[...new Map(hits.map(h=>[h.p.it.id,h])).values()].slice(0,3).map(h=>`<a href="#i-${esc(h.p.it.id)}" data-act="aiGo">${esc(PL(h.p.it.title,L))}</a>`).join("")}</div>`:"");
  let top=hits[0].p;const it=top.it;let blocks=top.blocks;
  const same=hits.slice(0,3).filter(h=>h.p.it.id===it.id&&!h.p.row).length;
  if(it.type==="guide"&&same>=2&&!top.row){const all=(pickL(it.body,L)||[]).filter(x=>!(x&&x.note&&/^(מקור|Source):/.test(x.note)));blocks=all;top={...top,head:""}}
  const cut=blocks.length>18;if(cut)blocks=blocks.slice(0,18);
  let h=`<div class="src">${esc(t.from)} <b>${esc(PL(it.title,L))}</b>${top.head?" › "+esc(top.head):""}</div>`;
  h+=blocks.length?`<div class="doc">${guideHTML(blocks,L)}</div>`:`<p>${esc(it.type==="pdf"?t.isDoc:t.seePage)}</p>`;
  if(cut)h+=`<p class="hint">${esc(t.cut)}</p>`;
  h+=`<a class="btn primary small openfull" href="#i-${esc(it.id)}" data-act="aiGo">${esc(it.type==="pdf"?t.openDoc:t.openFull)}</a>`;
  const others=[],seen=new Set([it.id+"|"+top.head]);for(const x of hits.slice(1)){const k=x.p.it.id+"|"+x.p.head;if(seen.has(k)||x.s<hits[0].s*0.3)continue;seen.add(k);others.push(x.p);if(others.length>=3)break}
  if(others.length)h+=`<div class="more"><b>${esc(t.also)}</b>${others.map(o=>`<a href="#i-${esc(o.it.id)}" data-act="aiGo">${esc(PL(o.it.title,L))}${o.head?" › "+esc(o.head):""}</a>`).join("")}</div>`;
  return h;
}
async function aiRemote(q){
  const url=(published.app||{}).aiEndpoint;if(!url||!navigator.onLine)return null;
  const hits=aiSearch(q,6);
  const ctx=hits.map((h,i)=>`[${i+1}] ${PL(h.p.it.title,h.L)}${h.p.head?" › "+h.p.head:""}\n`+h.p.blocks.map(aiBlockText).join("\n").slice(0,1800)).join("\n\n");
  const hist=aiMsgs.slice(-6).map(m=>({role:m.me?"user":"assistant",content:m.plain||""}));
  try{const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,history:hist,context:ctx,lang})});
    if(!r.ok)return null;const j=await r.json();if(!j||!j.answer)return null;
    const t=T().ai;let h=`<div class="src">${esc(t.aiLabel)}</div><div class="doc">${aiMd(j.answer)}</div>`;
    if(hits.length)h+=`<div class="more"><b>${esc(t.sources)}</b>${hits.slice(0,3).map(x=>`<a href="#i-${esc(x.p.it.id)}" data-act="aiGo">${esc(P(x.p.it.title))}</a>`).join("")}</div>`;
    return {html:h,plain:j.answer};
  }catch(e){return null}
}
function aiMd(s){const lines=String(s).split(/\n/);let h="",list=null;
  const close=()=>{if(list){h+=`</${list}>`;list=null}};
  for(const l of lines){const m1=/^\s*\d+[.)]\s+(.*)/.exec(l),m2=/^\s*[-•*]\s+(.*)/.exec(l);
    if(m1){if(list!=="ol"){close();h+="<ol>";list="ol"}h+=`<li>${fmt(m1[1])}</li>`}
    else if(m2){if(list!=="ul"){close();h+="<ul>";list="ul"}h+=`<li>${fmt(m2[1])}</li>`}
    else{close();if(l.trim())h+=`<p>${fmt(l.replace(/^#+\s*/,""))}</p>`}}
  close();return h}

let sigCtx=null;
function setupSigPad(getSig,setSig){
  const c=$("sig");if(!c)return;
  const dpr=Math.max(1,window.devicePixelRatio||1),w=c.clientWidth,hgt=180;
  c.width=w*dpr;c.height=hgt*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#0a1530";sigCtx=x;
  const cur=getSig();if(cur){const im=new Image();im.onload=()=>x.drawImage(im,0,0,w,hgt);im.src=cur}
  let drawing=false,last=null;
  const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  c.onpointerdown=e=>{drawing=true;last=pos(e);c.setPointerCapture(e.pointerId);$("sigHint").hidden=true;e.preventDefault()};
  c.onpointermove=e=>{if(!drawing)return;const p=pos(e);x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(p[0],p[1]);x.stroke();last=p;e.preventDefault()};
  const end=()=>{if(!drawing)return;drawing=false;setSig(c.toDataURL("image/png"))};
  c.onpointerup=end;c.onpointercancel=end;c.onpointerleave=end;
}

async function makePdf(rec){
  await needLib("h2c");await needLib("jspdf");
  const box=document.createElement("div");
  box.style.cssText="position:fixed;left:-12000px;top:0;width:794px;background:#fff;color:#0a1530;font-family:Heebo,Arial,sans-serif;padding:40px;box-sizing:border-box;line-height:1.45";
  box.dir=dirOf(rec.lang);box.innerHTML=(rec.kind==="chk"?reportChk:rec.kind==="rep"?reportRep:reportHTML)(rec)+(me&&me.email?`<div style="margin-top:18px;padding-top:8px;border-top:1px solid #dde1e8;font-size:11px;color:#6b7686;direction:ltr;text-align:center" data-br>${esc((rec.lang==="he"?"הופק על ידי ":"Generated by ")+me.email+" · "+new Date().toLocaleString(rec.lang==="he"?"he-IL":"en-GB"))}</div>`:"");document.body.appendChild(box);
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    await Promise.all([...box.querySelectorAll("img")].map(img=>img.complete?0:new Promise(r=>{img.onload=img.onerror=r})));
    const top=box.getBoundingClientRect().top;
    const bounds=[...box.querySelectorAll("[data-br]")].map(e=>e.getBoundingClientRect().bottom-top).sort((a,b)=>a-b);
    const totalH=box.scrollHeight;bounds.push(totalH);
    const S=2,canvas=await html2canvas(box,{scale:S,backgroundColor:"#ffffff",useCORS:true});
    const pageH=Math.floor(794*297/210),margin=40;
    const pdf=new jspdf.jsPDF({unit:"pt",format:"a4"});const pw=pdf.internal.pageSize.getWidth();
    let s=0,first=true;
    while(s<totalH-1){
      const lim=s+pageH-(first?0:margin);let e=s;for(const b of bounds)if(b>s&&b<=lim)e=b;if(e<=s)e=Math.min(lim,totalH);
      const pc=document.createElement("canvas");pc.width=canvas.width;pc.height=Math.ceil((e-s+(first?0:margin))*S);
      const x=pc.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,pc.width,pc.height);
      x.drawImage(canvas,0,s*S,canvas.width,(e-s)*S,0,first?0:margin*S,canvas.width,(e-s)*S);
      if(!first)pdf.addPage();pdf.addImage(pc.toDataURL("image/jpeg",.92),"JPEG",0,0,pw,pc.height/S*pw/794);
      s=e;first=false;
    }
    return pdf.output("blob");
  }finally{box.remove()}
}

    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);

    case"link":{const tg=v("lTarget");if(!tg)throw new Error(T().adm.needTarget);return tg.startsWith("s:")?{targetSec:tg.slice(2)}:{target:tg}}
    case"maint":return{rows:mRows.filter(r=>has(r.name?.he)||has(r.name?.en)),note};
    case"guide":{const pj=k=>{try{const x=JSON.parse(v(k)||"[]");if(!Array.isArray(x))throw 0;return x}catch(e){throw new Error("JSON")}};return{he:pj("gHe"),en:pj("gEn")}}
    case"atp":return{src:await takeFile("pdf",id,old.src),rows:{he:lines("rHe"),en:lines("rEn")}};
    default:return{he:v("bHe"),en:v("bEn")};
  }
}

async function publish(){
  const a=T().adm;openModal(`<h2>${esc(a.publish)}</h2><p class="hint">${esc(a.working)}</p>`);
  try{
    await needLib("zip");
    const next=clone(draft);next.app.version=(+published.app.version||0)+1;next.app.updated=today();
    const zip=new JSZip();zip.file("content.json",JSON.stringify(next,null,1));
    const used=new Set(next.items.flatMap(mediaOf).filter(s=>s.startsWith("media/")));
    for(const [p,b] of pending)if(used.has(p))zip.file(p,b);
    downloadBlob(await zip.generateAsync({type:"blob"}),"site-update.zip");
    draft=next;saveDraft();
    openModal(`<h2>${esc(a.pubTitle(next.app.version))}</h2>${isPreview?`<div class="note">${esc(a.preview)}</div>`:""}<ol>${a.pubSteps.map(s=>`<li>${esc(s.replace("X",next.app.version))}</li>`).join("")}</ol>
      <div class="btnrow"><button class="btn primary" id="pubDone">${esc(a.pubDone)}</button><button class="btn ghost" id="pubLater">${esc(a.cancel)}</button></div>`);
    $("pubLater").onclick=closeModal;
    $("pubDone").onclick=async()=>{try{await idb.clear()}catch(e){}ls.del("fk-draft");location.reload()};
  }catch(e){$("sheet").innerHTML=`<p class="err">${esc(e.message||String(e))}</p><button class="btn ghost" onclick="closeModal()">${esc(a.cancel)}</button>`}
}
function moveItem(id,dir){
  const its=draft.items,ix=its.findIndex(i=>i.id===id);if(ix<0)return;
  const s=its[ix].sec;let j=ix+dir;while(j>=0&&j<its.length&&its[j].sec!==s)j+=dir;
  if(j<0||j>=its.length)return;[its[ix],its[j]]=[its[j],its[ix]];saveDraft();render();
}
async function copyText(txt,btn){
  let ok=false;try{await navigator.clipboard.writeText(txt);ok=true}catch(e){}
  if(!ok){const x=document.createElement("textarea");x.value=txt;x.style.position="fixed";x.style.opacity="0";document.body.appendChild(x);x.select();try{document.execCommand("copy")}catch(e){}x.remove()}
  if(btn&&btn.tagName!=="CODE"){const o=btn.textContent;btn.textContent=T().copied;setTimeout(()=>btn.textContent=o,1400)}
  toast(T().copied+(txt.length<40?": "+txt:""));
}

function onRRun(e){
  const el=e.target.closest("[data-rrun]");if(!el)return false;const it=item(view.id);if(!it)return true;
  const r=getRRun(it),[k,x]=el.dataset.rrun.split(":");if(k==="f")r.f[x]=el.value;else r[k]=el.value;ls.set(rrKey(it),JSON.stringify(r));return true;
}
function onCRun(e){
  if(onRRun(e))return true;
  const el=e.target.closest("[data-crun]");if(!el)return false;const it=item(view.id);if(!it)return true;
  const r=getCRun(it),[k,x]=el.dataset.crun.split(":");
  if(k==="f")r.f[x]=el.value;else r[k]=el.value;ls.set(crKey(it),JSON.stringify(r));return true;
}
function onRun(e){
  if(onCRun(e))return;
  const el=e.target.closest("[data-run]");if(!el)return;const it=item(view.id);if(!it)return;
  const r=getRun(it),[k,x]=el.dataset.run.split(":");
  if(k==="f")r.f[x]=el.value;else if(k==="chk"){r.chk[x]=el.checked;$("ar"+x)?.classList.toggle("done",el.checked)}else if(k==="note")r.note[x]=el.value;else if(k==="general")r.general=el.value;
  ls.set(runKey(it),JSON.stringify(r));
  if(k==="chk"){const R=atpRows(it),total=R.rows.filter(z=>!z.h).length,done=R.rows.filter((z,i)=>!z.h&&r.chk[i]).length;$("atpCount").textContent=T().atp.prog(done,total);$("atpBar").style.width=(done/total*100)+"%"}
}
$("app").addEventListener("input",onRun);
$("app").addEventListener("change",e=>{
  if(e.target.closest("[data-run]")||e.target.closest("[data-crun]")||e.target.closest("[data-rrun]")){onRun(e);return}
  const c=e.target.closest("[data-chk]");if(!c)return;
  const it=item(view.id),p=pick(it.body);let st=jget("fk-chk-"+view.id,[]);const i=+c.dataset.chk;
  st=c.checked?[...new Set([...st,i])]:st.filter(x=>x!==i);ls.set("fk-chk-"+view.id,JSON.stringify(st));
  c.closest(".chk").classList.toggle("done",c.checked);
  const isH=x=>String(x).trim().startsWith("#"),tot=p.v.filter(x=>!isH(x)).length,done=p.v.filter((x,j)=>!isH(x)&&st.includes(j)).length;$("chkCount").textContent=done+" / "+tot;$("chkBar").style.width=(done/tot*100)+"%";
});
