ight on the operator box).", "Connect the ROCU-10 to the operator box at the **DRIVER** socket. On the ROCU side: power connector on the right (4 pins), communication on the left (10 pins). **Never connect them reversed!**", "Turn on the ROCU and enter password `Q1w2as34`. Then open the C2 (Hatal) application.", "Connect the gun system controller to the operator box at the **GUNNER** socket, turn it on and open the gun system application.", "Make sure the **BLUSDR/INT.COMM** switch is **OFF**.", "Connect a short ETH cable between the operator boxes.", "Connect a long ETH cable between the operator box and the relay Pelican.", "Insert 2 × 2791 batteries in the relay Pelican, or connect a power adapter to its PWR IN. Press the orange RCD button, then the power button (blue light).", "Place the relay box on the tripod.", "Connect the relay cable from the Pelican to the relay box.", "Raise the relay box as high as possible.", "Turn on the vehicle and wait for communication."]}, {"img": "media/um-relay.jpg", "cap": "Relay configuration wiring"}, {"note": "Source: ROBOX brief user manual (Hebrew), DOC00698-A REV.002.", "kind": "note"}]}}, {"id": "dep-container", "sec": "comm-deploy", "type": "guide", "title": {"he": "תצורת קרון שליטה – הקמת עמדה", "en": "Control container configuration – station setup"}, "summary": {"he": "טווח 10 ק״מ · גנרטור, ETH ושיקוף מסכים", "en": "10 km range · generator, ETH and screen mirroring"}, "updated": "2026-11-10", "body": {"he": [{"p": "עבודה מתוך הקרון, דרך התורן והתקשורת הקווית שלו. טווח: **10 ק״מ**."}, {"h": "ציוד (ל־2 ביזונים)"}, {"table": {"head": ["רכיב", "מק״ט", "כמות"], "rows": [["קופסת מפעיל", "ASSY800388-A", "2"], ["ישל״ט ROCU-10 + כבל", "OEM00356 / ASSY800410-A", "2"], ["ישל״ט מערכת נשק + כבל", "OEM00382 / ASSY800409-A", "2"], ["טאבלט מפקד + כבל", "OEM00388 / CBL01305-A", "1"], ["שנאי מתח + כבל", "ASSY800408-A / ASSY800458-A", "2"], ["כבל ETH", "CBL01338-A", "2"]]}}, {"h": "סדר פעולות"}, {"ol": ["הדליקו את גנרטור הקרון (ודאו שהמתג פתוח ולחצו על כפתור ההדלקה).", "הכניסו 2 סוללות 2791, או חברו את שנאי המתח בין מחבר **PWR IN** של קופסת המפעיל לשקע בקרון. לחצו על כפתור **RESET** ברכיב הפחת (נורה כתומה נדלקת), ואז על כפתור הדלקת המערכת (אור ירוק בקופסת המפעיל).", "חברו את ישל״ט ROCU-10 לקופסת המפעיל בשקע **DRIVER**. בצד הישל״ט: מחבר מתח מימין (4 פינים) ומחבר תקשורת משמאל (10 פינים). **חשוב מאוד לא לחבר הפוך!**", "הדליקו את הישל״ט והזינו סיסמה: `Q1w2as34`. אחרי הפתיחה היכנסו לאפליקציית חט״ל.", "חברו את ישל״ט מערכת הנשק לקופסת המפעיל בשקע **GUNNER**, הדליקו אותו והיכנסו לאפליקציית מערכת הנשק.", "ודאו שמתג התקשורת **BLUSDR/INT.COMM** במצב **OFF**.", "חברו כבל ETH בין כל קופסת מפעיל לתקשורת הקווית של הקרון.", "חברו את ישל״ט ROCU-10 לכבל עם מחבר Micro HDMI לשיקוף מסך.", "חברו את ישל״ט מערכת הנשק לכבל עם מחבר HDMI זוויתי לשיקוף מסך.", "הדליקו את הכלי והמתינו לעליית תקשורת."]}, {"img": "media/um-genpanel.jpg", "cap": "פאנל הגנרטור: כפתור הדלקה ומתג"}, {"img": "media/um-container.jpg", "cap": "סכמת חיבורי תצורת קרון שליטה"}, {"note": "מקור: מדריך מפעיל מקוצר – שליחות קטלנית, DOC00698-A REV.002.", "kind": "note"}], "en": [{"p": "Operating from inside the container, through its mast and wired network. Range: **10 km**."}, {"h": "Equipment (for 2 BISONs)"}, {"table": {"head": ["Item", "Part no.", "Qty"], "rows": [["Operator box", "ASSY800388-A", "2"], ["ROCU-10 + cable", "OEM00356 / ASSY800410-A", "2"], ["Gun system controller + cable", "OEM00382 / ASSY800409-A", "2"], ["Commander tablet + cable", "OEM00388 / CBL01305-A", "1"], ["Power adapter + cable", "ASSY800408-A / ASSY800458-A", "2"], ["ETH cable", "CBL01338-A", "2"]]}}, {"h": "Procedure"}, {"ol": ["Start the container generator (switch open, press the power button).", "Insert 2 × 2791 batteries, or connect the power adapter between the operator box **PWR IN** and a container socket. Press **RESET** on the RCD (orange light on), then the system power button (green light on the operator box).", "Connect the ROCU-10 to the operator box at the **DRIVER** socket. On the ROCU side: power connector on the right (4 pins), communication on the left (10 pins). **Never connect them reversed!**", "Turn on the ROCU and enter password `Q1w2as34`. Then open the C2 (Hatal) application.", "Connect the gun system controller to the operator box at the **GUNNER** socket, turn it on and open the gun system application.", "Make sure the **BLUSDR/INT.COMM** switch is **OFF**.", "Connect an ETH cable from each operator box to the container wired network.", "Connect the ROCU-10 to the Micro HDMI cable for screen mirroring.", "Connect the gun system controller to the angled HDMI cable for screen mirroring.", "Turn on the vehicle and wait for communication."]}, {"img": "media/um-genpanel.jpg", "cap": "Generator panel: power button and switch"}, {"img": "media/um-container.jpg", "cap": "Control container configuration wiring"}, {"note": "Source: ROBOX brief user manual (Hebrew), DOC00698-A REV.002.", "kind": "note"}]}}, {"id": "dep-rocu10", "sec": "comm-deploy", "type": "guide", "title": {"he": "ישל״ט ROCU-10 – בקרות ולחצנים", "en": "ROCU-10 controller – controls and buttons"}, "summary": {"he": "מצערת, היגוי, הילוכים ובלם יד", "en": "Throttle, steering, gears and hand brake"}, "updated": "2026-11-10", "body": {"he": [{"img": "media/um-rocu10.jpg", "cap": "ישל״ט ROCU-10"}, {"table": {"head": ["בקרה", "תפקיד"], "rows": [["כפתור הדלקה / כפתור הנעה", "הדלקת הישל״ט / התנעת הכלי"], ["סטיק מצערת", "גז"], ["סטיק היגוי", "היגוי"], ["היגוי רגיש", "היגוי עדין"], ["שינוי טורים", "העלאת / הורדת סל״ד"], ["הילוכים", "D, ‏N, ‏R ו־H/L"], ["בלם יד", "הפעלה / שחרור"], ["השהייה", "עצירת נסיעה"]]}}, {"note": "סיסמת הישל״ט: `Q1w2as34`.", "kind": "tip"}, {"note": "מקור: מדריך מפעיל מקוצר – שליחות קטלנית, DOC00698-A REV.002.", "kind": "note"}], "en": [{"img": "media/um-rocu10.jpg", "cap": "ROCU-10 controller"}, {"table": {"head": ["Control", "Function"], "rows": [["Power / start button", "Turn on the controller / start the vehicle"], ["Throttle stick", "Throttle"], ["Steering stick", "Steering"], ["Sensitive steering", "Fine steering"], ["RPM change", "Raise / lower rpm"], ["Gears", "D, N, R and H/L"], ["Hand brake", "Engage / release"], ["Pause", "Stop driving"]]}}, {"note": "Controller password: `Q1w2as34`.", "kind": "tip"}, {"note": "Source: ROBOX brief user manual (Hebrew), DOC00698-A REV.002.", "kind": "note"}]}}, {"id": "um-safety", "sec": "bison", "type": "guide", "title": {"he": "בטיחות, אחריות ותמיכה", "en": "Safety, responsibility and support"}, "summary": {"he": "חובות, כללי בטיחות, מרחקים ופרטי תמיכה", "en": "Duties, safety rules, distances and support"}, "updated": "2026-11-10", "body": {"he": [{"h": "אחריות וחובות"}, {"ul": ["השימוש בכל חלק של המערכת באחריות המפעיל בלבד.", "כל המפעילים חייבים לעבור את קורס ההכשרה של „שליחות קטלנית” (Roboteam או שותפיה) ולקבל הסמכה לפני הפעלה.", "זהירות בהסרת חלקים, כדי למנוע פגיעה באצבעות ובאיברי גוף.", "**אין לבצע תחזוקה לפני שווידאתם שהביזון דומם לחלוטין.**", "אין להפעיל עם סוללות אחרות מאלה שבמדריך.", "אין להכניס אצבעות או איברים למנגנון ההנעה (הזחלים) בזמן פעולה."]}, {"h": "בטיחות"}, {"ul": ["במערכת חלקים נעים – אין לגעת ביחידה בזמן פעולה.", "חל איסור מוחלט לפרק את המערכת – נזק בלתי הפיך וביטול אחריות.", "אין לגעת בחוטי חשמל חשופים.", "אין לטבול את המערכת במים.", "הפעלה רק על ידי מפעיל מוסמך, ובהשגחה מתמדת (ישירה או דרך הממשק).", "לפני חיבור אנטנה או אביזר לקופסת המפעיל – המערכת כבויה לחלוטין.", "בחיבור אביזר – כל המחברים מחוברים כראוי והכבלים לא נפגעים.", "אין להסתכל ישירות לקרני הלייזר או לתאורת LED (אינפרה־אדום)."]}, {"h": "מרחקים"}, {"table": {"head": ["", ""], "rows": [["מרחק בטיחות מהכלי", "**15 מ׳**"], ["מרחק הפעלה מאנטנות", "מ־0.5 מ׳"], ["מרחק מינימלי בין 2 עמדות מפעיל (BLUSDR)", "2 מ׳"]]}}, {"h": "תמיכה – Roboteam"}, {"p": "אהרון ברט 22, בניין C, פתח תקווה 4951448."}, {"note": "מקור: מדריך מפעיל מקוצר – שליחות קטלנית, DOC00698-A REV.002.", "kind": "note"}], "en": [{"h": "Responsibility"}, {"ul": ["Using any part of the system is the operator’s sole responsibility.", "All operators must complete the “Terminator” training course (Roboteam or partners) and be certified before operation.", "Take care when removing parts to avoid injuring fingers or limbs.", "**Do not perform any maintenance before the BISON is completely stopped.**", "Do not operate with batteries other than those specified.", "Keep fingers and limbs away from the drive (tracks) while running."]}, {"h": "Safety"}, {"ul": ["The system has moving parts – do not touch the unit while it runs.", "Never disassemble the system – irreversible damage and void warranty.", "Do not touch exposed wires.", "Do not immerse the system in water.", "Operate only by a certified operator, under constant supervision (direct or via the interface).", "Turn the system fully off before connecting an antenna or accessory to the operator box.", "When connecting an accessory – all connectors seated properly and cables not damaged.", "Do not look directly into the laser or the LED (infrared) lights."]}, {"h": "Distances"}, {"table": {"head": ["", ""], "rows": [["Safety distance from the vehicle", "**15 m**"], ["Operating distance from antennas", "from 0.5 m"], ["Minimum distance between 2 operator stations (BLUSDR)", "2 m"]]}}, {"h": "Support – Roboteam"}, {"p": "22 Aharon Bart St., Building C, Petah Tikva 4951448, Israel."}, {"note": "Source: ROBOX brief user manual (Hebrew), DOC00698-A REV.002.", "kind": "note"}]}}, {"id": "bison-overview", "sec": "bison", "type": "guide", "title": {"he": "ביזון – נתונים כלליים", "en": "BISON – general data"}, "summary": {"he": "משקל, מידות, מגבלות ובסיס ARGO", "en": "Weight, dimensions, limits and ARGO base"}, "body": {"he": [{"p": "הביזון מבוסס על רכב **ARGO Aurora 950** (8×8) עם מנוע VX 950 V-Twin, שעליו מותקנים המבנה הראשי ומערכות הבקרה הנמוכה והגבוהה. מערכת הבקרה שולטת בהנעה, במצלמות (יום ותרמי), בתקשורת, במערכת הנשק, בפנסים, ברמקול, במיקרופון וב־EMO."}, {"h": "תצורת ביזון"}, {"table": {"head": ["פרמטר", "ערך"], "rows": [["משקל", "950 ק״ג (1,100 ק״ג עם זחלים)"], ["משקל נמדד בניסוי (אוג׳ 2026)", "1,120 ק״ג, ללא נשק וללא מטען"], ["אורך", "3,000 מ״מ"], ["כושר העמסה (יבשה)", "300 ק״ג"], ["אלטרנטור", "55A ב־3000 סל״ד, ‏15A ב־1100 סל״ד"], ["מהירות מרבית", "40 קמ״ש"], ["שיפוע מרבי מאושר (עצירה והחזקה)", "30%"]]}}, {"note": "**מגבלת שיפוע:** לפי ניסוי אוגוסט 2026, הכלי מחזיק את עצמו בבטחה רק עד שיפוע של **30%**. ב־40% הוא מתגלגל מעט אחורה ב־E-STOP, וב־50% הוא לא מחזיק ומתגלגל ברציפות.", "kind": "caution"}, {"note": "**אומי גלגלים:** בניסוי נשבר בורג גלגל ונפרד גלגל בגלל אומים רופפים. יש לבדוק חיזוק אומי גלגלים לפני כל הפעלה (טל״ת).", "kind": "important"}, {"h": "רכב הבסיס ARGO Aurora 950 (לפני הרכבת ערכת הבקרה)"}, {"table": {"head": ["פרמטר", "ערך"], "rows": [["מנוע", "VX 950, ‏V-Twin, הזרקת דלק, קירור מאוורר"], ["שלדה", "8×8"], ["תמסורת", "Admiral w/APS"], ["בלמים", "הידראוליים"], ["מהירות", "40 קמ״ש ביבשה, 5 קמ״ש במים"], ["מיכל דלק", "32 ליטר"], ["צמיגים", "ARGO XT117 25×12-9, חישוק Beadlock"], ["מרווח גחון", "254 מ״מ (צמיגים), 279 מ״מ (זחלים)"], ["משקל", "668 ק״ג"], ["רוחב / גובה", "1,524 / 1,295 מ״מ"]]}}, {"note": "מקור: ROBOX System Technical Data, DOC00672-A REV.001. דוח ניסוי IRONWAVE, אוג׳ 2026.", "kind": "note"}], "en": [{"p": "BISON is based on the **ARGO Aurora 950** (8×8) with a VX 950 V-Twin engine, fitted with the main structure and the low- and high-level control systems. The control system runs the drive, cameras (day and thermal), communications, gun system, lights, speaker, microphone and EMO."}, {"h": "BISON configuration"}, {"table": {"head": ["Parameter", "Value"], "rows": [["Weight", "950 kg (1,100 kg with tracks)"], ["Measured weight in trial (Aug 2026)", "1,120 kg, unarmed and unladen"], ["Length", "3,000 mm"], ["Load capacity (land)", "300 kg"], ["Alternator", "55 A @ 3000 rpm, 15 A @ 1100 rpm"], ["Max speed", "40 km/h"], ["Certified hold-on-grade", "30%"]]}}, {"note": "**Grade limit:** per the August 2026 trial, the vehicle holds position safely only up to a **30%** grade. At 40% it rolls back slightly on E-STOP; at 50% it cannot hold and rolls back continuously.", "kind": "caution"}, {"note": "**Wheel nuts:** in the trial a wheel stud sheared and a wheel separated because of loose nuts. Check wheel nut torque before every operation (Pre-Operation).", "kind": "important"}, {"h": "Base vehicle ARGO Aurora 950 (before control set assembly)"}, {"table": {"head": ["Parameter", "Value"], "rows": [["Engine", "VX 950, V-Twin, EFI, fan cooled"], ["Chassis", "8×8"], ["Transmission", "Admiral w/APS"], ["Brakes", "Hydraulic"], ["Speed", "40 km/h land, 5 km/h water"], ["Fuel tank", "32 L"], ["Tires", "ARGO XT117 25×12-9, beadlock wheel"], ["Ground clearance", "254 mm (tires), 279 mm (tracks)"], ["Weight", "668 kg"], ["Width / height", "1,524 / 1,295 mm"]]}}, {"note": "Source: ROBOX System Technical Data, DOC00672-A REV.001. IRONWAVE trial report, Aug 2026.", "kind": "note"}]}, "updated": "2026-11-10"}, {"id": "um-data", "sec": "bison", "type": "guide", "title": {"he": "נתוני מערכת – לפי מדריך המפעיל", "en": "System data – per the user manual"}, "summary": {"he": "משקל, טווחים, זמני עבודה ונוזלים", "en": "Weight, ranges, run times and fluids"}, "updated": "2026-11-10", "body": {"he": [{"img": "media/um-components.jpg", "cap": "רכיבי המערכת"}, {"table": {"head": ["מאפיין", "ערך"], "rows": [["משקל כלי", "1.1 טון"], ["אורך / רוחב", "3.1 מ׳ / 1.82 מ׳"], ["מהירות מרבית", "~40 קמ״ש"], ["כושר טיפוס", "55% (49.5°)"], ["שיפועי צד", "20°"], ["רדיוס סיבוב", "1.82 מ׳"], ["טווח תקשורת – קרון שליטה", "10 ק״מ"], ["טווח תקשורת – מגנן (ממסר)", "4.5 ק״מ"], ["טווח תקשורת – טקטית (BLUSDR)", "~900 מ׳"], ["זמן עבודה כלי", "15–20 שעות (תלוי בשטח)"], ["זמן עבודה עמדת הפעלה", "4 שעות לזוג סוללות 2791 (בלי מתח חיצוני)"], ["סוג דלק / מיכל", "בנזין 95 / 32 ליטר"], ["שמן מנוע", "CASTROL 10W40, ‏2.3 ליטר"], ["שמן תמסורת", "VALVOLINE 80W90, ‏1.2 ליטר"], ["נוזל בלמים", "DOT4"], ["שמן שרשרת", "PTFE ספריי"], ["גריז", "Multipurpose"]]}}, {"note": "**סתירות בנתונים בין המסמכים:** שמן מנוע – כאן ובטבלת האחזקה המונעת **10W-40**, ובנוהל היומי ובמפרט ARGO **5W-40**. שמן תמסורת – כאן **80W90**, ובנוהל היומי וב־ARGO **75W-90**. כושר טיפוס – כאן 55%. לבירור מול גורם מוסמך לפני מילוי.", "kind": "caution"}, {"note": "מקור: מדריך מפעיל מקוצר – שליחות קטלנית, DOC00698-A REV.002.", "kind": "note"}], "en": [{"img": "media/um-components.jpg", "cap": "System components"}, {"table": {"head": ["Parameter", "Value"], "rows": [["Vehicle weight", "1.1 t"], ["Length / width", "3.1 m / 1.82 m"], ["Max speed", "~40 km/h"], ["Climbing", "55% (49.5°)"], ["Side slope", "20°"], ["Turning radius", "1.82 m"], ["Comms range – control container", "10 km"], ["Comms range – relay", "4.5 km"], ["Comms range – tactical (BLUSDR)", "~900 m"], ["Vehicle working time", "15–20 h (terrain dependent)"], ["Operator station working time", "4 h per pair of 2791 batteries (no external power)"], ["Fuel / tank", "95 octane / 32 L"], ["Engine oil", "CASTROL 10W40, 2.3 L"], ["Transmission oil", "VALVOLINE 80W90, 1.2 L"], ["Brake fluid", "DOT4"], ["Chain oil", "PTFE spray"], ["Grease", "Multipurpose"]]}}, {"note": "**Data conflicts between documents:** engine oil – here and in the preventive maintenance table **10W-40**, in the daily procedure and ARGO spec **5W-40**. Transmission oil – here **80W90**, daily procedure and ARGO **75W-90**. Climbing – 55% here. Confirm with an authorized source before filling.", "kind": "caution"}, {"note": "Source: ROBOX brief user manual (Hebrew), DOC00698-A REV.002.", "kind": "note"}]}}, {"id": "um-panel", "sec": "b-low", "type": "guide", "title": {"he": "פאנל חיווי והדלקה (לפי מדריך המפעיל)", "en": "Indication & power panel (per user manual)"}, "summary": {"he": "48V, בורר ROCU, נוריות FORT, טעינה", "en": "48 V, ROCU selector, FORT LEDs, charging"}, "updated": "2026-11-10", "body": {"he": [{"p": "הפאנל בחזית הכלי. הכלי מודלק במתג ההדלקה שבפאנל. 2 נוריות FORT דולקות ברציפות כשה־FORT מחובר. מתג בורר: **למעלה – ROCU-10**, **למטה – ROCU-1** (שלט מנהלתי)."}, {"img": "media/um-panel.jpg", "cap": "פאנל חיווי והדלקה"}, {"table": {"head": ["רכיב", "תפקיד"], "rows": [["צג אחוז סוללה 48V", "מצב סוללת ה־48V"], ["מתג שליטה ROCU-10/ROCU-1", "בחירת הישל״ט"], ["מתג הפעלת מערכת", "הדלקת המערכת"], ["נוריות FORT-1 / FORT-2", "דולקות ברציפות כשה־FORT מחובר"], ["חיבור לכבל טכנאי", "ETH ו־CAN"], ["חיבור למטען", "טעינה"]]}}, {"note": "מקור: מדריך מפעיל מקוצר – שליחות קטלנית, DOC00698-A REV.002.", "kind": "note"}], "en": [{"p": "The panel is at the front of the vehicle. The vehicle is powered with the panel switch. 2 FORT LEDs stay lit when FORT is connected. Selector: **up – ROCU-10**, **down – ROCU-1** (admin remote)."}, {"img": "media/um-panel.jpg", "cap": "Indication & power panel"}, {"table": {"head": ["Component", "Function"], "rows": [["48 V battery display", "48 V battery status"], ["ROCU-10/ROCU-1 selector", "Choose the controller"], ["System power switch", "Turn the system on"], ["FORT-1 / FORT-2 LEDs", "Steady when FORT is connected"], ["Tech cable connector", "ETH and CAN"], ["Charger connector", "Charging"]]}}, {"note": "Source: ROBOX brief user manual (Hebrew), DOC00698-A REV.002.", "kind": "note"}]}, "group": "tech"}, {"id": "um-dash", "sec": "b-engine", "type": "guide", "title": {"he": "לוח מחוונים בתא המנוע", "en": "Engine compartment dashboard"}, "summary": {"he": "מד דלק, נוריות ושעות מנוע", "en": "Fuel gauge, lights and engine hours"}, "updated": "2026-11-10", "body": {"he": [{"p": "לוח המחוונים בתוך תא המנוע נותן את המידע לטיפולים התקופתיים: **מד דלק**, **נוריות חיווי** ו**שעות עבודה / ק״מ**."}, {"img": "media/um-dashboard.jpg", "cap": "לוח מחוונים"}, {"note": "את שעות המנוע לוקחים מכאן כדי לדעת מתי מגיע טיפול 25 או 100 שעות.", "kind": "tip"}, {"note": "מקור: מדריך מפעיל מקוצר – שליחות קטלנית, DOC00698-A REV.002.", "kind": "note"}], "en": [{"p": "The dashboard inside the engine compartment provides the data for periodic service: **fuel gauge**, **indicator lights** and **working hours / km**."}, {"img": "media/um-dashboard.jpg", "cap": "Dashboard"}, {"note": "Read engine hours here to know when the 25 or 100 hour service is due.", "kind": "tip"}, {"note": "Source: ROBOX brief user manual (Hebrew), DOC00698-A REV.002.", "kind": "note"}]}, "group": "tech"}, {"id": "um-recovery", "sec": "b-mech-gen", "type": "guide", "title": {"he": "חילוץ וגרירה", "en": "Recovery and towing"}, "summary": {"he": "בטיחות, סט חילוץ, סדר פעולות ונקודות ריתום", "en": "Safety, kit, procedure and harness points"}, "updated": "2026-11-10", "body": {"he": [{"h": "בטיחות"}, {"ul": ["להרחיק מהכלים כל מי שלא מעורב בחילוץ.", "רק נקודות חיבור ייעודיות לחילוץ.", "על כל רצועה מותקן **שובר משקל** (בחיבור 2 רצועות בשאקל אחד – שובר משקל על כל אחת).", "גרירה בירידה (שיפוע שלילי): **שני רכבים גוררים** – אחד מלפנים ואחד מאחור, לשתי נקודות הגרירה. ציוד: 2 רצועות 5 מ׳, 2 רצועות 3 מ׳, 4 שאקלים.", "רכב גורר עם כושר גרירה של **2 טון לפחות**, עדיף 4×4. משקל הביזון – 1.2 טון."]}, {"h": "סט חילוץ"}, {"ul": ["רצועה 5 מ׳ (מעל 2 טון)", "רצועה 3 מ׳ (מעל 2 טון)", "4 שאקלים (מעל 2 טון)", "כפפות עבודה", "משקפי מגן"]}, {"img": "media/um-recovery-kit.jpg", "cap": "סט חילוץ"}, {"h": "סדר פעולות"}, {"ol": ["בחרו כיוון חילוץ לפי השטח (קדימה או אחורה).", "בחרו מיקום לכלי המחלץ לפי האחיזה והמהירות שלו.", "חברו לפי הסדר: רצועה 3 מ׳, רצועה 5 מ׳ ושני שאקלים – אחד לאוזן ימין ואחד לאוזן שמאל.", "אם רצועת ה־5 מ׳ לא מספיקה, מאריכים ברצועה נוספת – אבל **רצועת ה־5 מ׳ חייבת להישאר** כדי לספוג את העומס.", "אם יש תקשורת עם הביזון – להעביר ל**„מצב גרירה”** בתוכנה. המצב משחרר את כל הבלמים.", "מתחילים בתיאום עם הנהג ועם מכוון קרקעי, ולא עוצרים עד שהשני כלים יכולים לנסוע בבטחה."]}, {"img": "media/um-harness.jpg", "cap": "נקודות ריתום קדמיות ואחוריות"}, {"img": "media/um-towing.jpg", "cap": "שיטת עגינה – ביזון בתצורת גרירה"}, {"note": "מקור: מדריך מפעיל מקוצר – שליחות קטלנית, DOC00698-A REV.002.", "kind": "note"}], "en": [{"h": "Safety"}, {"ul": ["Keep everyone not involved away from the vehicles.", "Use only dedicated recovery points.", "Fit a **load breaker** on each strap (two straps on one shackle – one on each).", "Towing downhill: **two towing vehicles** – one in front and one behind, on both towing points. Equipment: 2 × 5 m straps, 2 × 3 m straps, 4 shackles.", "Towing vehicle rated for **at least 2 t**, preferably 4×4. BISON weight – 1.2 t."]}, {"h": "Recovery kit"}, {"ul": ["5 m strap (over 2 t)", "3 m strap (over 2 t)", "4 shackles (over 2 t)", "Work gloves", "Safety glasses"]}, {"img": "media/um-recovery-kit.jpg", "cap": "Recovery kit"}, {"h": "Procedure"}, {"ol": ["Choose the recovery direction for the terrain (forward or back).", "Position the recovery vehicle for its grip and speed.", "Connect in this order: 3 m strap, 5 m strap and two shackles – one to the right eye and one to the left eye.", "If the 5 m strap is too short, extend with another strap – but **keep the 5 m strap in the line** to absorb the load.", "If there is communication with the BISON, switch it to **“Tow mode”** in the software. This releases all brakes.", "Start in coordination with the driver and a ground guide, and do not stop until both vehicles can drive safely."]}, {"img": "media/um-harness.jpg", "cap": "Front and rear harness points"}, {"img": "media/um-towing.jpg", "cap": "Rigging – BISON ready for towing"}, {"note": "Source: ROBOX brief user manual (Hebrew), DOC00698-A REV.002.", "kind": "note"}]}, "group": "maint"}, {"id": "um-trouble-mech", "sec": "b-mech-gen", "type": "guide", "title": {"he": "מקרים ותגובות – ביזון מכני", "en": "Cases & responses – BISON mechanical"}, "summary": {"he": "רצועה, אקטואטור גיר, בלמים, התנעה וזחל", "en": "Belt, gear actuator, brakes, starting and tracks"}, "updated": "2026-11-10", "body": {"he": [{"table": {"head": ["מקרה", "סיבה ותגובה"], "rows": [["**הכלי בהילוך, מעלה טורים ולא זז** (לפעמים חריקה ועשן ממכסה המנוע בהוספת גז)", "רצועת הנעה תפוסה או שחוקה. להעביר לניוטרל, להעלות סל״ד ולהחזיר להילוך. אם לא עוזר: רצועה תפוסה – לשחרר במשיכה כלפי חוץ מבסיס הגלגלת. רצועה שחוקה – החלפה על ידי איש אחזקה מוסמך."], ["**במעבר מניוטרל להילוך – תקתוק מהיר והכלי לא נוסע** (התקתוק מהיר יותר עם הסל״ד)", "בוכנת אקטואטור הגיר לא משלימה מהלך. להעביר להילוך הנגדי ולנסות לנסוע, ואז להחזיר להילוך הרצוי. אם לא נפתר – להפסיק ולקרוא לאיש אחזקה."], ["**בנסיעה הכלי מושך לימין או לשמאל**", "ברקס היגוי תפוס בצד אחד, או שרשרת הנעה קרועה."], ["**הכלי מתחיל לנסוע בקפיצה, מתקשה להמשיך, עשן לבן ממכסה המנוע**", "בלם יד תפוס / ברקסים תפוסים / בלם NC תפוס (הכי נפוץ)."], ["**הכלי לא מניע** (הסטרטר עובד)", "אין דלק או שמצבר ה־12V פרוק. למלא דלק / לטעון מצבר."], ["**הזחל רפוי ונראה שעומד לצאת**", "לבדוק את לחץ האוויר בגלגלים באותו צד."]]}}, {"note": "מקור: מדריך מפעיל מקוצר – שליחות קטלנית, DOC00698-A REV.002.", "kind": "note"}], "en": [{"table": {"head": ["Case", "Cause and response"], "rows": [["**In gear, revs up but does not move** (sometimes squeal and smoke from the hood on throttle)", "Drive belt stuck or worn. Shift to neutral, raise rpm and shift back. If not solved: stuck belt – release it by pulling outward from the pulley base. Worn belt – replace by an authorized technician."], ["**Shifting from neutral – fast ticking and no movement** (faster with rpm)", "Gear actuator piston not completing its stroke. Shift to the opposite gear and try to drive, then back to the desired gear. If not solved – stop and call maintenance."], ["**Vehicle pulls right or left**", "Steering brake stuck on one side, or a drive chain is broken."], ["**Starts with a jump, struggles to continue, white smoke from the hood**", "Hand brake / brakes / NC brake stuck (most common)."], ["**Won’t start** (starter works)", "No fuel or 12 V battery flat. Refuel / charge the battery."], ["**Track loose, looks like it will come off**", "Check tire pressure on that side."]]}}, {"note": "Source: ROBOX brief user manual (Hebrew), DOC00698-A REV.002.", "kind": "note"}]}, "group": "trouble"}, {"id": "um-trouble-app", "sec": "b-high-gen", "type": "guide", "title": {"he": "מקרים ותגובות – ישל״ט ואפליקציה (שו״ב)", "en": "Cases & responses – controller and app (C2)"}, "summary": {"he": "תמונה קופאת, ישל״ט לא מגיב, כלי לא מניע, GPS", "en": "Frozen image, unresponsive controller, no start, GPS"}, "updated": "2026-11-10", "body": {"he": [{"table": {"head": ["מקרה", "תגובה (לפי הסדר)"], "rows": [["**תמונה קופאת**", "1. לחיצה על פטריית חירום. 2. „רענן תוכנה” בתפריט ההגדרות. 3. סגירה ופתיחה מחדש של האפליקציה."], ["**הישל״ט לא מגיב**", "1. פטריית חירום. 2. ניתוק וחיבור הישל״ט, בדיקת חיבורים. 3. סגירה ופתיחה של האפליקציה."], ["**הביזון לא מניע**", "1. פטריות החירום משוחררות. 2. מצב FORT – 2 נוריות ירוקות בפאנל החיווי בביזון. 3. דלק במיכל. 4. תקשורת תקינה. 5. סגירה ופתיחה של האפליקציה. 6. כיבוי והדלקה של הביזון ושל קופסת המפעיל, 10 שניות המתנה."], ["**מיקום שגוי במפה**", "1. „רענן תוכנה”. 2. סגירה ופתיחה של האפליקציה. 3. אם לא עוזר – אין GPS (אפשר להמשיך במשימה באופן מלא)."], ["**אחר**", "1. פטריית חירום. 2. „רענן תוכנה”. 3. „רענן כלי”. 4. סגירה ופתיחה של האפליקציה. 5. כיבוי והדלקה של הביזון ושל קופסת המפעיל, 10 שניות המתנה."]]}}, {"note": "מקור: מדריך מפעיל מקוצר – שליחות קטלנית, DOC00698-A REV.002.", "kind": "note"}], "en": [{"table": {"head": ["Case", "Response (in order)"], "rows": [["**Frozen image**", "1. Press the emergency stop. 2. “Refresh software” in the settings menu. 3. Close and reopen the app."], ["**Controller not responding**", "1. Emergency stop. 2. Disconnect and reconnect the controller, check connections. 3. Close and reopen the app."], ["**BISON won’t start**", "1. Emergency stops released. 2. FORT state – 2 green LEDs on the BISON indication panel. 3. Fuel in the tank. 4. Communication OK. 5. Close and reopen the app. 6. Power-cycle the BISON and the operator box, wait 10 s."], ["**Wrong map position**", "1. “Refresh software”. 2. Close and reopen the app. 3. If not solved – no GPS (the mission can fully continue)."], ["**Other**", "1. Emergency stop. 2. “Refresh software”. 3. “Refresh vehicle”. 4. Close and reopen the app. 5. Power-cycle the BISON and the operator box, wait 10 s."]]}}, {"note": "Source: ROBOX brief user manual (Hebrew), DOC00698-A REV.002.", "kind": "note"}]}, "group": "trouble"}, {"id": "dtc-overview", "sec": "comm-tech", "type": "guide", "title": {"he": "מערכת DTC: רכיבים ותצורות עבודה", "en": "DTC system: components & configurations"}, "summary": {"he": "רכיבי הרשת, תצורות וכתובות IP", "en": "Network components, configurations and IP addresses"}, "body": {"he": [{"p": "עמוד השדרה של התקשורת בפרויקט „Terminator” הוא תשתית ה־RF של DTC. כל מקמ״ש במערכת הוא צומת (Node) ברשת **Mesh** אחת."}, {"p": "הממשק מאפשר לראות נתונים חיים מרשת ה־Mesh, להריץ ניתוח ספקטרום של תדרי העבודה, לעקוב אחרי טווח התקשורת האפקטיבי של כל קישור, ולבדוק את מטריצת הממסור בין כל הצמתים."}, {"h": "רכיבי הרשת"}, {"table": {"head": ["רכיב", "תפקיד ברשת"], "rows": [["**Ground Control Station (GCS) – Phase-5**", "תחנת הקרקע המרכזית. בתצורת Mesh היא מציגה את כל הצמתים ברשת."], ["**Operator Box (BLU-SDR)**", "קופסת הקשר של המפעיל. אחת לכל פלטפורמה (פלטפורמה I ופלטפורמה II)."], ["**ROCU-10**", "יחידת השליטה של המפעיל. מתחברת בכבל ל־Operator Box, ודרך הדפדפן המובנה שלה פותחים את הממשק."], ["**רכבים (Bison 1 ו־Bison 2)**", "שני הרכבים הבלתי מאוישים. בכל אחד מהם מקמ״ש DTC."], ["**אנטנת ממסר ראשית**", "אנטנת ממסר קרקעית על נגרר או על תורן חצובה."], ["**רחפן ממסר**", "ממסר אווירי. הגבהה או הזזה שלו מרחיבה ומשפרת את הכיסוי לרכבים."]]}}, {"h": "תצורות עבודה וכתובות IP"}, {"p": "כתובת ה־IP שמקלידים קובעת באיזו תצורה עובדים."}, {"table": {"head": ["תצורה", "כתובת IP", "מה רואים"], "rows": [["**טקטית (BLU-SDR)** – פלטפורמה I", "`192.168.120.131`", "ה־Operator Box של הפלטפורמה שה־ROCU-10 מחובר אליה."], ["**טקטית (BLU-SDR)** – פלטפורמה II", "`192.168.121.131`", "ה־Operator Box של הפלטפורמה שה־ROCU-10 מחובר אליה."], ["**Mesh (Phase-5)**", "`192.168.168.133` (זהה בשתי הפלטפורמות)", "נתונים מכל הצמתים ברשת: GCS, שני הרכבים, אנטנת הממסר הראשית ורחפן הממסר. מאפשר ניתוח של המערכת כולה."]]}}, {"note": "השתמשו בתצורת **Mesh (Phase-5)** כשצריך תמונה מלאה של הרשת, למשל בהקמה, בהחלפת תדר ובאיתור תקלות.", "kind": "tip"}, {"note": "המדריך מכסה רק את הפונקציות וההגדרות החשובות ביותר. לפרטים המלאים ראו את מדריך היצרן (B.A. Microwaves). מקור: מדריך ממשק DTC (Roboteam), 26/10/26.", "kind": "note"}], "en": [{"p": "The central communication backbone of the “Terminator” project is the RF infrastructure supplied by DTC. Every radio in the system is a node in a single **Mesh** network."}, {"p": "The interface lets you view live Mesh data, run a spectral analysis of the operating frequencies, monitor the effective range of each link, and inspect the relay matrix between all nodes."}, {"h": "Network components"}, {"table": {"head": ["Component", "Role in the network"], "rows": [["**Ground Control Station (GCS) – Phase-5**", "Central ground station. In Mesh configuration it provides a view of every node in the network."], ["**Operator Box (BLU-SDR)**", "The operator’s radio box. One per platform (Platform I and Platform II)."], ["**ROCU-10**", "The operator control unit. It connects to the Operator Box by cable, and its built-in browser is used to open the interface."], ["**Vehicles (Bison 1 and Bison 2)**", "The two unmanned ground vehicles, each carrying a DTC radio."], ["**Main relay antenna**", "Ground relay antenna mounted on a trailer or tripod mast."], ["**Relay drone**", "Airborne relay. Raising or repositioning it extends and improves coverage to the vehicles."]]}}, {"h": "Operating configurations and IP addresses"}, {"p": "The IP address you enter determines which configuration you are working in."}, {"table": {"head": ["Configuration", "IP address", "What you see"], "rows": [["**Tactical (BLU-SDR)** – Platform I", "`192.168.120.131`", "The Operator Box of the platform your ROCU-10 is connected to."], ["**Tactical (BLU-SDR)** – Platform II", "`192.168.121.131`", "The Operator Box of the platform your ROCU-10 is connected to."], ["**Mesh (Phase-5)**", "`192.168.168.133` (same for both platforms)", "Data from every node: GCS, both vehicles, main relay antenna and relay drone. Allows analysis of the complete system."]]}}, {"note": "Use the **Mesh (Phase-5)** configuration when you need the full picture of the network, for example during setup, frequency changes and troubleshooting.", "kind": "tip"}, {"note": "This guide covers only the most important functions and settings. For complete details, see the full manufacturer manual (B.A. Microwaves). Source: DTC Operator Interface Guide (Roboteam), 26/10/26.", "kind": "note"}]}, "updated": "2026-11-10"}, {"id": "dtc-glossary", "sec": "comm-tech", "type": "guide", "title": {"he": "מילון מונחים – DTC", "en": "Glossary – DTC"}, "summary": {"he": "המונחים שמופיעים בממשק", "en": "Terms used in the interface"}, "body": {"he": [{"table": {"head": ["מונח", "הסבר"], "rows": [["**BLU-SDR**", "קופסת הקשר של המפעיל (Operator Box). גם שם התצורה הטקטית."], ["**dB / dBm**", "יחידות ליחס אות (SNR, ב־dB) ולעוצמת קליטה מוחלטת (Levels, ב־dBm)."], ["**GCS**", "תחנת קרקע (Ground Control Station)."], ["**Mesh**", "רשת שבה כל מקמ״ש יכול לממסר תעבורה עבור האחרים."], ["**Node**", "כל מקמ״ש שמשתתף ברשת ה־Mesh (צומת)."], ["**Occupancy**", "החלק מרוחב הפס שצומת מנצל, באחוזים."], ["**Phase-5**", "המקמ״ש של ה־GCS. גם שם תצורת ה־Mesh."], ["**Preset**", "סט הגדרות שמור של המקמ״ש."], ["**Relay**", "העברת אות ממקמ״ש למקמ״ש כדי להגדיל טווח (ממסור)."], ["**RF**", "תדר רדיו."], ["**ROCU-10**", "יחידת השליטה של המפעיל, שדרכה פותחים את הממשק."], ["**SNR**", "יחס אות לרעש. גבוה יותר = טוב יותר."], ["**Tx / Rx**", "שידור / קליטה."]]}}], "en": [{"table": {"head": ["Term", "Definition"], "rows": [["**BLU-SDR**", "The Operator Box radio. Also the name of the Tactical configuration."], ["**dB / dBm**", "Units for signal ratio (SNR, in dB) and absolute received power (Levels, in dBm)."], ["**GCS**", "Ground Control Station."], ["**Mesh**", "A network in which every radio can relay traffic for the others."], ["**Node**", "Any radio participating in the Mesh network."], ["**Occupancy**", "The share of bandwidth a node is using, in percent."], ["**Phase-5**", "The GCS radio. Also the name of the Mesh configuration."], ["**Preset**", "A saved set of radio settings."], ["**Relay**", "Passing a signal on from one radio to another to extend range."], ["**RF**", "Radio frequency."], ["**ROCU-10**", "The operator control unit used to open the interface."], ["**SNR**", "Signal-to-noise ratio. Higher is better."], ["**Tx / Rx**", "Transmit / receive."]]}}]}, "updated": "2026-11-10"}, {"id": "dtc-login", "sec": "comm-radio", "type": "guide", "title": {"he": "התחברות לממשק DTC", "en": "Logging in to the DTC interface"}, "summary": {"he": "כתובות IP, סיסמאות ושלבי כניסה", "en": "IP addresses, passwords and login steps"}, "body": {"he": [{"h": "לפני שמתחילים"}, {"ul": ["ה־ROCU-10 מחובר בכבל ל־Operator Box (החיבור הקווי הרגיל).", "ה־Operator Box דולק.", "ידוע באיזו תצורה עובדים ומה כתובת ה־IP שלה (ראו „מערכת DTC: רכיבים ותצורות עבודה”)."]}, {"h": "שלבי ההתחברות"}, {"ol": ["חברו את ה־ROCU-10 ל־Operator Box בכבל.", "פתחו את הדפדפן המובנה ב־ROCU-10.", "הקלידו בשורת הכתובת את כתובת ה־IP של התצורה ולחצו Enter: טקטית פלטפורמה I `192.168.120.131`, טקטית פלטפורמה II `192.168.121.131`, Mesh `192.168.168.133`.", "כשהכתובת נכונה, נפתח מסך הכניסה.", "השאירו את שדה **Username** ריק. בשדה **Password** בלבד הקלידו **Hatal**.", "אם הסיסמה לא מתקבלת, נסו **Eastwood**.", "לחצו על כפתור הכניסה. נפתח מסך הבית (Dashboard)."]}, {"img": "media/dtc-01-login.png", "cap": "מסך הכניסה לממשק"}, {"note": "אם מסך הכניסה לא מופיע, בדקו את הכבל בין ה־ROCU-10 ל־Operator Box וודאו שכתובת ה־IP מתאימה לתצורה.", "kind": "tip"}], "en": [{"h": "Before you start"}, {"ul": ["The ROCU-10 is connected by cable to the Operator Box (the normal wired connection).", "The Operator Box is powered on.", "You know which configuration you need and its IP address (see “DTC system: components & configurations”)."]}, {"h": "Login procedure"}, {"ol": ["Connect the ROCU-10 to the Operator Box with the wired cable.", "Open the built-in web browser on the ROCU-10.", "Type the IP address for your configuration and press Enter: Tactical Platform I `192.168.120.131`, Tactical Platform II `192.168.121.131`, Mesh `192.168.168.133`.", "When the correct address is entered, the login screen opens.", "Leave the **Username** field empty. In the **Password** field only, enter **Hatal**.", "If that password is not accepted, try **Eastwood**.", "Click the login button. The Home screen (Dashboard) opens."]}, {"img": "media/dtc-01-login.png", "cap": "Interface login screen"}, {"note": "If the login screen does not appear, check the cable between the ROCU-10 and the Operator Box and confirm that the IP address matches your configuration.", "kind": "tip"}]}, "updated": "2026-11-10"}, {"id": "dtc-spectrum", "sec": "comm-radio", "type": "guide", "title": {"he": "סריקת ספקטרום (Spectrum Scan)", "en": "Spectrum Scan"}, "summary": {"he": "מציאת טווח התדרים הנקי ביותר", "en": "Finding the cleanest frequency range"}, "body": {"he": [{"p": "מריצים סריקת ספקטרום כשמגיעים לאזור פעילות חדש, כדי למצוא את טווח התדרים עם הכי מעט הפרעות."}, {"path": "Apps > Spectrum Scan", "label": "פתיחה:"}, {"note": "מריצים סריקה **רק כשהרכבים קרובים למפעיל**, כחלק מההכנה למשימה. **אסור להריץ סריקה במהלך פעילות.** כשמקמ״ש מתחיל סריקה התקשורת נופלת לרגע, ורכב רחוק עלול לא להתחבר מחדש כמו שצריך.", "kind": "caution"}, {"h": "הרצת הסריקה"}, {"ol": ["היכנסו ל־**Apps > Spectrum Scan**.", "תחת **Scan Settings** הגדירו **Start frequency** ו־**Stop frequency** של טווח הסריקה.", "לחצו **Start Scan** בתחתית הדף והמתינו שהגרף יתמלא."]}, {"img": "media/dtc-07-spectrum.png", "cap": "Spectrum Scan. המסגרת האדומה מסמנת טווח עם הפרעות מעטות."}, {"h": "קריאת התוצאות"}, {"ul": ["**קפיצות** (עליות חדות וחריגות בגרף) מעידות על הפרעות. הימנעו מהתדרים האלה.", "בחרו טווח תדרים עם הפרעות מעטות, כמו הטווח שמסומן באדום בתמונה."]}, {"note": "אם התדר שנבחר שונה מהתדר הנוכחי, עברו ל־„החלפת תדר עבודה”.", "kind": "note"}], "en": [{"p": "Run a spectrum scan when you arrive in a new area of operations, to find the frequency range with the least interference."}, {"path": "Apps > Spectrum Scan", "label": "To open:"}, {"note": "Run a spectrum scan **only when the vehicles are close to the operator**, as part of pre-mission preparation. **Never run it during an active operation.** When a radio starts a scan, communication drops momentarily. If a vehicle is far away, it may fail to reconnect properly.", "kind": "caution"}, {"h": "Running the scan"}, {"ol": ["Go to **Apps > Spectrum Scan**.", "Under **Scan Settings**, set the **Start frequency** and **Stop frequency** of the scan range.", "Click **Start Scan** at the bottom of the page and wait for the chart to fill in."]}, {"img": "media/dtc-07-spectrum.png", "cap": "Spectrum Scan. The red box marks a range with minor interference."}, {"h": "Reading the results"}, {"ul": ["**Spikes** (sudden, abnormal jumps in the chart) indicate interference. Avoid those frequencies.", "Choose a frequency range where interference is minor, such as the range marked in red in the figure."]}, {"note": "If the chosen frequency differs from the current one, continue to “Changing the operating frequency”.", "kind": "note"}]}, "updated": "2026-11-10"}, {"id": "dtc-freq", "sec": "comm-radio", "type": "guide", "title": {"he": "החלפת תדר עבודה", "en": "Changing the operating frequency"}, "summary": {"he": "עדכון כל הרשת או מקמ״ש אחר מקמ״ש", "en": "Update the whole network or radio by radio"}, "body": {"he": [{"note": "אם התדר שנבחר שונה מהתדר הנוכחי, חובה להגדיר **את אותו תדר בכל המקמ״שים**: שני הרכבים, שתי קופסאות ה־Operator Box, אנטנת הממסר הראשית (חצובה) ורחפן הממסר. מקמ״ש שלא יוגדר לתדר החדש יאבד קשר עם הרשת.", "kind": "important"}, {"note": "לפני שמשנים משהו, **רשמו את התדר הנוכחי**. אם התקשורת גרועה יותר אחרי השינוי, אפשר לחזור אליו.", "kind": "tip"}, {"h": "אפשרות א׳ (מומלצת): עדכון כל הצמתים בפעולה אחת"}, {"p": "כל המקמ״שים חייבים להיות **דולקים ומחוברים לרשת ה־Mesh** לפני שמתחילים."}, {"ol": ["היכנסו ל־**Global Setup > General Settings**.", "תחת **Update Settings** העבירו את **Update all nodes** ל־**Yes**.", "שנו **רק את התדר** (**Presets > Mesh Settings > Frequency**). אל תשנו שום הגדרה אחרת.", "שמרו, הפעילו מחדש את כל המקמ״שים ובדקו (ראו „אחרי ההחלפה”)."]}, {"img": "media/dtc-08-general.png", "cap": "General Settings עם האפשרות Update all nodes"}, {"h": "אפשרות ב׳: הגדרה ידנית בכל מקמ״ש"}, {"ol": ["בכל מקמ״ש היכנסו ל־**Presets > Mesh Settings**.", "באזור **Transmitter** הקלידו את הערך החדש בשדה **Frequency**.", "שמרו.", "חזרו על הפעולה בכל מקמ״ש, לפי הסדר שבטבלה."]}, {"img": "media/dtc-09-mesh.png", "cap": "Mesh Settings. שדה Frequency נמצא באזור Transmitter."}, {"table": {"head": ["סדר", "מקמ״ש"], "rows": [["1", "רכבים: Bison 1 ו־Bison 2"], ["2", "רחפן ממסר"], ["3", "תחנת קרקע (GCS)"], ["4", "Operator Box 1 ו־2"]]}}, {"note": "מגדירים קודם את המקמ״שים הרחוקים ביותר, ואת ה־Operator Box אחרונים, כדי לא לאבד את הדרך למקמ״ש לפני שהוא עודכן.", "kind": "note"}, {"h": "אחרי ההחלפה"}, {"ol": ["הפעילו מחדש את כל המקמ״שים.", "פתחו שוב את הממשק.", "ודאו שכל המקמ״שים מוגדרים ומתקשרים באותה רשת (בדקו ב־Tactical Display וב־Node Table)."]}], "en": [{"note": "If the frequency you choose differs from the current one, you must set the **same frequency on every radio**: both vehicles, both Operator Boxes, the main relay antenna (tripod) and the relay drone. Any radio not set to the new frequency will lose communication with the network.", "kind": "important"}, {"note": "Before you change anything, **write down the current frequency**. If communication is worse after the change, you can return to it.", "kind": "tip"}, {"h": "Option A (recommended): update all nodes in one action"}, {"p": "All radios must be **powered on and connected to the Mesh network** before you start."}, {"ol": ["Go to **Global Setup > General Settings**.", "Under **Update Settings**, set **Update all nodes** to **Yes**.", "Change **only the frequency** (**Presets > Mesh Settings > Frequency**). Do not change any other settings.", "Save, then restart all radios and verify (see “After the change”)."]}, {"img": "media/dtc-08-general.png", "cap": "General Settings with the Update all nodes option"}, {"h": "Option B: configure each radio manually"}, {"ol": ["On each radio, go to **Presets > Mesh Settings**.", "In the **Transmitter** section, enter the new value in the **Frequency** field.", "Save.", "Repeat on every radio, following the order in the table."]}, {"img": "media/dtc-09-mesh.png", "cap": "Mesh Settings. The Frequency field is in the Transmitter section."}, {"table": {"head": ["Order", "Radio"], "rows": [["1", "Vehicles: Bison 1 and Bison 2"], ["2", "Relay drone"], ["3", "Ground Control Station (GCS)"], ["4", "Operator Boxes 1 and 2"]]}}, {"note": "The most distant radios are configured first and the Operator Boxes last, so you do not lose your path to a radio before it has been updated.", "kind": "note"}, {"h": "After the change"}, {"ol": ["Restart all radios.", "Open the interface again.", "Confirm that every radio is configured and communicating on the same network (check the Tactical Display and the Node Table)."]}]}, "updated": "2026-11-10"}, {"id": "dtc-tactical", "sec": "comm-mon", "type": "guide", "title": {"he": "Tactical Display – איכות הקשר", "en": "Tactical Display – link quality"}, "summary": {"he": "סולם צבעים ומה עושים כשהקישור נחלש", "en": "Color scale and what to do when the link weakens"}, "body": {"he": [{"note": "ה־Tactical Display הוא כרגע **המדד החשוב ביותר לאיכות התקשורת**. לפיו מחליטים מתי רכב חייב להפסיק להתקדם.", "kind": "important"}, {"path": "Apps > Tactical Display", "label": "פתיחה:"}, {"p": "המפה מציגה כל מקמ״ש שמחובר כרגע לרשת הממסור: Bison 1 ו־2, אנטנת הממסר הראשית, רחפן הממסר וקופסאות ה־BLU-SDR. כל מקמ״ש מופיע כתגית עם השם שלו. אפשר לגרור את התגיות על המפה כדי לפזר אותן ולקרוא בקלות. המיקום של תגית על המפה לא משנה."}, {"img": "media/dtc-06-tactical.png", "cap": "Tactical Display"}, {"h": "קריאת חיצי הקישור"}, {"ul": ["**חץ יוצא:** איכות האות המשודר.", "**חץ נכנס:** איכות האות הנקלט."]}, {"p": "כשאיכות הקישור משתנה, צבע החץ משתנה בהתאם. תמיד שואפים לעבוד בטווח **כחול עד ירוק**."}, {"h": "סולם איכות האות"}, {"table": {"head": ["רמה", "צבע", "איכות הקישור", "מה עושים"], "rows": [["10–12", {"sw": "#19d3f0", "t": "כחול"}, "מצוינת", "עבודה רגילה."], ["7–9", {"sw": "#22e02a", "t": "ירוק"}, "טובה", "עבודה רגילה."], ["5–6", {"sw": "#e0f03a", "t": "ירוק־צהוב / צהוב"}, "בינונית, הקישור נחלש", "לעקוב מקרוב ולהתכונן לפעול."], ["4", {"sw": "#ff8a1f", "t": "כתום"}, "הנחתה משמעותית", "לפעול עכשיו: לעצור את ההתקדמות ולשפר את הממסר."], ["1–3", {"sw": "#ff2b2b", "t": "אדום"}, "גרועה, קרוב לאובדן קישור", "לפעול מיד."], ["0", {"sw": "#a01010", "t": "אדום כהה"}, "אין קישור שמיש", "לשחזר את הקישור."]]}}, {"note": "כשחץ הופך ל**כתום**, זו כבר הנחתה משמעותית של האות. **אל תמשיכו להתקדם עם הרכב.**", "kind": "caution"}, {"h": "כשאיכות הקישור יורדת"}, {"ol": ["עצרו את התקדמות הרכב.", "אם צריך, החזירו את הרכב שמתקרב לאובדן קישור לאזור עם כיסוי טוב יותר.", "הגביהו או הזיזו את רחפן הממסר.", "במסך הזה ודאו שלאנטנת הממסר הראשית (נגרר/חצובה) יש קישור טוב לרחפן, ושלרחפן יש קישור טוב לרכב."]}], "en": [{"note": "The Tactical Display is currently the **most important indicator of communication quality**. Use it to decide when a vehicle must stop advancing.", "kind": "important"}, {"path": "Apps > Tactical Display", "label": "To open:"}, {"p": "The map shows every radio currently connected to the relay network: Bison 1 and 2, the main relay antenna, the relay drone and the BLU-SDR Operator Boxes. Each radio appears as a tag with its name. You can drag the tags to spread them out for easier reading; the position of a tag on the map is not critical."}, {"img": "media/dtc-06-tactical.png", "cap": "Tactical Display"}, {"h": "Reading the link arrows"}, {"ul": ["**Outgoing arrow:** quality of the signal being transmitted.", "**Incoming arrow:** quality of the signal being received."]}, {"p": "When link quality changes, the arrow color changes accordingly. Always aim to operate in the **blue to green** range."}, {"h": "Signal quality scale"}, {"table": {"head": ["Level", "Color", "Link quality", "What to do"], "rows": [["10–12", {"sw": "#19d3f0", "t": "Blue"}, "Excellent", "Normal operation."], ["7–9", {"sw": "#22e02a", "t": "Green"}, "Good", "Normal operation."], ["5–6", {"sw": "#e0f03a", "t": "Yellow-green / Yellow"}, "Fair, link degrading", "Monitor closely and prepare to act."], ["4", {"sw": "#ff8a1f", "t": "Orange"}, "Significant attenuation", "Act now: stop the advance and improve the relay."], ["1–3", {"sw": "#ff2b2b", "t": "Red"}, "Poor, approaching link loss", "Act immediately."], ["0", {"sw": "#a01010", "t": "Dark red"}, "No usable link", "Recover the link."]]}}, {"note": "When an arrow turns **orange**, it already indicates significant signal attenuation. **Do not continue advancing the vehicle.**", "kind": "caution"}, {"h": "When link quality drops"}, {"ol": ["Stop the vehicle’s advance.", "If needed, move the vehicle that is approaching link loss back toward better coverage.", "Raise or reposition the relay drone.", "On this screen, confirm that the main relay antenna (trailer/tripod) has a good link to the relay drone, and that the drone has a good link to the vehicle."]}]}, "updated": "2026-11-10"}, {"id": "dtc-nodetable", "sec": "comm-mon", "type": "guide", "title": {"he": "Node Table – טבלת צמתים", "en": "Node Table"}, "summary": {"he": "סטטוס כל המקמ״שים ברשת", "en": "Status of every radio in the network"}, "body": {"he": [{"path": "Status > Node Table", "label": "פתיחה:"}, {"p": "הטבלה מציגה כל תחנה פעילה ברשת ה־Mesh, ונותנת תמונת מצב של החיבורים, איכות הממסור והקישורים בין התחנות."}, {"img": "media/dtc-10-nodetable.png", "cap": "Node Table (תצוגת Summary)"}, {"table": {"head": ["עמודה", "מה היא אומרת"], "rows": [["**ID / Unit Name / IP Address**", "מזהה של כל מקמ״ש ברשת."], ["**Battery**", "מתח ההזנה של המקמ״ש."], ["**Temp**", "טמפרטורת המעבד."], ["**Software version**", "גרסת הקושחה שמותקנת במקמ״ש."], ["**Occupancy**", "עומס רוחב הפס של המקמ״ש, באחוזים."], ["**Tx Retries**", "ניסיונות שידור חוזרים. בודקים לפיה שהמקמ״ש משדר כמו שצריך."]]}}, {"note": "**Occupancy מעל 20% היא קריטית.** מקמ״ש עם עומס גבוה מעמיס על כל הרשת.", "kind": "caution"}], "en": [{"path": "Status > Node Table", "label": "To open:"}, {"p": "The Node Table lists every active station in the Mesh network and gives a snapshot of connection status, relay quality and the links between stations."}, {"img": "media/dtc-10-nodetable.png", "cap": "Node Table (Summary view)"}, {"table": {"head": ["Column", "What it tells you"], "rows": [["**ID / Unit Name / IP Address**", "Identifies each radio in the network."], ["**Battery**", "Supply voltage of the radio."], ["**Temp**", "Processor temperature."], ["**Software version**", "Firmware version installed on the radio."], ["**Occupancy**", "Bandwidth load of the radio, in percent."], ["**Tx Retries**", "Transmission retries. Use it to confirm that the radio is transmitting properly."]]}}, {"note": "**An Occupancy above 20% is critical.** A radio with high occupancy loads the whole network.", "kind": "caution"}]}, "updated": "2026-11-10"}, {"id": "dtc-quality", "sec": "comm-mon", "type": "guide", "title": {"he": "Quality Matrix – מטריצת איכות", "en": "Quality Matrix"}, "summary": {"he": "איכות הקישור בין כל זוג מקמ״שים", "en": "Link quality between every pair of radios"}, "body": {"he": [{"path": "Status > Quality Matrix", "label": "פתיחה:"}, {"p": "המטריצה מציגה את איכות השידור והממסור בין כל זוג מקמ״שים ברשת."}, {"table": {"head": ["צבע", "משמעות"], "rows": [[{"sw": "#22e02a", "t": "ירוק"}, "איכות קישור טובה."], [{"sw": "#ff2b2b", "t": "אדום"}, "איכות קישור גרועה."], [{"sw": "#a01010", "t": "אדום כהה"}, "קרוב לאובדן תקשורת."]]}}, {"img": "media/dtc-11-quality.png", "cap": "Quality Matrix"}, {"note": "תאים אדומים או אדומים כהים = קישור חלש בין זוג המקמ״שים. הזיזו את הרכב או את רחפן הממסר.", "kind": "tip"}], "en": [{"path": "Status > Quality Matrix", "label": "To open:"}, {"p": "The Quality Matrix shows the transmission and relay quality between every pair of radios in the network."}, {"table": {"head": ["Color", "Meaning"], "rows": [[{"sw": "#22e02a", "t": "Green"}, "Good link quality."], [{"sw": "#ff2b2b", "t": "Red"}, "Poor link quality."], [{"sw": "#a01010", "t": "Dark red"}, "Approaching loss of communication."]]}}, {"img": "media/dtc-11-quality.png", "cap": "Quality Matrix"}, {"note": "Red or dark red cells mean a weak link between that pair of radios. Reposition the vehicle or the relay drone.", "kind": "tip"}]}, "updated": "2026-11-10"}, {"id": "dtc-levels", "sec": "comm-mon", "type": "guide", "title": {"he": "Levels – SNR ועוצמת אות", "en": "Levels – SNR and signal strength"}, "summary": {"he": "איך לקרוא את טבלת ה־SNR", "en": "How to read the SNR table"}, "body": {"he": [{"path": "Status > Levels", "label": "פתיחה:"}, {"p": "בוחרים את התצוגה בבורר שבפינה הימנית העליונה."}, {"table": {"head": ["תצוגה", "מה היא מראה"], "rows": [["**SNR**", "יחס אות לרעש ב־dB. מדד ישיר לכמה הקישור באמת נקי, והוא קובע אם הרשת יכולה להעביר נתונים בלי שגיאות."], ["**Levels**", "עוצמת האות הנקלטת בפועל בין כל הקישורים ברשת. מראה את רמת ההנחתה או את עוצמת השידור הגולמית."]]}}, {"img": "media/dtc-12-levels.png", "cap": "מסך Levels בתצוגת SNR. המסגרת האדומה מסמנת את הערכים של צומת 1."}, {"h": "איך קוראים את הטבלה"}, {"ul": ["השורות הן המקמ״ש **הקולט** (Rx) והעמודות הן המקמ״ש **המשדר** (Tx). כל תא הוא הערך של הקישור בין שני המקמ״שים.", "**מספר גבוה יותר = קישור טוב יותר.** בתצוגת Levels הערכים שליליים, ולכן ערך רחוק יותר מ־‎−100 (קרוב יותר לאפס) הוא טוב יותר.", "הערך של מקמ״ש מול עצמו (האלכסון) לא רלוונטי. מתעלמים ממנו.", "אם קישור חלש, פועלים כמו ב־Tactical Display: מחזירים את הרכב לאחור או משפרים את מיקום רחפן הממסר."]}, {"h": "דוגמה (לפי התמונה)"}, {"p": "בעמודה של צומת 1: צומת 2 קולט את צומת 1 ב־**32.0 dB**, צומת 4 ב־**28.9 dB** וצומת 10 ב־**25.8 dB**. כלומר לצומת 1 יש את הקישור החזק ביותר עם צומת 2 ואת החלש ביותר עם צומת 10. התא שבו צומת 1 פוגש את עצמו לא נלקח בחשבון."}], "en": [{"path": "Status > Levels", "label": "To open:"}, {"p": "Choose the view with the selector at the top right."}, {"table": {"head": ["View", "What it shows"], "rows": [["**SNR**", "Signal-to-noise ratio in dB. A direct measure of how clean the link really is, and whether the network can pass data without errors."], ["**Levels**", "Physical received signal strength between all links in the network. Shows the level of attenuation or the raw transmit strength."]]}}, {"img": "media/dtc-12-levels.png", "cap": "Levels screen, SNR view. The red box marks the values for Node 1."}, {"h": "How to read the table"}, {"ul": ["Rows are the **receiving** radio (Rx) and columns are the **transmitting** radio (Tx). Each cell is the value for the link between those two radios.", "**A higher number means better link quality.** In the Levels view the values are negative, so a value further above −100 (closer to zero) is better.", "A radio’s value with itself (the diagonal) is not relevant. Ignore it.", "If a link is weak, act as you would for the Tactical Display: move the vehicle back, or improve the position of the relay drone."]}, {"h": "Example (from the figure)"}, {"p": "In the column for Node 1, Node 2 receives Node 1 at **32.0 dB**, Node 4 at **28.9 dB** and Node 10 at **25.8 dB**. Node 1 has its strongest link with Node 2 and its weakest with Node 10. The cell where Node 1 meets itself is ignored."}]}, "updated": "2026-11-10"}, {"id": "dtc-dashboard", "sec": "comm-mon", "type": "guide", "title": {"he": "מסך הבית ותפריטי הממשק", "en": "Home screen & interface menus"}, "summary": {"he": "שורת הסטטוס, לוח המידע והתפריט", "en": "Status bar, info panel and menu"}, "body": {"he": [{"p": "אחרי הכניסה הממשק נפתח במסך הבית. יש בו שלושה אזורים: שורת הסטטוס העליונה, לוח המידע על היחידה והרשת, ותפריט הניווט משמאל."}, {"img": "media/dtc-02-dashboard.png", "cap": "מסך הבית"}, {"h": "שורת הסטטוס העליונה"}, {"p": "מופיעה בראש כל דף."}, {"img": "media/dtc-03-statusbar.png", "cap": "שורת הסטטוס"}, {"table": {"head": ["רכיב", "תיאור"], "rows": [["**שם היחידה המחוברת**", "משמאל, מתחת ל־„NETNode Mesh IP Radio”. זה המקמ״ש שנכנסתם אליו."], ["**תדר מוגדר**", "תדר העבודה שמוגדר כרגע במקמ״ש (למשל 2025 MHz)."], ["**Mesh Zone**", "רשת ה־Mesh שהמקמ״ש שייך אליה."], ["**Node ID**", "המזהה של המקמ״ש ברשת ה־Mesh."], ["**חיווי חיבור קווי**", "מראה שאתם מחוברים למקמ״ש בחיבור קווי."], ["**Preset**", "ה־Preset הפעיל כרגע במקמ״ש."], ["**פס מצב חיבור**", "בצד הימני הקיצוני. חיווי אדום = כשל בחיבור."]]}}, {"h": "לוח מידע על היחידה והרשת"}, {"img": "media/dtc-04-panel.png", "cap": "לוח מידע על היחידה והרשת"}, {"table": {"head": ["אזור", "שדה", "תיאור"], "rows": [["Unit Information", "Unit name", "שם המקמ״ש."], ["Unit Information", "IP address", "כתובת ה־IP של המקמ״ש."], ["Unit Information", "Voltage / Temperature", "מתח הזנה וטמפרטורת היחידה."], ["Unit Information", "Tx retries", "מספר ניסיונות השידור החוזרים."], ["Mesh Information", "Mesh ID / Node ID", "מזהי הרשת והצומת."], ["Mesh Information", "Total nodes", "מספר הצמתים ברשת כרגע, מתוך המקסימום (למשל 1 of 24)."], ["Mesh Information", "Occupancy", "עומס רוחב הפס של הצומת, באחוזים."], ["Remote Nodes", "Node list", "הצמתים שמשתתפים ברשת הממסור."]]}}, {"h": "תפריט הניווט"}, {"img": "media/dtc-05-menu.png", "cap": "תפריט הניווט"}, {"table": {"head": ["פריט בתפריט", "מה יש בו"], "rows": [["**שורת חיפוש**", "מציאה מהירה של הגדרה או פונקציה."], ["**Dashboard**", "חזרה למסך הבית."], ["**Apps**", "פונקציות מבצעיות, כולל Tactical Display ו־Spectrum Scan."], ["**Status**", "סטטוס חי: ערכי SNR, מטריצת איכות ה־Mesh, ניצול מעבד ואיכות הממסור."], ["**Global Setup**", "הגדרות לכל הרשת, כולל General Settings ו־Update all nodes."], ["**Presets**", "הגדרות המקמ״ש לפי Preset, כולל Mesh Settings ותדר העבודה."], ["**System**", "כלי מערכת וניהול."]]}}], "en": [{"p": "After you log in, the interface opens on the Home screen. It has three areas: the top status bar, the unit and mesh information panel, and the navigation menu on the left."}, {"img": "media/dtc-02-dashboard.png", "cap": "Home screen overview"}, {"h": "Top status bar"}, {"p": "Shown at the top of every page."}, {"img": "media/dtc-03-statusbar.png", "cap": "Top status bar"}, {"table": {"head": ["Element", "Description"], "rows": [["**Connected unit name**", "On the left, under “NETNode Mesh IP Radio”. This is the radio you are logged in to."], ["**Configured frequency**", "The operating frequency currently set on the radio (for example, 2025 MHz)."], ["**Mesh Zone**", "The Mesh network the radio belongs to."], ["**Node ID**", "The radio’s identifier within the Mesh network."], ["**Wired connection indicator**", "Shows that you are connected over the wired connection."], ["**Preset**", "The preset currently active on the radio."], ["**Connection status bar**", "Far right. A red indication means a connection failure."]]}}, {"h": "Unit and mesh information panel"}, {"img": "media/dtc-04-panel.png", "cap": "Unit and mesh information panel"}, {"table": {"head": ["Section", "Field", "Description"], "rows": [["Unit Information", "Unit name", "Name of the radio."], ["Unit Information", "IP address", "IP address of the radio."], ["Unit Information", "Voltage / Temperature", "Supply voltage and unit temperature."], ["Unit Information", "Tx retries", "Number of transmission retries."], ["Mesh Information", "Mesh ID / Node ID", "Network and node identifiers."], ["Mesh Information", "Total nodes", "Nodes currently in the network, out of the maximum (for example, 1 of 24)."], ["Mesh Information", "Occupancy", "Bandwidth load of this node, in percent."], ["Remote Nodes", "Node list", "The nodes participating in the Mesh relay network."]]}}, {"h": "Navigation menu"}, {"img": "media/dtc-05-menu.png", "cap": "Navigation menu"}, {"table": {"head": ["Menu item", "What it contains"], "rows": [["**Search bar**", "Find a specific setting or function quickly."], ["**Dashboard**", "Returns to the Home screen."], ["**Apps**", "Operational functions, including Tactical Display and Spectrum Scan."], ["**Status**", "Live status: SNR values, the Mesh quality matrix, CPU usage and relay quality."], ["**Global Setup**", "Network-wide settings, including General Settings and Update all nodes."], ["**Presets**", "Radio settings saved per preset, including Mesh Settings and the operating frequency."], ["**System**", "System tools and administration."]]}}]}, "updated": "2026-11-10"}, {"id": "dtc-checklist", "sec": "comm", "type": "checklist", "title": {"he": "צ׳קליסט לפני משימה – תקשורת", "en": "Pre-mission checklist – communications"}, "summary": {"he": "DTC – 7 בדיקות לפני יציאה", "en": "DTC – 7 checks before going out"}, "body": {"he": ["להדליק את כל המקמ״שים: שני הרכבים, שתי קופסאות ה־Operator Box, אנטנת הממסר הראשית, רחפן הממסר וה־GCS.", "לחבר את ה־ROCU-10 ל־Operator Box ולהתחבר לממשק (התחברות לממשק DTC).", "לוודא שכל המקמ״שים מופיעים ברשת (Tactical Display / Node Table).", "כשהרכבים קרובים למפעיל, להריץ סריקת ספקטרום (Apps > Spectrum Scan).", "אם מחליפים תדר: לרשום את התדר הנוכחי, להגדיר את החדש בכל המקמ״שים, להפעיל מחדש ולבדוק (החלפת תדר עבודה).", "לבדוק שכל הקישורים ירוקים (Status > Quality Matrix).", "לבדוק שאף מקמ״ש לא עובר 20% Occupancy (Status > Node Table)."], "en": ["Power on all radios: both vehicles, both Operator Boxes, main relay antenna, relay drone and GCS.", "Connect the ROCU-10 to the Operator Box and log in (Logging in to the DTC interface).", "Confirm that every radio appears in the network (Tactical Display / Node Table).", "With the vehicles near the operator, run a spectrum scan (Apps > Spectrum Scan).", "If changing frequency: record the current frequency, set the new one on all radios, restart and verify (Changing the operating frequency).", "Check that all links are green (Status > Quality Matrix).", "Check that no radio is above 20% occupancy (Status > Node Table)."]}, "updated": "2026-11-10"}, {"id": "dtc-trouble", "sec": "comm", "type": "guide", "title": {"he": "תקלות ופתרונות – תקשורת DTC", "en": "Troubleshooting – DTC communications"}, "summary": {"he": "תסמין, סיבה ומה עושים", "en": "Symptom, cause and action"}, "body": {"he": [{"table": {"head": ["תסמין", "סיבה אפשרית", "מה עושים"], "rows": [["**הממשק לא נפתח בדפדפן**", "כתובת IP שגויה או אין חיבור קווי", "בדקו את הכבל ואת כתובת ה־IP של התצורה (מערכת DTC: רכיבים ותצורות עבודה)."], ["**הסיסמה לא מתקבלת**", "ביחידה מוגדרת סיסמה אחרת", "נסו את הסיסמה החלופית (התחברות לממשק DTC)."], ["**חץ הופך לכתום או אדום במהלך פעילות**", "הנחתה או גבול טווח", "עצרו את ההתקדמות, החזירו את הרכב לאחור, הגביהו או הזיזו את רחפן הממסר."], ["**מקמ״ש חסר אחרי החלפת תדר**", "המקמ״ש לא הוגדר לתדר החדש", "הגדירו את התדר במקמ״ש הזה ידנית (החלפת תדר עבודה, אפשרות ב׳)."], ["**התקשורת גרועה יותר אחרי החלפת תדר**", "התדר החדש לא טוב יותר", "חזרו לתדר שרשמתם לפני ההחלפה."], ["**הרשת איטית**", "מקמ״ש עם Occupancy מעל 20%", "זהו את המקמ״ש ב־Node Table."], ["**תאים אדומים או אדומים כהים ב־Quality Matrix**", "קישור חלש בין זוג המקמ״שים", "הזיזו את הרכב או את רחפן הממסר."]]}}], "en": [{"table": {"head": ["Symptom", "Likely cause", "Action"], "rows": [["**Interface does not open in the browser**", "Wrong IP address or no wired connection", "Check the cable and the IP address for your configuration (DTC system: components & configurations)."], ["**Password rejected**", "A different password is set on this unit", "Try the alternate password (Logging in to the DTC interface)."], ["**Arrow turns orange or red during operation**", "Attenuation or range limit", "Stop the advance, move the vehicle back, raise or reposition the relay drone."], ["**A radio is missing after a frequency change**", "That radio was not set to the new frequency", "Set the frequency on that radio manually (Changing the operating frequency, Option B)."], ["**Communication is worse after a frequency change**", "The new frequency is not better", "Return to the frequency you recorded before the change."], ["**Network performance is slow**", "A radio has occupancy above 20%", "Identify the radio in the Node Table."], ["**Red or dark red cells in the Quality Matrix**", "Weak link between that pair of radios", "Reposition the vehicle or the relay drone."]]}}]}, "updated": "2026-11-10"}, {"id": "um-trouble-comm", "sec": "comm", "type": "guide", "title": {"he": "מקרים ותגובות – תקשורת (ישל״ט וביזון)", "en": "Cases & responses – communication (controller and BISON)"}, "summary": {"he": "תקשורת מנותקת, FORT, ריצוד", "en": "Comms down, FORT, flicker"}, "updated": "2026-11-10", "body": {"he": [{"table": {"head": ["מקרה", "תגובה (לפי הסדר)"], "rows": [["**הישל״ט מראה תקשורת מנותקת למרות שכל שלבי הסד״פ בוצעו**", "1. כיבוי והדלקה של האפליקציה. 2. כיבוי והדלקה של התקשורת בביזון ובקופסת המפעיל, 30 שניות בין כיבוי להדלקה."], ["**תקשורת תקינה בישל״ט, אבל עצירת חירום פעילה ואי אפשר להניע (FORT)**", "1. פטריית החירום לא לחוצה. 2. כל הכבלים מחוברים ויש מתח תקין. 3. כיבוי והדלקה של האפליקציה. 4. כיבוי והדלקה של התקשורת בביזון ובקופסת המפעיל, 10 שניות המתנה."], ["**תקשורת מרצדת, פיקסלים ועיכוב בתגובה**", "1. להמתין להתייצבות. 2. לשפר את מיקום עמדת החפ״ק ואת חצובת התקשורת."]]}}, {"note": "מקור: מדריך מפעיל מקוצר – שליחות קטלנית, DOC00698-A REV.002.", "kind": "note"}], "en": [{"table": {"head": ["Case", "Response (in order)"], "rows": [["**Controller shows communication down although all setup steps were done**", "1. Restart the app. 2. Power-cycle communication on the BISON and the operator box, 30 s between off and on."], ["**Comms OK on the controller, but emergency stop active and cannot start (FORT)**", "1. Emergency stop not pressed. 2. All cables connected and power OK. 3. Restart the app. 4. Power-cycle communication on the BISON and operator box, wait 10 s."], ["**Flickering link, pixelation and delayed response**", "1. Wait for it to stabilize. 2. Improve the command post position and the comms tripod."]]}}, {"note": "Source: ROBOX brief user manual (Hebrew), DOC00698-A REV.002.", "kind": "note"}]}}, {"id": "cfg-act", "sec": "cfg", "type": "steps", "title": {"he": "כיול אקטואטורים", "en": "Actuator Calibration"}, "summary": {"he": "", "en": ""}, "body": {"he": "", "en": ""}, "updated": "2026-11-10"}, {"id": "m-pre", "sec": "maint", "type": "checklist", "title": {"he": "טיפול לפני תנועה (טל״ת)", "en": "Pre-Operation Maintenance"}, "summary": {"he": "BISON – בתחילת כל יום עבודה ולפני כל שימוש", "en": "BISON – start of every working day and before every use"}, "body": {"he": ["# א. הכנה", "**הדלקת פלטפורמה** – הפלטפורמה דלוקה והתוכנה עלתה.", "**הכנה ראשונית** – הכלי על משטח ישר, מנוע כבוי.", "# ב. תא המנוע – בדיקה קרה (מנוע כבוי, חשמל דלוק)", "**הסתכלות כללית** – אין נזק, חלקים רופפים או גופים זרים.", "**בלמים** – אין קרעים, שברים, שמן או לכלוך.", "**נזילות** – אין נזילות נוזל בלמים, שמן גיר, דלק ושמן מנוע.", "**מפלס שמן מנוע** – במקל המדידה, בתוך הטווח המקווקו.", "**מפלס שמן גיר** – בחלון הצפייה – חצי מלא. למילוי יש לפרק את המכסה העליון.", "**מפלס דלק** – מספיק לפעילות המתוכננת.", "**מצברים 12V ×2** – אומים מהודקים, קטבים נקיים ללא קורוזיה.", "**רצועת הנעה** – ללא קרעים, שחיקה או סדקים.", "**רצועת אלטרנטור** – ללא קרעים, שחיקה או סדקים.", "# ג. סביב הכלי ועל הכלי", "**גחון וצירים** – ללא סדקים או שברים בגחון, הצירים אינם מעוותים.", "**אוזני גרירה** – אוזני הגרירה תקינות.", "**לחצני EMO** – 3 לחצנים קיימים ותקינים – בדיקה בהפעלה.", "**לחץ אוויר בצמיגים** – קדמי 5, אמצעיים 7, אחורי 6 (PSI).", "**מצב צמיגים** – ללא קרעים או שחיקה, ונטיל תקין.", "**אומים בגלגלים** – במקום ומחוזקים.", "**זחל** – גומי תקין, שיניים מקובעות, ללא שחיקה חריגה.", "**מצלמות** – 4 היקפיות (יום ולילה) ומאסט – תקינות ומקובעות.", "**אנטנות תקשורת** – אנטנות RF וסלולר קיימות ומקובעות.", "**ברגים** – ברגי הכלי ומערכת הנשק מקובעים.", "# ד. בדיקה חמה (לאחר 20 דקות הנעה)", "**שמנים ונזילות** – בדיקה חוזרת של שמן מנוע ושמן גיר. אין נזילות חדשות."], "en": ["# A. Preparation", "**Platform power-up** – Platform is on and the software has loaded.", "**Initial preparation** – Vehicle on level ground, engine off.", "# B. Engine compartment – cold check (engine off, power on)", "**General inspection** – No damage, loose parts or foreign objects.", "**Brakes** – No tears, cracks, oil or dirt.", "**Leaks** – No brake fluid, gear oil, fuel or engine oil leaks.", "**Engine oil level** – On the dipstick, within the hatched range.", "**Gear oil level** – Sight glass half full. Remove the top cover to refill.", "**Fuel level** – Sufficient for the planned activity.", "**Batteries 12V ×2** – Nuts tight, terminals clean with no corrosion.", "**Drive belt** – No tears, wear or cracks.", "**Alternator belt** – No tears, wear or cracks.", "# C. Around and on the vehicle", "**Underbody and axles** – No cracks or breaks in the underbody, axles not bent.", "**Towing eyes** – Towing eyes intact.", "**EMO buttons** – All 3 buttons present and working – test by pressing.", "**Tire pressure** – Front 5, middle 7, rear 6 (PSI).", "**Tire condition** – No tears or wear, valve intact.", "**Wheel nuts** – In place and tightened.", "**Track** – Rubber intact, teeth secured, no abnormal wear.", "**Cameras** – 4 surround (day and night) and mast – working and secured.", "**Communication antennas** – RF and cellular antennas present and secured.", "**Bolts** – Vehicle and weapon system bolts secured.", "# D. Hot check (after 20 minutes of operation)", "**Oils and leaks** – Recheck engine and gear oil. No new leaks."], "note": {"he": "בתחילת כל יום עבודה ולפני כל שימוש בכלי. על משטח ישר בלבד. כל חריגה או ליקוי מדווחים מיד לחוליית האחזקה ב־Roboteam ומטופלים לפני שימוש חוזר בכלי. אם יש ספק – עוצרים ומתייעצים.", "en": "At the start of every working day and before every use of the vehicle. Level ground only. Any deviation or fault is reported immediately to the Roboteam maintenance team and fixed before the vehicle is used again. If in doubt – stop and consult."}, "sign": true}, "updated": "2026-11-10"}, {"id": "m-post", "sec": "maint", "type": "checklist", "title": {"he": "טיפול אחרי תנועה (טא״ת)", "en": "Post-Operation Maintenance"}, "summary": {"he": "BISON – בסוף כל יום עבודה ולפני עבודות לילה", "en": "BISON – end of every working day and before night operations"}, "body": {"he": ["# א. לפני דימום הכלי", "**השפרצות** – אין השפרצות שמן או נוזלים בתא המנוע ועל המכסה.", "**ייבוש בלמים** – לאחר מים, בוץ או חול עמוק – לחיצות קלות על הבלם בנסיעה איטית.", "# ב. תא המנוע (לאחר דימום)", "**הסתכלות כללית** – אין נזק, חלקים רופפים או גופים זרים.", "**נזילות** – צינורות וראש מנוע ללא נזילות.", "**רצועת הנעה / אלטרנטור** – ללא קרעים או סימני חריכה.", "**פילטר אוויר** – ניקוי אבק ולכלוך. פילטר שחוק יוחלף (במיוחד במתאר חול ואבק).", "# ג. סביב הכלי", "**צמיגים** – גלגלים תקינים ולחץ אוויר תקין.", "**זחל** – גומי תקין ושיניים מקובעות.", "# ד. סגירת הכלי", "**ניקיון** – הסרת בוץ, חול ולכלוך למניעת קורוזיה.", "**עדשות מצלמות** – ניקוי כל העדשות.", "**תדלוק** – בנזין 95 לפי הצורך.", "**הטענה** – הטענת פלטפורמות לפי הצורך."], "en": ["# A. Before engine shutdown", "**Oil spray** – No oil or fluid spray in the engine compartment or on the cover.", "**Brake drying** – After water, mud or deep sand – apply the brakes lightly while driving slowly.", "# B. Engine compartment (after shutdown)", "**General inspection** – No damage, loose parts or foreign objects.", "**Leaks** – No leaks from hoses or the cylinder head.", "**Drive / alternator belt** – No tears or burn marks.", "**Air filter** – Clean off dust and dirt. Replace a worn filter (especially in sandy or dusty conditions).", "# C. Around the vehicle", "**Tires** – Wheels intact, tire pressure correct.", "**Track** – Rubber intact, teeth secured.", "# D. Closing up the vehicle", "**Cleaning** – Remove mud, sand and dirt to prevent corrosion.", "**Camera lenses** – Clean all lenses.", "**Refueling** – 95 octane gasoline as needed.", "**Charging** – Charge platforms as needed."], "note": {"he": "בסוף כל יום עבודה ולפני עבודות לילה. על משטח ישר בלבד. כל חריגה או ליקוי מדווחים מיד לחוליית האחזקה ב־Roboteam ומטופלים לפני שימוש חוזר בכלי. אם יש ספק – עוצרים ומתייעצים.", "en": "At the end of every working day and before night operations. Level ground only. Any deviation or fault is reported immediately to the Roboteam maintenance team and fixed before the vehicle is used again. If in doubt – stop and consult."}, "sign": true}, "updated": "2026-11-10"}, {"id": "m-data", "sec": "maint", "type": "maint", "title": {"he": "טיפולים כלליים – נתוני אחזקה", "en": "General Service – Maintenance Data"}, "summary": {"he": "שמנים, נוזלים ומסננים – סוג, כמות ותדירות", "en": "Oils, fluids and filters – type, quantity and interval"}, "body": {"rows": [{"kind": "fluid", "name": {"he": "דלק", "en": "Fuel"}, "spec": {"he": "בנזין 95", "en": "95 octane gasoline"}, "qty": {"he": "32 ליטר (קיבולת מיכל)", "en": "32 L (tank capacity)"}, "point": "", "interval": "", "pn": "", "note": {"he": "תדלוק לפי הצורך בטא״ת.", "en": "Refuel as needed in Post-Operation."}}, {"kind": "fluid", "name": {"he": "שמן מנוע", "en": "Engine oil"}, "spec": "Argo 5W-40 Synthetic", "qty": {"he": "2.3 ליטר (עם פילטר)", "en": "2.3 L (with filter)"}, "point": {"he": "מקל מדידה", "en": "Dipstick"}, "interval": {"he": "כל 100 שעות מנוע", "en": "Every 100 engine hours"}, "pn": "", "note": {"he": "המפלס בתוך הטווח המקווקו במקל המדידה. מוחלף יחד עם פילטר השמן.", "en": "Level within the hatched range on the dipstick. Changed together with the oil filter."}}, {"kind": "fluid", "name": {"he": "שמן גיר (תמסורת)", "en": "Gear oil (transmission)"}, "spec": "Argo 75W-90 Synthetic", "qty": {"he": "1.2 ליטר", "en": "1.2 L"}, "point": {"he": "חלון צפייה", "en": "Sight glass"}, "interval": {"he": "כל 100 שעות מנוע", "en": "Every 100 engine hours"}, "pn": "", "note": {"he": "חלון הצפייה חצי מלא. למילוי יש לפרק את המכסה העליון.", "en": "Sight glass half full. Remove the top cover to refill."}}, {"kind": "fluid", "name": {"he": "נוזל בלמים", "en": "Brake fluid"}, "spec": "DOT 4", "qty": "", "point": "", "interval": "", "pn": "", "note": {"he": "", "en": ""}}, {"kind": "fluid", "name": {"he": "שמן שרשרת (ספריי)", "en": "Chain oil (spray)"}, "spec": "ARGO PTFE Chain Lube", "qty": "", "point": "", "interval": {"he": "כל 25 שעות מנוע", "en": "Every 25 engine hours"}, "pn": "", "note": {"he": "שימון שרשרת כל 25 שעות מנוע. בטבלה המסכמת של האחזקה המונעת רשום Putoline DX-11.", "en": "Chain lubrication every 25 engine hours. The preventive maintenance summary lists Putoline DX-11."}}, {"kind": "fluid", "name": {"he": "גריז", "en": "Grease"}, "spec": {"he": "Argo NLGI #2 ליתיום", "en": "Argo NLGI #2 Lithium"}, "qty": "", "point": "", "interval": {"he": "כל 25 שעות מנוע", "en": "Every 25 engine hours"}, "pn": "", "note": {"he": "", "en": ""}}, {"kind": "filter", "name": {"he": "פילטר שמן", "en": "Oil filter"}, "spec": "", "qty": "", "point": "", "interval": {"he": "כל 100 שעות מנוע", "en": "Every 100 engine hours"}, "pn": "39164PH", "note": {"he": "מוחלף יחד עם שמן המנוע.", "en": "Changed together with the engine oil."}}, {"kind": "filter", "name": {"he": "פילטר אוויר", "en": "Air filter"}, "spec": {"he": "נייר, Low Profile", "en": "Low profile paper"}, "qty": "", "point": "", "interval": {"he": "כל 100 שעות מנוע", "en": "Every 100 engine hours"}, "pn": "692519 / 692520 (משני / secondary)", "note": {"he": "ניקוי יומי בטא״ת, טיפול יסודי כל 100 שעות מנוע, החלפה כשהפילטר שחוק.", "en": "Daily cleaning in Post-Operation, thorough service every 100 engine hours, replace when worn."}}, {"kind": "part", "name": {"he": "מצת (פלאג)", "en": "Spark plug"}, "spec": "NGK BPR4ES", "qty": {"he": "2 (מנוע V-Twin)", "en": "2 (V-twin engine)"}, "point": "", "interval": {"he": "שנתי (דרג משק)", "en": "Annual (Workshop)"}, "pn": "491055S", "note": {"he": "מרווח: ראו הערה במפרט ARGO.", "en": "Gap: see the note in the ARGO specs."}}, {"kind": "part", "name": {"he": "רצועת הנעה (וריאטור)", "en": "Drive belt (variator)"}, "spec": "ARGO Frontier", "qty": "1", "point": "", "interval": {"he": "בדיקה חודשית / כל 25 שעות", "en": "Check monthly / every 25 h"}, "pn": "127-159 / 127-159HD", "note": {"he": "", "en": ""}}], "note": {"he": "BISON. לחץ אוויר בצמיגים: קדמי 5, אמצעיים 7, אחורי 6 (PSI). **שמן מנוע ושמן תמסורת – יש סתירה בין המסמכים** (5W-40/75W-90 בנוהל היומי וב־ARGO, ‏10W-40/80W90 במדריך המפעיל ובטבלת האחזקה המונעת). לבירור לפני מילוי.", "en": "BISON. Tire pressure: front 5, middle 7, rear 6 (PSI). **Engine and transmission oil – the documents conflict** (5W-40/75W-90 in the daily procedure and ARGO; 10W-40/80W90 in the user manual and preventive maintenance table). Confirm before filling."}}, "updated": "2026-11-10"}, {"id": "m-periodic", "sec": "maint", "type": "guide", "title": {"he": "טיפולים תקופתיים לפי שעות מנוע", "en": "Periodic maintenance by engine hours"}, "summary": {"he": "25 ו־100 שעות מנוע", "en": "25 and 100 engine hours"}, "body": {"he": [{"p": "הבדיקות היומיות מפורטות בטל״ת ובטא״ת. אלה הטיפולים התקופתיים של ה־BISON:"}, {"table": {"head": ["פעולה", "תדירות"], "rows": [["**שימון שרשרת**", "כל 25 שעות מנוע"], ["**גריז**", "כל 25 שעות מנוע"], ["**החלפת שמן מנוע ופילטר**", "כל 100 שעות מנוע"], ["**החלפת שמן גיר**", "כל 100 שעות מנוע"], ["**פילטר אוויר**", "ניקוי יומי בטא״ת, טיפול יסודי כל 100 שעות מנוע, החלפה כשהפילטר שחוק"]]}}, {"note": "סוגי השמנים והכמויות נמצאים ב־„טיפולים כלליים – נתוני אחזקה”.", "kind": "tip"}], "en": [{"p": "Daily checks are listed in Pre-Operation and Post-Operation. These are the BISON periodic maintenance tasks:"}, {"table": {"head": ["Task", "Interval"], "rows": [["**Chain lubrication**", "Every 25 engine hours"], ["**Grease**", "Every 25 engine hours"], ["**Engine oil and filter change**", "Every 100 engine hours"], ["**Gear oil change**", "Every 100 engine hours"], ["**Air filter**", "Daily cleaning in Post-Operation, thorough service every 100 engine hours, replace when worn"]]}}, {"note": "Oil types and quantities are in “General Service – Maintenance Data”.", "kind": "tip"}]}, "updated": "2026-11-10"}, {"id": "um-maint-extra", "sec": "maint", "type": "guide", "title": {"he": "טיפול לפני ואחרי משימה – השלמות ממדריך המפעיל", "en": "Before/after mission service – user manual additions"}, "summary": {"he": "כלים, בדיקות דרך ROCU-10, קרון וסגירת יום", "en": "Tools, ROCU-10 checks, container and close-up"}, "updated": "2026-11-10", "body": {"he": [{"p": "מדריך המפעיל כולל את אותן בדיקות כמו טל״ת וטא״ת, ועוד כמה דברים שכדאי לדעת:"}, {"h": "כלים נדרשים"}, {"table": {"head": ["כלי", "לשימוש ב־"], "rows": [["מד לחץ אוויר", "לחץ צמיגים (5 / 7 / 6 PSI)"], ["ידית מומנט דרייב 1/2, מאריך 250 מ״מ, בוקסה 19 מ״מ", "אומי הגלגלים והזחלים"], ["ראצ׳ט ובוקסה דרייב 1/4, ‏10 מ״מ", "קטבי המצבר"], ["מטלית מיקרופייבר", "עדשות המצלמות והמסכים"]]}}, {"h": "בדיקות מערכת דרך ישל״ט ROCU-10 (מערכת דלוקה, בלי הנעה)"}, {"ul": ["מצבר 12V ומתח מצבר 48V.", "מפלס דלק (גם בלוח המחוונים אחרי הנעה).", "EMO – 3 לחצנים תקינים בהפעלה בפועל (2 בכלי, 1 בקופסת המפעיל).", "חיבורי הכבלים לפי תצורת הפריסה.", "6 מצלמות יום משדרות ובפוקוס (4 היקפיות, תורן, מערכת נשק).", "5 מצלמות תרמיות משדרות ובפוקוס (4 היקפיות, מערכת נשק).", "מיקרופון ורמקול.", "מערכת הנשק נעה לכל הכיוונים בגבולות התוכנה.", "מכסה המנוע שלם, והמאוורר נכנס לפעולה כשמניעים את הכלי."]}, {"h": "קרון שליטה"}, {"ul": ["מפלס דלק בגנרטור (בלוח החיווי שלו) – מילוי בנזין 95 לפי הצורך.", "מזגן – השלט קיים ושלם, אין נזילות.", "מסכים – תקינים, מקובעים ומחוברים לישל״טים.", "עמדות מפעיל – מנגנון השולחן תקין."]}, {"h": "סגירת הכלי בסוף יום"}, {"ul": ["ניקוי בוץ, חול ולכלוך.", "ניקוי עדשות המצלמות.", "ניקוי מערכת הנשק וריקון תחמושת לפי הוראות היצרן.", "טעינה עד 100% ותדלוק בנזין 95 לפי הצורך."]}, {"note": "טיפול במערכת הנשק – רק על ידי יצרן מערכת הנשק, בתיאום מראש.", "kind": "important"}, {"note": "מקור: מדריך מפעיל מקוצר – שליחות קטלנית, DOC00698-A REV.002.", "kind": "note"}], "en": [{"p": "The user manual has the same checks as Pre- and Post-Operation, plus a few additions:"}, {"h": "Required tools"}, {"table": {"head": ["Tool", "For"], "rows": [["Air pressure gauge", "Tire pressure (5 / 7 / 6 psi)"], ["1/2\" drive torque wrench, 250 mm extension, 19 mm soc media/pm-p11-1.jpg"}, {"h3": "שלב 2"}, {"p": "שלפו את שני המסננים כלפי מעלה או קדימה (לפי הדגם) מתוך המסילות שלהם."}, {"img": "media/pm-p12-1.jpg"}, {"img": "media/pm-p12-2.jpg"}, {"h3": "שלב 3"}, {"p": "שטפו את המסננים במים נקיים ושפשפו אותם בעדינות להסרת האבק והלכלוך."}, {"img": "media/pm-p13-1.jpg"}, {"h3": "שלב 4"}, {"p": "הניחו את המסננים לייבוש מלא במקום מוצל."}, {"img": "media/pm-p13-2.jpg"}, {"h3": "שלב 5"}, {"p": "החזירו את שני מסנני האוויר למקומם במסילות וודאו שהם מונחים נכון."}, {"img": "media/pm-p14-1.jpg"}, {"h3": "שלב 6"}, {"p": "סגרו את מכסה המזגן."}, {"img": "media/pm-p14-2.jpg"}, {"note": "מקור: מדריך אחזקת מנע DOC00757-A REV.001.", "kind": "note"}], "en": [{"note": "Monthly · Field level", "kind": "freq"}, {"h3": "Step 1"}, {"p": "Make sure the AC is off and disconnected from power, and open the cover on both sides of the unit to pull out the filters."}, {"img": "media/pm-p11-1.jpg"}, {"h3": "Step 2"}, {"p": "Pull both filters up or forward (depending on the model) out of their rails."}, {"img": "media/pm-p12-1.jpg"}, {"img": "media/pm-p12-2.jpg"}, {"h3": "Step 3"}, {"p": "Rinse the filters with clean water and rub gently to remove dust and dirt."}, {"img": "media/pm-p13-1.jpg"}, {"h3": "Step 4"}, {"p": "Leave the filters to dry completely in a shaded place."}, {"img": "media/pm-p13-2.jpg"}, {"h3": "Step 5"}, {"p": "Return both air filters to their rails and make sure they sit correctly."}, {"img": "media/pm-p14-1.jpg"}, {"h3": "Step 6"}, {"p": "Close the AC cover."}, {"img": "media/pm-p14-2.jpg"}, {"note": "Source: Preventive Maintenance Guide DOC00757-A REV.001.", "kind": "note"}]}, "group": "maint", "updated": "2026-11-10"}, {"id": "pm-gen-table", "sec": "c-gen", "type": "guide", "title": {"he": "לוח אחזקה – גנרטור", "en": "Maintenance schedule – generator"}, "summary": {"he": "תקופות שירות לפי הונדה", "en": "Honda service intervals"}, "body": {"he": [{"p": "יש לבצע כל חודש או לפי מרווח שעות הפעולה המצוין – לפי המוקדם מביניהם."}, {"table": {"hea
