ולות"}, {"h3": "שלב 1"}, {"p": "הניחו את הגנרטור על משטח ישר ומקמו את מגש הניקוז."}, {"img": "media/pm-p18-1.jpg"}, {"h3": "שלב 2"}, {"p": "פתחו את מכסה התחזוקה הימני."}, {"img": "media/pm-p18-2.jpg"}, {"h3": "שלב 3"}, {"p": "הסירו את מכסה מילוי השמן."}, {"img": "media/pm-p19-1.jpg"}, {"h3": "שלב 4"}, {"p": "הסירו את בורג ריקון השמן."}, {"img": "media/pm-p19-2.jpg"}, {"h3": "שלב 5"}, {"p": "רוקנו את שמן המנוע לחלוטין."}, {"img": "media/pm-p20-1.jpg"}, {"h3": "שלב 6"}, {"p": "התקינו את בורג ריקון השמן והדקו אותו היטב."}, {"img": "media/pm-p20-2.jpg"}, {"h3": "שלב 7"}, {"p": "מלאו את המנוע בשמן המומלץ (**5W-40 בתקן API SJ**). כשהשמן מתחיל לנזול אל תוך פתח המילוי – המפלס תקין."}, {"img": "media/pm-p21-1.jpg"}, {"h3": "שלב 8"}, {"p": "התקינו את מכסה מילוי השמן."}, {"img": "media/pm-p21-2.jpg"}, {"h3": "שלב 9"}, {"p": "סגרו את מכסה התחזוקה הימני."}, {"img": "media/pm-p22-1.jpg"}, {"h": "מסמך רלוונטי (הונדה)"}, {"img": "media/pm-p16-1.jpg", "cap": "Servicing your generator – Engine oil change"}, {"note": "מקור: מדריך אחזקת מנע DOC00757-A REV.001.", "kind": "note"}], "en": [{"note": "Quarterly · Workshop level", "kind": "freq"}, {"h": "Tools"}, {"table": {"head": ["#", "Item"], "rows": [["1", "Engine oil 5W-40, API SJ"], ["2", "Ring (box-end) wrench"], ["3", "Oil drain container"], ["4", "Funnel"], ["5", "Flat screwdriver"], ["6", "Microfiber cloth"]]}}, {"h": "Procedure"}, {"h3": "Step 1"}, {"p": "Place the generator on a level surface and position the drain tray."}, {"img": "media/pm-p18-1.jpg"}, {"h3": "Step 2"}, {"p": "Open the right maintenance cover."}, {"img": "media/pm-p18-2.jpg"}, {"h3": "Step 3"}, {"p": "Remove the oil filler cap."}, {"img": "media/pm-p19-1.jpg"}, {"h3": "Step 4"}, {"p": "Remove the oil drain bolt."}, {"img": "media/pm-p19-2.jpg"}, {"h3": "Step 5"}, {"p": "Drain the engine oil completely."}, {"img": "media/pm-p20-1.jpg"}, {"h3": "Step 6"}, {"p": "Reinstall the oil drain bolt and tighten it securely."}, {"img": "media/pm-p20-2.jpg"}, {"h3": "Step 7"}, {"p": "Fill the engine with the recommended oil (**5W-40, API SJ**). When the oil starts to flow into the filler neck, the level is correct."}, {"img": "media/pm-p21-1.jpg"}, {"h3": "Step 8"}, {"p": "Reinstall the oil filler cap."}, {"img": "media/pm-p21-2.jpg"}, {"h3": "Step 9"}, {"p": "Close the right maintenance cover."}, {"img": "media/pm-p22-1.jpg"}, {"h": "Related document (Honda)"}, {"img": "media/pm-p16-1.jpg", "cap": "Servicing your generator – Engine oil change"}, {"note": "Source: Preventive Maintenance Guide DOC00757-A REV.001.", "kind": "note"}]}, "group": "maint", "updated": "2026-11-10"}, {"id": "pm-gen-air", "sec": "c-gen", "type": "guide", "title": {"he": "ניקוי פילטר אוויר – גנרטור", "en": "Air filter cleaning – generator"}, "summary": {"he": "13 שלבים עם תמונות", "en": "13 steps with photos"}, "body": {"he": [{"note": "חודשי · דרג שדה", "kind": "freq"}, {"h": "רשימת כלים"}, {"table": {"head": ["#", "פריט"], "rows": [["1", "שמן מנוע 5W-40 בתקן API SJ"], ["2", "מגש ניקוז"], ["3", "מטלית מיקרופייבר"], ["4", "מברג שטוח"]]}}, {"h": "סדר פעולות"}, {"h3": "שלב 1"}, {"p": "פתחו את מכסה התחזוקה השמאלי."}, {"img": "media/pm-p25-1.jpg"}, {"h3": "שלב 2"}, {"p": "שחררו את התפסים והסירו את מכסה מסנן האוויר."}, {"img": "media/pm-p25-2.jpg"}, {"h3": "שלב 3"}, {"p": "הסירו את מסנן הספוג ממכסה מסנן האוויר."}, {"img": "media/pm-p26-1.jpg"}, {"h3": "שלב 4"}, {"p": "נקו את מסנן הספוג במים עם סבון והניחו לו להתייבש."}, {"img": "media/pm-p26-2.jpg"}, {"h3": "שלב 5"}, {"p": "טבלו אותו בשמן מנוע נקי."}, {"img": "media/pm-p27-1.jpg"}, {"h3": "שלב 6"}, {"p": "סחטו אותו."}, {"img": "media/pm-p27-2.jpg"}, {"h3": "שלב 7"}, {"p": "התקינו את מסנן הספוג על מכסה מסנן האוויר."}, {"img": "media/pm-p28-1.jpg"}, {"h3": "שלב 8"}, {"p": "הסירו את המוביל ואת מסנן הנייר."}, {"img": "media/pm-p28-2.jpg"}, {"h3": "שלב 9"}, {"p": "בדקו את מסנן הנייר. אם הוא מלוכלך – החליפו אותו בחדש. **אל תנקו את מסנן הנייר.**"}, {"img": "media/pm-p29-1.jpg"}, {"h3": "שלב 10"}, {"p": "נגבו כל לכלוך מבית מסנן האוויר בעזרת מטלית נקייה ולחה."}, {"img": "media/pm-p29-2.jpg"}, {"h3": "שלב 11"}, {"p": "התקינו את המוביל ואת מסנן הנייר."}, {"img": "media/pm-p30-1.jpg"}, {"h3": "שלב 12"}, {"p": "התקינו את מכסה מסנן האוויר."}, {"img": "media/pm-p30-2.jpg"}, {"h3": "שלב 13"}, {"p": "סגרו את מכסה התחזוקה השמאלי."}, {"img": "media/pm-p31-1.jpg"}, {"h": "מסמך רלוונטי (הונדה)"}, {"img": "media/pm-p23-1.jpg", "cap": "Servicing your generator – Foam air filter cleaning"}, {"note": "מקור: מדריך אחזקת מנע DOC00757-A REV.001.", "kind": "note"}], "en": [{"note": "Monthly · Field level", "kind": "freq"}, {"h": "Tools"}, {"table": {"head": ["#", "Item"], "rows": [["1", "Engine oil 5W-40, API SJ"], ["2", "Drain tray"], ["3", "Microfiber cloth"], ["4", "Flat screwdriver"]]}}, {"h": "Procedure"}, {"h3": "Step 1"}, {"p": "Open the left maintenance cover."}, {"img": "media/pm-p25-1.jpg"}, {"h3": "Step 2"}, {"p": "Release the clips and remove the air filter cover."}, {"img": "media/pm-p25-2.jpg"}, {"h3": "Step 3"}, {"p": "Remove the foam filter from the air filter cover."}, {"img": "media/pm-p26-1.jpg"}, {"h3": "Step 4"}, {"p": "Clean the foam filter in soapy water and let it dry."}, {"img": "media/pm-p26-2.jpg"}, {"h3": "Step 5"}, {"p": "Dip it in clean engine oil."}, {"img": "media/pm-p27-1.jpg"}, {"h3": "Step 6"}, {"p": "Squeeze it out."}, {"img": "media/pm-p27-2.jpg"}, {"h3": "Step 7"}, {"p": "Install the foam filter on the air filter cover."}, {"img": "media/pm-p28-1.jpg"}, {"h3": "Step 8"}, {"p": "Remove the guide and the paper filter."}, {"img": "media/pm-p28-2.jpg"}, {"h3": "Step 9"}, {"p": "Check the paper filter. If it is dirty, replace it. **Do not clean the paper filter.**"}, {"img": "media/pm-p29-1.jpg"}, {"h3": "Step 10"}, {"p": "Wipe any dirt from the air filter housing with a clean, damp cloth."}, {"img": "media/pm-p29-2.jpg"}, {"h3": "Step 11"}, {"p": "Install the guide and the paper filter."}, {"img": "media/pm-p30-1.jpg"}, {"h3": "Step 12"}, {"p": "Install the air filter cover."}, {"img": "media/pm-p30-2.jpg"}, {"h3": "Step 13"}, {"p": "Close the left maintenance cover."}, {"img": "media/pm-p31-1.jpg"}, {"h": "Related document (Honda)"}, {"img": "media/pm-p23-1.jpg", "cap": "Servicing your generator – Foam air filter cleaning"}, {"note": "Source: Preventive Maintenance Guide DOC00757-A REV.001.", "kind": "note"}]}, "group": "maint", "updated": "2026-11-10"}, {"id": "pm-gen-plug", "sec": "c-gen", "type": "guide", "title": {"he": "טיפול מצת (פלאג) – גנרטור", "en": "Spark plug service – generator"}, "summary": {"he": "8 שלבים עם תמונות", "en": "8 steps with photos"}, "body": {"he": [{"note": "שנתי · דרג משק", "kind": "freq"}, {"h": "רשימת כלים"}, {"table": {"head": ["#", "פריט"], "rows": [["1", "מברג שטוח"], ["2", "מפתח מצתים"], ["3", "מצת (פלאג) NGK BPR6ES"]]}}, {"h": "סדר פעולות"}, {"h3": "שלב 1"}, {"p": "פתחו את מכסה התחזוקה השמאלי. אם המנוע היה בשימוש, תנו לו להתקרר לחלוטין לפני הטיפול."}, {"img": "media/pm-p35-1.jpg"}, {"h3": "שלב 2"}, {"p": "הסירו את המצת בעזרת מפתח מצתים."}, {"img": "media/pm-p35-2.jpg"}, {"h3": "שלב 3"}, {"p": "בדקו את המצת: (1) המרווח צריך להיות **0.7–0.8 מ״מ**. (2) מצב תקין. (3) יבש או מפויח (מצבורי פחמן). (4) רטוב (מפויח משמן או דלק)."}, {"img": "media/pm-p36-1.jpg"}, {"h3": "שלב 4"}, {"p": "התקינו את המצת ביד כדי למנוע הברגה עקומה."}, {"img": "media/pm-p36-2.jpg"}, {"h3": "שלב 5"}, {"p": "מצת משומש: הדקו **1/8 עד 1/4 סיבוב** אחרי שהמצת מתיישב במקומו. מצת חדש: הדקו **1/2 סיבוב** אחרי שהמצת מתיישב במקומו."}, {"img": "media/pm-p37-1.jpg"}, {"h3": "שלב 6"}, {"p": "התקינו את מכסה המצת."}, {"img": "media/pm-p37-2.jpg"}, {"h3": "שלב 7"}, {"p": "התקינו את מכסה הבדיקה של המצת."}, {"img": "media/pm-p38-1.jpg"}, {"h3": "שלב 8"}, {"p": "סגרו את מכסה התחזוקה השמאלי."}, {"img": "media/pm-p38-2.jpg"}, {"h": "מסמכים רלוונטיים (הונדה)"}, {"img": "media/pm-p32-1.jpg"}, {"img": "media/pm-p33-1.jpg"}, {"note": "מקור: מדריך אחזקת מנע DOC00757-A REV.001.", "kind": "note"}], "en": [{"note": "Annual · Workshop level", "kind": "freq"}, {"h": "Tools"}, {"table": {"head": ["#", "Item"], "rows": [["1", "Flat screwdriver"], ["2", "Spark plug wrench"], ["3", "Spark plug NGK BPR6ES"]]}}, {"h": "Procedure"}, {"h3": "Step 1"}, {"p": "Open the left maintenance cover. If the engine has been running, let it cool completely first."}, {"img": "media/pm-p35-1.jpg"}, {"h3": "Step 2"}, {"p": "Remove the spark plug with the spark plug wrench."}, {"img": "media/pm-p35-2.jpg"}, {"h3": "Step 3"}, {"p": "Inspect the spark plug: (1) the gap should be **0.7–0.8 mm**. (2) Good condition. (3) Dry or fouled (carbon deposits). (4) Wet (fouled with oil or fuel)."}, {"img": "media/pm-p36-1.jpg"}, {"h3": "Step 4"}, {"p": "Install the spark plug by hand to avoid cross-threading."}, {"img": "media/pm-p36-2.jpg"}, {"h3": "Step 5"}, {"p": "Used plug: tighten **1/8–1/4 turn** after it seats. New plug: tighten **1/2 turn** after it seats."}, {"img": "media/pm-p37-1.jpg"}, {"h3": "Step 6"}, {"p": "Reinstall the spark plug cap."}, {"img": "media/pm-p37-2.jpg"}, {"h3": "Step 7"}, {"p": "Reinstall the spark plug inspection cover."}, {"img": "media/pm-p38-1.jpg"}, {"h3": "Step 8"}, {"p": "Close the left maintenance cover."}, {"img": "media/pm-p38-2.jpg"}, {"h": "Related documents (Honda)"}, {"img": "media/pm-p32-1.jpg"}, {"img": "media/pm-p33-1.jpg"}, {"note": "Source: Preventive Maintenance Guide DOC00757-A REV.001.", "kind": "note"}]}, "group": "maint", "updated": "2026-11-10"}, {"id": "pm-c-screens", "sec": "c-screens", "type": "guide", "title": {"he": "אחזקה – מסכים וטלוויזיות", "en": "Maintenance – Screens & TVs"}, "summary": {"he": "בדיקה שנתית ע״י הספק", "en": "Annual inspection by the supplier"}, "body": {"he": [{"p": "ניקוי חיצוני של המסכים – **חודשי** (דרג שדה)."}, {"note": "כל הבדיקות מתבצעות **אחת לשנה** על ידי נציג מוסמך מטעם חברת הו״ס בלבד.", "kind": "important"}, {"note": "מקור: מדריך אחזקת מנע DOC00757-A REV.001.", "kind": "note"}], "en": [{"p": "External screen cleaning – **monthly** (Field level)."}, {"note": "All inspections are performed **once a year** by an authorized representative of the supplier only.", "kind": "important"}, {"note": "Source: Preventive Maintenance Guide DOC00757-A REV.001.", "kind": "note"}]}, "group": "maint", "updated": "2026-11-10"}, {"id": "pm-c-elec", "sec": "c-elec", "type": "guide", "title": {"he": "אחזקה – מערכת חשמל", "en": "Maintenance – Electrical system"}, "summary": {"he": "בדיקה שנתית ע״י הספק", "en": "Annual inspection by the supplier"}, "body": {"he": [{"note": "כל הבדיקות מתבצעות **אחת לשנה** על ידי חשמלאי מוסמך מטעם חברת הו״ס בלבד.", "kind": "important"}, {"note": "מקור: מדריך אחזקת מנע DOC00757-A REV.001.", "kind": "note"}], "en": [{"note": "All inspections are performed **once a year** by a certified electrician from the supplier only.", "kind": "important"}, {"note": "Source: Preventive Maintenance Guide DOC00757-A REV.001.", "kind": "note"}]}, "group": "maint", "updated": "2026-11-10"}, {"id": "pm-c-mast", "sec": "c-mast", "type": "guide", "title": {"he": "אחזקה – תורן", "en": "Maintenance – Mast"}, "summary": {"he": "בדיקה שנתית ע״י הספק", "en": "Annual inspection by the supplier"}, "body": {"he": [{"note": "כל הבדיקות מתבצעות **אחת לשנה** על ידי נציג מוסמך מטעם חברת הו״ס בלבד.", "kind": "important"}, {"note": "מקור: מדריך אחזקת מנע DOC00757-A REV.001.", "kind": "note"}], "en": [{"note": "All inspections are performed **once a year** by an authorized representative of the supplier only.", "kind": "important"}, {"note": "Source: Preventive Maintenance Guide DOC00757-A REV.001.", "kind": "note"}]}, "group": "maint", "updated": "2026-11-10"}, {"id": "pm-c-comp", "sec": "c-comp", "type": "guide", "title": {"he": "אחזקה – קומפרסור", "en": "Maintenance – Compressor"}, "summary": {"he": "בדיקה שנתית ע״י הספק", "en": "Annual inspection by the supplier"}, "body": {"he": [{"note": "כל הבדיקות מתבצעות **אחת לשנה** על ידי נציג מוסמך מטעם חברת הו״ס בלבד.", "kind": "important"}, {"note": "מקור: מדריך אחזקת מנע DOC00757-A REV.001.", "kind": "note"}], "en": [{"note": "All inspections are performed **once a year** by an authorized representative of the supplier only.", "kind": "important"}, {"note": "Source: Preventive Maintenance Guide DOC00757-A REV.001.", "kind": "note"}]}, "group": "maint", "updated": "2026-11-10"}, {"id": "pm-cabling", "sec": "c-elec", "type": "guide", "title": {"he": "אחזקה – כבילה / ארון תקשורת", "en": "Maintenance – cabling / comms cabinet"}, "summary": {"he": "בדיקה שנתית ע״י הספק", "en": "Annual inspection by the supplier"}, "body": {"he": [{"note": "כל הבדיקות מתבצעות **אחת לשנה** על ידי נציג מוסמך מטעם חברת הו״ס בלבד.", "kind": "important"}, {"note": "מקור: מדריך אחזקת מנע DOC00757-A REV.001.", "kind": "note"}], "en": [{"note": "All inspections are performed **once a year** by an authorized representative of the supplier only.", "kind": "important"}, {"note": "Source: Preventive Maintenance Guide DOC00757-A REV.001.", "kind": "note"}]}, "group": "maint", "updated": "2026-11-10"}, {"id": "dtc-replay", "sec": "comm-mon", "type": "guide", "title": {"he": "Domo Mesh Replay – הקלטה והשמעה של הרשת", "en": "Domo Mesh Replay – record and replay the mesh"}, "summary": {"he": "תחקיר אחרי פעילות: הקלטה, הורדת לוגים והשמעה", "en": "Debrief: record, download logs and replay"}, "body": {"he": [{"p": "**Domo Mesh Replay** היא תוכנת מחשב שמקליטה את נתוני הסטטוס של מקמ״ש Mesh (קובצי JSON בתוך zip), ומאפשרת להשמיע אותם אחר כך דרך ממשק ה־Web של המקמ״ש. שימושית לתחקיר אחרי פעילות: אפשר לראות מה קרה ברשת בכל רגע."}, {"h": "התקנה"}, {"p": "קובץ ההתקנה זמין מאתר WatchDox של DTC (דרך מנהל החשבון או פורטל התמיכה). מריצים אותו ומשאירים את הגדרות ברירת המחדל. בסוף נוצר קיצור דרך בשולחן העבודה."}, {"p": "פותחים את התוכנה, ובתפריט **Mode** בוחרים **Recorder** (הקלטה) או **Player** (השמעה)."}, {"h": "הקלטה (Recorder)"}, {"ol": ["בשדה **Directory** בוחרים תיקייה לשמירת ההקלטות.", "בשדה **Mesh Address** מקלידים את כתובת ה־IP של המקמ״ש שרוצים להקליט.", "פרטי כניסה: **Username ריק**, **Password = Eastwood** (ברירת המחדל).", "לוחצים **Record** כדי להתחיל ו־**Stop** כדי לעצור.", "אם קורה משהו חשוב בזמן ההקלטה, לוחצים **Add Point Of Interest** ורושמים מה קרה (למשל „הפרעה”). זה ישמש כנקודת קפיצה בהשמעה."]}, {"note": "בכל הקלטה נוצר קובץ zip חדש, וגם כשהקלטה עוברת 64,000 קבצים. שם הקובץ כולל את ה־ESN של המקמ״ש ואת התאריך והשעה, ואפשר לשנות אותו.", "kind": "tip"}, {"h": "הורדת לוגים שנשמרו במקמ״ש"}, {"ol": ["בממשק ה־Web של המקמ״ש: **Global Setup > Advanced > JSON Logging**.", "**Enable Logging = Yes** ולוחצים **Save**. הלוגים נשמרים בכרטיס ה־SD של המקמ״ש.", "אפשר לכבות את **Log local RF status** ו־**Log spectrum** אם לא צריך. **Max log size** עד 512,000MB.", "בתוכנה, במסך ההקלטה, לוחצים **Download**, בוחרים קבצים ולוחצים **Download**. הם נשמרים בתיקייה שהוגדרה."]}, {"h": "השמעה (Player)"}, {"ol": ["עוברים ל־**Mode > Player**. הקובץ האחרון נבחר אוטומטית, או בוחרים קובץ ידנית (אפשר כמה קבצים ברצף).", "בשדה **Mesh Address** מקלידים כתובת של מקמ״ש מחובר. הוא משמש כ־proxy להצגת הנתונים.", "לוחצים **Open Browser** (ייתכן שיתבקשו פרטי כניסה), ואז **Play**. **Stop** עוצר."]}, {"note": "ההקלטות מיועדות בעיקר לנתוני סטטוס. **לא לגלוש** בדפי Dashboard או Apps בזמן ההשמעה.", "kind": "caution"}, {"table": {"head": ["כלי ניווט", "מה הוא עושה"], "rows": [["**בחירת סוג קובץ**", "קובע את הקפיצות בחיצים: Local RF Status (תת־קבוצה מהירה של הסטטוס), Spectrum (מוצג ב־Status > Spectra), Status (כל דפי הסטטוס)."], ["**חיצים ◀ ▶**", "קפיצה אחורה או קדימה, ברזולוציה של סוג הקובץ שנבחר."], ["**Points Of Interest**", "קפיצה לנקודות שסומנו בזמן ההקלטה."], ["**סרגל זמן**", "מעבר לרגע מסוים בהקלטה. השעה מוצגת ב־Current Time."]]}}, {"note": "תמיכה של DTC: ‎+44 1489 884 550 (בריטניה), ‎+1 571 563 7077 (ארה״ב).", "kind": "note"}], "en": [{"p": "**Domo Mesh Replay** is a PC application that records status data from an IP Mesh radio (JSON files in a zip) and plays it back through the radio’s web interface. Useful for debriefing: you can see what happened in the network at any moment."}, {"h": "Installation"}, {"p": "The installer is available from DTC’s WatchDox facility (via your account manager or the support portal). Run it and keep the default settings. A desktop shortcut is created."}, {"p": "Open the app and choose **Recorder** or **Player** from the **Mode** menu."}, {"h": "Recorder"}, {"ol": ["Set the **Directory** where recordings are saved.", "Enter the **Mesh Address** (IP) of the radio to record.", "Credentials: **Username blank**, **Password = Eastwood** (default).", "Click **Record** to start and **Stop** to end.", "If something important happens, click **Add Point Of Interest** and describe it (e.g. “Interference”). It becomes a jump point during playback."]}, {"note": "A new zip file is created for each recording, or when a recording exceeds 64,000 files. The file name includes the radio ESN and the start date and time; you can rename it.", "kind": "tip"}, {"h": "Downloading logs stored on the radio"}, {"ol": ["In the radio web interface: **Global Setup > Advanced > JSON Logging**.", "Set **Enable Logging = Yes** and click **Save**. Logs are saved to the radio’s SD card.", "You can turn off **Log local RF status** and **Log spectrum**. **Max log size** up to 512,000 MB.", "In the app’s Recorder page, click **Download**, select files and click **Download**. They are saved to the Directory."]}, {"h": "Player"}, {"ol": ["Switch to **Mode > Player**. The last file is selected automatically, or browse for files (several can play in sequence).", "Enter the **Mesh Address** of a connected radio; it acts as a proxy web interface.", "Click **Open Browser** (credentials may be needed), then **Play**. **Stop** pauses or ends."]}, {"note": "Recordings are mainly for status parameters. **Do not browse** the Dashboard or Apps pages during playback.", "kind": "caution"}, {"table": {"head": ["Tool", "What it does"], "rows": [["**JSON file selection**", "Sets the arrow step: Local RF Status (fast subset of status), Spectrum (Status > Spectra page), Status (all status pages)."], ["**Arrows ◀ ▶**", "Step back or forward at the selected file’s resolution."], ["**Points Of Interest**", "Jump to points added during recording."], ["**Time slider**", "Move to a moment in the recording; shown in Current Time."]]}}, {"note": "DTC support: +44 1489 884 550 (UK), +1 571 563 7077 (US).", "kind": "note"}]}, "updated": "2026-11-10"}, {"id": "sys-aux", "sec": "comm-tech", "type": "guide", "title": {"he": "בקרים, טאבלט, רחפן וקופסת מפעיל – נתונים", "en": "Controllers, tablet, drone & operator box – specs"}, "summary": {"he": "ROCU-10, ROCU-1, טאבלט, רחפן, קופסת מפעיל", "en": "ROCU-10, ROCU-1, tablet, drone, operator box"}, "body": {"he": [{"h": "ROCU-10 – בקר המפעיל"}, {"p": "מאפשר לנהוג ברכב, להפעיל את הפנסים ולסרוק את השטח בארבע המצלמות."}, {"table": {"head": ["פרמטר", "ערך"], "rows": [["מסך", "10.1\" מגע, 1920×1200, ‏800 nits"], ["מעבד / מערכת", "Intel Core i5-1235U · Windows 10/11 IoT LTSC או Linux"], ["זיכרון / אחסון", "8GB DDR5 · ‏128GB SSD"], ["רשת", "LAN עם מחבר M8"], ["סוללה", "11.1V, 6400mAh, 3S2P, החלפה חמה"], ["טמפ׳ עבודה", "‎-20~60°C (חשמל), ‎-10~50°C (סוללה)"], ["מידות / משקל", "319.9×188.9×51.5 מ״מ · פחות מ־2 ק״ג"], ["בקרים", "2 ג׳ויסטיקים, 2 מתגי טוגל, 2 גלגלות, 6 לחצנים, 2 רמקולים"], ["עמידות", "IP65 · MIL-STD-810H · MIL-STD-461G"]]}}, {"h": "ROCU-1 – בקר נהיגה קצר טווח (אופציונלי)"}, {"p": "לנהיגה בלבד ובטווח קצר (קשר עין)."}, {"table": {"head": ["פרמטר", "ערך"], "rows": [["מידות / משקל", "60×49×184 מ״מ · ‏0.8 ק״ג"], ["תקשורת", "DIGI XBEE"], ["הזנה", "2 סוללות AA ליתיום 1.5V (L91)"], ["זמן עבודה", "עד 8 שעות"], ["טמפ׳ עבודה", "‎-20°C עד +60°C"], ["אטימות", "IP65"]]}}, {"h": "טאבלט מפקד"}, {"p": "לתצפית ושליטה של המפקד כשהוא בשטח, מחוץ לקרון. מתחבר לקופסת המפעיל."}, {"table": {"head": ["פרמטר", "ערך"], "rows": [["מסך", "12.2\" WUXGA, ‏1,200 nits, קריא באור שמש"], ["מערכת / זיכרון", "Windows 11 Pro · ‏16GB · ‏256GB SSD"], ["סוללות", "2 × Li-ion 7.74V, החלפה חמה"], ["משקל", "1.41 ק״ג"], ["עמידות", "IP66 · MIL-STD-810H · MIL-STD-461G"], ["טמפ׳ עבודה", "‎-29°C עד 63°C"]]}}, {"h": "סט רחפן ממסר (Drone COM Set)"}, {"p": "מבוסס על רחפן **EVO Max 4T** עם מודול ממסר **BluSDR** שמתחבר לרשת ה־RF/Mesh. משגרים אותו מהקרון, והוא משמש גשר תקשורת בין הכלים, הקרון ועמדות מפעיל מרוחקות, וגם מספק וידאו ומיפוי. מערכת SkyLink 3.0: ‏6 אנטנות, 4 תחומי תדר, הצפנת AES-256, ‏4G אופציונלי."}, {"h": "קופסת מפעיל (Operator Box)"}, {"p": "מחוברת בין ה־ROCU-10 לבקר מערכת הנשק, לקרון או לחצובת הממסר, וישירות לכלים. עובדת על שתי סוללות או על הזנה חיצונית. כוללת מתג הפעלה ומתג EMO."}, {"note": "מקור: ROBOX System Technical Data, DOC00672-A REV.001.", "kind": "note"}], "en": [{"h": "ROCU-10 – operator controller"}, {"p": "Drives the vehicle, operates the LEDs and scans the field with the four cameras."}, {"table": {"head": ["Parameter", "Value"], "rows": [["Display", "10.1\" touch, 1920×1200, 800 nits"], ["CPU / OS", "Intel Core i5-1235U · Windows 10/11 IoT LTSC or Linux"], ["Memory / storage", "8GB DDR5 · 128GB SSD"], ["Network", "LAN with M8 connector"], ["Battery", "11.1 V, 6400 mAh, 3S2P, hot-swap"], ["Operating temp", "-20~60°C (AC), -10~50°C (battery)"], ["Size / weight", "319.9×188.9×51.5 mm · < 2 kg"], ["Controls", "2 joysticks, 2 toggle switches, 2 rollers, 6 buttons, 2 speakers"], ["Ruggedness", "IP65 · MIL-STD-810H · MIL-STD-461G"]]}}, {"h": "ROCU-1 – short-range drive controller (optional)"}, {"p": "Driving only, at close range (line of sight)."}, {"table": {"head": ["Parameter", "Value"], "rows": [["Size / weight", "60×49×184 mm · 0.8 kg"], ["Communication", "DIGI XBEE"], ["Power", "2 × AA 1.5 V lithium (L91)"], ["Working time", "Up to 8 hours"], ["Operating temp", "-20°C to +60°C"], ["Ingress protection", "IP65"]]}}, {"h": "Commander tablet"}, {"p": "For commander observation and control when deployed outside the container. Connects to the operator box."}, {"table": {"head": ["Parameter", "Value"], "rows": [["Display", "12.2\" WUXGA, 1,200 nits, sunlight readable"], ["OS / memory", "Windows 11 Pro · 16GB · 256GB SSD"], ["Batteries", "2 × Li-ion 7.74 V, hot-swap"], ["Weight", "1.41 kg"], ["Ruggedness", "IP66 · MIL-STD-810H · MIL-STD-461G"], ["Operating temp", "-29°C to 63°C"]]}}, {"h": "Drone COM Set"}, {"p": "Based on the **EVO Max 4T** drone with a **BluSDR** relay module linked to the RF/Mesh network. Launched from the container, it bridges the vehicles, the container and remote operator stations, and provides video and mapping. SkyLink 3.0: 6 antennas, 4 bands, AES-256, optional 4G."}, {"h": "Operator Box"}, {"p": "Connected between the ROCU-10 and the gun system controller, to the container or tripod relay, and directly to the vehicles. Runs on two batteries or external power. Has a power switch and an EMO switch."}, {"note": "Source: ROBOX System Technical Data, DOC00672-A REV.001.", "kind": "note"}]}, "updated": "2026-11-10"}, {"id": "container-spec", "sec": "container", "type": "guide", "title": {"he": "קרון שליטה – נתונים כלליים", "en": "Control container – general data"}, "summary": {"he": "מידות, תכולה ויכולות", "en": "Dimensions, contents and capabilities"}, "body": {"he": [{"p": "הקרון הוא לב מערכת ROBOX: יחידת ISO באורך 20 רגל שמשמשת גם להובלה וגם כמרכז שליטה ובקרה. בזמן הובלה הוא נושא את שני הכלים, הציוד והמטענים. בשטח פורקים את הכלים, והקרון הופך לעמדת שליטה מלאה."}, {"ul": ["בתוכו: עמדות המפעילים, מערכות התקשורת, ייצור ואגירת חשמל, ותורן נשלף לאנטנות RF, סלולר ו־GPS.", "גנרטור וניהול חשמל אוטומטי לפעולה רציפה.", "ממוזג, מוגן אבק, עומד ב־MIL-STD-810G."]}, {"table": {"head": ["פרמטר", "ערך"], "rows": [["מידות (א×ר×ג)", "6.953 × 2.531 × 2.785 מ׳"], ["אורך כולל רמסע", "7.035 מ׳"], ["סוג", "DVN (פלדה), מתאים להובלה במשאית"], ["בידוד", "פאנלים מבודדים (SIP)"], ["עמדות הפעלה", "עד 9 עמדות"]]}}, {"note": "מקור: ROBOX System Technical Data, DOC00672-A REV.001.", "kind": "note"}], "en": [{"p": "The container is the core of the ROBOX system: a 20-ft ISO unit that serves both as transport and as the command-and-control center. In transport it carries both vehicles, accessories and payloads. On site the vehicles are unloaded and the container becomes a full control hub."}, {"ul": ["Inside: operator consoles, communications, power generation and storage, and an extendable mast for RF, cellular and GPS antennas.", "Generator and automatic power management for sustained operation.", "Climate-controlled, dust-protected, MIL-STD-810G compliant."]}, {"table": {"head": ["Parameter", "Value"], "rows": [["Dimensions (L×W×H)", "6.953 × 2.531 × 2.785 m"], ["Length with RAMSA lift", "7.035 m"], ["Type", "DVN (steel), fit for truck transport"], ["Insulation", "Structural insulated panels"], ["Operator stations", "Up to 9"]]}}, {"note": "Source: ROBOX System Technical Data, DOC00672-A REV.001.", "kind": "note"}]}, "updated": "2026-11-10"}, {"id": "mast-spec", "sec": "c-mast", "type": "guide", "title": {"he": "תורן – נתונים", "en": "Mast – data"}, "summary": {"he": "גובה 5–15 מ׳, עד 10 ק״מ RF", "en": "Height 5–15 m, up to 10 km RF"}, "body": {"he": [{"p": "התורן נושא את קופסת התקשורת (RF, סלולר ו־GPS) שמותקנת על הקרון ומחוברת לקופסת ההפעלה. מאפשר שליטה בכלים מהקרון למרחק רב – **עד 10 ק״מ** בתקשורת RF."}, {"table": {"head": ["פרמטר", "ערך"], "rows": [["גובה", "5–15 מ׳"], ["עומס מרבי בראש התורן", "10 ק״ג"]]}}, {"note": "מקור: ROBOX System Technical Data, DOC00672-A REV.001.", "kind": "note"}], "en": [{"p": "The mast carries the communication box (RF, cellular and GPS) mounted on the container and connected to the operation box, enabling long-range vehicle control from the container – **up to 10 km** over RF."}, {"table": {"head": ["Parameter", "Value"], "rows": [["Height", "5–15 m"], ["Max head load", "10 kg"]]}}, {"note": "Source: ROBOX System Technical Data, DOC00672-A REV.001.", "kind": "note"}]}, "group": "tech", "updated": "2026-11-10"}, {"id": "ac-spec", "sec": "c-ac", "type": "guide", "title": {"he": "מזגן – נתונים טכניים", "en": "Air conditioner – technical data"}, "summary": {"he": "Electra Classic INV 170", "en": "Electra Classic INV 170"}, " 500-0120`", "SHEAVE, MOVABLE - DRIVE", "1"], ["19", "`500-0119-003`", "ROLLER, DRIVE - 53 GRAM", "8"], ["20", "`500-0117-004`", "SPRING, DRIVE - GREEN", "1"], ["21", "`500-0121`", "PLATE, MOVABLE - DRIVE", "1"], ["22", "`500-0123`", "NUT, M24X1.5", "1"], ["23", "`500-0114`", "BEARING, DRIVE - IDLER", "1"], ["24", "`500-0115`", "WASHER, DRIVE - VESPEL", "1"], ["25", "`500-0118`", "SLIDER, DRIVE", "4"], ["26", "`500-0122`", "WASHER, DRIVE", "1"], ["27", "`500-0109`", "COLLAR, DRIVE - SHIFT STOP", "1"], ["28", "`500-0130`", "BUSHING, DRIVEN", "1"], ["29", "`500-0132`", "SHEAVE, MOVABLE - DRIVEN", "1"], ["30", "`500-0128`", "HELIX, DRIVEN - 36 DEG", "1"], ["31", "`500-0135`", "ROLLER, DRIVEN", "2"], ["32", "`500-0136`", "TAB LOCK, DRIVEN - 10mm", "2"], ["33", "`500-0137`", "SCREW, CAM ROLLER", "2"], ["34", "`500-0131`", "SHEAVE, STATIONARY - DRIVEN", "1"], ["35", "`500-0133`", "SCREW, M8x1.25-25", "4"], ["36", "`500-0129-001`", "SPRING, DRIVEN - PUR", "1"], ["37", "`500-0139`", "SPACER, SPRING", "1"]]}}, {"note": "Drive belt inspection: monthly (Field) per the maintenance summary, and every 25 hours per the ARGO service manual (Clutch System chapter).", "kind": "freq"}]}, "group": "docs", "updated": "2026-11-10"}, {"id": "bison-energy", "sec": "b-energy", "type": "guide", "title": {"he": "מאזן הספק ואנרגיה – ביזון", "en": "Power & energy balance – BISON"}, "summary": {"he": "מצברים, צריכה, זמני עבודה ואחסון", "en": "Batteries, consumption, run and storage times"}, "body": {"he": [{"note": "**טיוטה** – רוויזיה 001 (20.10.26). עודכן בעקבות הטמעת אלטרנטור משני למערכת המשימה.", "kind": "caution"}, {"h": "מבנה מערכת החשמל"}, {"ul": ["**מערכת הרכב:** אלטרנטור פנימי ומצבר 12V/30Ah. האלטרנטור נותן כ־5A בסרק ו־50A בסל״ד גבוה. המצבר מתניע את המנוע ומזין את חשמל הרכב ואת פנסי ה־LED.", "**מאוורר המנוע** הוא צרכן גדול (100W), ולכן הוא מוזן ממצבר ה־12V המשני של מערכת המשימה.", "**מערכת המשימה:** אלטרנטור משני על ציר המנוע (פולי 1:2.5) – כ־45A בסרק ועד 80A בסל״ד גבוה – שמזין מצבר AGM משני 12V/60Ah.", "**קופסת האנרגיה (Power Box):** תחום 12V מזין את הבקרה הנמוכה (LLC), את קופסת ההפעלה ואת מטען 12V→48V (350W) שמטעין מצבר LiPo 48V/50Ah (2400Wh). תחום 48V מזין שני ספקים: 24V (בקרה גבוהה) ו־28V (מערכת נשק)."]}, {"img": "media/bison-energy-diagram.png", "cap": "סכמת בלוקים של מערכת האנרגיה"}, {"h": "מקורות אנרגיה"}, {"table": {"head": ["מצבר", "קיבולת", "אנרגיה אפקטיבית"], "rows": [["12V של הרכב", "30Ah / 360Wh", "216Wh (שומרים 40% להתנעה)"], ["12V משני (משימה)", "60Ah / 720Wh", "432Wh (שומרים 40% לבריאות המצבר)"], ["LiPo 48V (משימה)", "50Ah / 2400Wh", "—"]]}}, {"h": "צריכה לפי מצב"}, {"table": {"head": ["צרכן", "שקט (מנוע כבוי)", "סרק (~800 סל״ד)", "נסיעה (2,000+ סל״ד)"], "rows": [["רכב ARGO (חשמל + LED)", "0W", "55W", "55W"], ["בקרה נמוכה (LLC)", "40W", "40W", "125W"], ["מערכת משימה (HLC, מצלמות, נשק, DTC, סלולר...)", "208W", "208W", "208W"]]}}, {"h": "זמני עבודה ואחסון"}, {"table": {"head": ["מצב", "תוצאה"], "rows": [["**מצב שקט** – מצבר 12V משני", "~9 שעות (שמרני), עד 15 שעות בקיבולת מלאה"], ["**מצב שקט** – מצבר 48V", "~11 שעות"], ["**סרק / נסיעה**", "מאזן חיובי בכל המצברים – פעולה רציפה כל עוד המנוע פועל ויש דלק"], ["**אחסון כבוי** – מצבר 48V", "עד ~60 יום (בגלל צריכת ה־BMS)"], ["**אחסון כבוי** – מצבר 12V משני", "~75 יום"], ["**אחסון כבוי** – מצבר 12V רכב", "~1500 יום"]]}}, {"note": "כדי להאריך את זמן האחסון של מצבר ה־12V המשני, מנתקים את הצרכנים בלחיצה על כפתור ה־**RESET** של מפסק הפחת הראשי בתא המנוע.", "kind": "tip"}, {"note": "הספק טעינת מצבר 12V משני: 26W בסרק ו־447W בנסיעה. כשהמצברים מלאים, האלטרנטור יורד ל־248W בסרק ו־333W בנסיעה.", "kind": "note"}, {"note": "במסמך זה המנוע מתואר כ־800 סמ״ק ו־40HP, ובמפרט היצרן כ־VX 950 ‏(993 סמ״ק). לבירור.", "kind": "caution"}], "en": [{"note": "**DRAFT** – revision 001 (20.10.26). Updated after adding a secondary alternator to the mission system.", "kind": "caution"}, {"h": "Power system layout"}, {"ul": ["**Vehicle system:** internal alternator and 12 V/30 Ah battery. About 5 A at idle and 50 A at high rpm. The battery starts the engine and feeds vehicle electrics and the LED lights.", "**Engine fan** is a large load (100 W), so it is fed from the mission system’s secondary 12 V battery.", "**Mission system:** secondary alternator on the engine shaft (pulley 1:2.5) – about 45 A at idle up to 80 A at high rpm – charging a 12 V/60 Ah AGM battery.", "**Power Box:** the 12 V side feeds the LLC, the control panel and a 12 V→48 V charger (350 W) for a 48 V/50 Ah LiPo (2400 Wh). The 48 V side feeds two supplies: 24 V (high-level control) and 28 V (gun system)."]}, {"img": "media/bison-energy-diagram.png", "cap": "Power system block diagram"}, {"h": "Energy sources"}, {"table": {"head": ["Battery", "Capacity", "Effective energy"], "rows": [["Vehicle 12 V", "30 Ah / 360 Wh", "216 Wh (40% kept for starting)"], ["Secondary 12 V (mission)", "60 Ah / 720 Wh", "432 Wh (40% kept for battery health)"], ["LiPo 48 V (mission)", "50 Ah / 2400 Wh", "—"]]}}, {"h": "Consumption by mode"}, {"table": {"head": ["Load", "Silent (engine off)", "Idle (~800 rpm)", "Driving (2,000+ rpm)"], "rows": [["ARGO vehicle (electrics + LED)", "0 W", "55 W", "55 W"], ["Low-level control (LLC)", "40 W", "40 W", "125 W"], ["Mission system (HLC, cameras, gun, DTC, cellular...)", "208 W", "208 W", "208 W"]]}}, {"h": "Operating and storage times"}, {"table": {"head": ["Mode", "Result"], "rows": [["**Silent** – secondary 12 V", "~9 h (conservative), up to 15 h at full capacity"], ["**Silent** – 48 V battery", "~11 h"], ["**Idle / driving**", "Positive balance on all batteries – continuous while the engine runs and there is fuel"], ["**Storage (off)** – 48 V", "Up to ~60 days (BMS draw)"], ["**Storage (off)** – secondary 12 V", "~75 days"], ["**Storage (off)** – vehicle 12 V", "~1500 days"]]}}, {"note": "To extend secondary 12 V storage time, disconnect the loads by pressing the **RESET** button of the main RCD breaker in the engine compartment.", "kind": "tip"}, {"note": "Secondary 12 V charging power: 26 W at idle, 447 W when driving. With batteries full, the alternator drops to 248 W at idle and 333 W when driving.", "kind": "note"}, {"note": "This document describes the engine as 800 cc / 40 HP, while the manufacturer spec lists VX 950 (993 cc). To be confirmed.", "kind": "caution"}]}, "group": "tech", "updated": "2026-11-10"}, {"id": "sw-nodefinder", "sec": "comm-air", "type": "software", "title": {"he": "Domo Node Finder – איתור מקמ״שים באוויר", "en": "Domo Node Finder – find radios on air"}, "summary": {"he": "תוכנת DTC לזיהוי המקמ״שים הפעילים ברשת · גרסה 2.5.1", "en": "DTC tool to see the active radios on the network · v2.5.1"}, "body": {"ver": "2.5.1", "file": "DomoNodeFinder-2.5.1.exe", "path": "Desktop\\DomoNodeFinder.exe", "url": "", "install": {"he": ["מעתיקים את הקובץ DomoNodeFinder-2.5.1.exe מהשרת של החברה למחשב הנייד (הוא שוקל כ־28MB).", "מריצים אותו. אם Windows מבקש אישור – מאשרים.", "שמים קיצור דרך בשולחן העבודה כדי למצוא אותו מהר בשטח.", "מחברים את המחשב לרשת של המקמ״שים ופותחים את התוכנה: היא מציגה את המקמ״שים שנמצאים כרגע באוויר."], "en": ["Copy DomoNodeFinder-2.5.1.exe from the company server to the laptop (about 28 MB).", "Run it. If Windows asks for permission, allow it.", "Put a desktop shortcut so it is easy to find in the field.", "Connect the laptop to the radio network and open the program: it shows the radios currently on air."]}, "note": {"he": "משמשת לראות אילו מקמ״שים נמצאים באוויר ברגע נתון. תוכנה של DTC – הקובץ עצמו נשמר בשרת של החברה ולא באפליקציה.", "en": "Used to see which radios are on air at a given moment. DTC software – the file itself is kept on the company server, not in the app."}}, "updated": "2026-11-10"}, {"id": "llc-brakes", "sec": "b-low", "type": "guide", "title": {"he": "מערכת הבלמים – NC, בלם יד ובלם רגיל", "en": "Brake system – NC, hand brake and standard brake"}, "summary": {"he": "בלם NC בטוח בכשל, בלם יד, היגוי בבלימה", "en": "Fail-safe NC brake, hand brake, brake steering"}, "body": {"he": [{"p": "לכלי שלוש מערכות בלימה שפועלות במקביל: **בלם NC**, **בלם יד** ו**בלם רגיל** (בלמי הגלגלים)."}, {"h": "בלם NC (סגור במצב רגיל)"}, {"p": "המנגנון מבטיח שהכלי ייעצר לגמרי בכל אובדן חשמל, תקלה או מצב חירום. הבלם **מופעל כברירת מחדל**, כשהמערכת כבויה או לא פעילה."}, {"ul": ["**ידית בלם** – מחוברת מכנית לדוושת הבלם.", "**קפיץ החזרה** – קפיץ במתיחה גבוהה שמושך את הדוושה למצב בלימה.", "**מפעיל לינארי** – מותח את הקפיץ כדי לשחרר את הבלם כשהמערכת פועלת.", "**מנעול אלקטרומגנטי** – מחזיק את הקפיץ מתוח (בלם משוחרר) כל עוד יש חשמל."]}, {"table": {"head": ["מצב", "מה קורה"], "rows": [["**מערכת כבויה / אין חשמל**", "האלקטרומגנט משוחרר, הקפיץ מתכווץ ולוחץ על הדוושה – הכלי בלום."], ["**מערכת פועלת**", "המפעיל מותח את הקפיץ, האלקטרומגנט נועל אותו – הבלם משוחרר והכלי יכול לנסוע."], ["**תקלה / נפילת חשמל / כיבוי**", "האלקטרומגנט משחרר את הקפיץ מיד – בלימה מיידית."]]}}, {"h": "בלם יד"}, {"p": "כדי להתחיל לנסוע צריך לשחרר את בלם היד. **התנעת המנוע מותרת רק כשבלם היד מופעל.**"}, {"h": "בלם רגיל והיגוי"}, {"p": "לכל ציר (שמאל וימין) יש בלם משלו. בבלימה רגילה שניהם מופעלים בפקודה אחת. בפנייה הבקרה בולמת ציר אחד: פנייה שמאלה = בלימת הציר הימני, פנייה ימינה = בלימת הציר השמאלי."}, {"note": "רכב ה־ARGO יכול להסתובב במקום (Pivot) רק בהילוך **LOW**.", "kind": "tip"}, {"note": "מקור: ROBOX System Technical Data, DOC00672-A REV.001.", "kind": "note"}], "en": [{"p": "The vehicle has three parallel brake systems: the **NC brake**, the **hand brake** and the **standard brake** (wheel brakes)."}, {"h": "NC brake (Normally Closed)"}, {"p": "Ensures a complete stop on any power loss, malfunction or emergency. The brake is **engaged by default** when the system is off or inactive."}, {"ul": ["**Brake lever** – mechanically linked to the brake pedal.", "**Return spring** – high-tension spring that pulls the pedal into braking.", "**Linear actuator** – stretches the spring to release the brake when the system is running.", "**Electromagnet lock** – holds the spring stretched (brake released) while powered."]}, {"table": {"head": ["State", "What happens"], "rows": [["**System off / no power**", "Electromagnet released, spring contracts and presses the pedal – vehicle braked."], ["**System running**", "Actuator stretches the spring, electromagnet locks it – brake released, vehicle can move."], ["**Fault / power loss / shutdown**", "Electromagnet releases the spring instantly – immediate braking."]]}}, {"h": "Hand brake"}, {"p": "Release the hand brake to start moving. **Engine start is allowed only with the hand brake on.**"}, {"h": "Standard brake and steering"}, {"p": "Each axle side (left, right) has its own brake; normal braking applies both with one command. When turning, the control brakes one side: left turn = right side brake, right turn = left side brake."}, {"note": "The ARGO vehicle can pivot (turn on the spot) only in **LOW** gear.", "kind": "tip"}, {"note": "Source: ROBOX System Technical Data, DOC00672-A REV.001.", "kind": "note"}]}, "group": "tech", "updated": "2026-11-10"}, {"id": "llc-emo", "sec": "b-low", "type": "guide", "title": {"he": "EMO – עצירת חירום", "en": "EMO – emergency stop"}, "summary": {"he": "3 לחצנים ו־EMO אלחוטי FORT", "en": "3 switches and FORT wireless EMO"}, "body": {"he": [{"p": "במערכת שני סוגי EMO: **לחצן EMO** פיזי, ו**EMO אלחוטי** (FORT EPC-1000)."}, {"table": {"head": ["מיקום", "לחצן EMO", "EMO אלחוטי (FORT)"], "rows": [["כלי (ביזון)", "2", "1"], ["קופסת מפעיל", "1", "1"]]}}, {"h": "מה קורה בלחיצה"}, {"ul": ["**לחצן EMO:** בלם ה־NC נכנס לפעולה, ההילוך עובר ל־**N** והמנוע נכבה.", "**EMO אלחוטי:** לחיצה על ה־EMO בקופסת המפעיל מפעילה את ה־EMO האלחוטי בכלי – בלם NC, הילוך N, כיבוי מנוע."]}, {"note": "בניסוי אוגוסט 2026 כל מצבי הכשל (ניתוק כבל שליטה, ניתוק חשמל, אובדן תקשורת, נפילת מתח) הפעילו E-STOP כנדרש. סגירת אפליקציית השליטה עוצרת את הכלי, אבל **המנוע נשאר מונע**.", "kind": "important"}, {"h": "לחצן EMO"}, {"table": {"head": ["פרמטר", "ערך"], "rows": [["מידות", "72×45×45 מ״מ"], ["סוג", "Push-Turn"], ["טמפ׳ עבודה", "‎-20 עד +70°C"], ["זרם", "5A"], ["אטימות", "IP69K"]]}}, {"h": "EMO אלחוטי – FORT EPC-1000"}, {"table": {"head": ["פרמטר", "ערך"], "rows": [["תפקיד", "שולח ומקבל פקודות בטיחות SIL 3 (עצירה, זחילה, השהיה) ב־Wi-Fi או Ethernet"], ["זמן תגובה", "100ms בממוצע + השהיית רשת"], ["Timeout בטיחות", "250 / 500 / 750 / 1000ms (לבחירה)"], ["מתח עבודה", "8–32V DC (12V או 24V נומינלי)"], ["צריכה", "2.18–2.78W"], ["אטימות / טמפ׳", "IP65 · ‏‎-40°C עד 85°C"], ["מידות / משקל", "228×174×61 מ״מ · ‏878 גר׳"], ["CAN", "J1939, CANopen"], ["הסמכה", "SIL 3 לפי IEC 61508"]]}}, {"note": "מקור: ROBOX System Technical Data, DOC00672-A REV.001.", "kind": "note"}], "en": [{"p": "The system has two EMO types: a physical **EMO switch** and a **wireless EMO** (FORT EPC-1000)."}, {"table": {"head": ["Location", "EMO switch", "Wireless EMO (FORT)"], "rows": [["Vehicle (BISON)", "2", "1"], ["Operator box", "1", "1"]]}}, {"h": "What happens when pressed"}, {"ul": ["**EMO switch:** the NC brake engages, the gear goes to **N** and the engine shuts off.", "**Wireless EMO:** pressing EMO on the operator box triggers the vehicle’s wireless EMO – NC brake, gear N, engine off."]}, {"note": "In the August 2026 trial every failure mode (control cable, power, comms loss, voltage drop) triggered E-STOP as designed. Closing the control application stops the vehicle, but **the engine keeps running**.", "kind": "important"}, {"h": "EMO switch"}, {"table": {"head": ["Parameter", "Value"], "rows": [["Dimensions", "72×45×45 mm"], ["Type", "Push-Turn"], ["Working temp", "-20 to +70°C"], ["Current rating", "5 A"], ["IP rating", "IP69K"]]}}, {"h": "Wireless EMO – FORT EPC-1000"}, {"table": {"head": ["Parameter", "Value"], "rows": [["Role", "Sends and receives SIL 3 safety commands (e-stop, crawl, pause) over Wi-Fi or Ethernet"], ["Response time", "100 ms avg + network latency"], ["Safety timeout", "250 / 500 / 750 / 1000 ms (selectable)"], ["Operating voltage", "8–32 V DC (12 V or 24 V nominal)"], ["Power draw", "2.18–2.78 W"], ["Rating / temp", "IP65 · -40°C to 85°C"], ["Size / weight", "228×174×61 mm · 878 g"], ["CAN", "J1939, CANopen"], ["Certification", "SIL 3 per IEC 61508"]]}}, {"note": "Source: ROBOX System Technical Data, DOC00672-A REV.001.", "kind": "note"}]}, "group": "tech", "updated": "2026-11-10"}, {"id": "gun-spec", "sec": "b-weapon", "type": "guide", "title": {"he": "מערכת נשק Pitbull – נתונים טכניים", "en": "Pitbull gun system – technical data"}, "summary": {"he": "FN MAG, ‏24V, ‏80W, מצלמות ומד טווח", "en": "FN MAG, 24 V, 80 W, cameras and LRF"}, "body": {"he": [{"p": "מערכת נשק **Pitbull** של General Robotics."}, {"table": {"head": ["פרמטר", "ערך"], "rows": [["מידות (ללא נשק)", "75×175×63 ס״מ"], ["קוטר סיבוב עם נשק", "193 ס״מ"], ["משקל (ללא נשק ותחמושת)", "פחות מ־95 ק״ג"], ["משקל קרבי כולל", "פחות מ־165 ק״ג"], ["התקנה", "עיגון מהיר, 4 ברגים"], ["נשק ראשי", "FN MAG, דריכה מרחוק"], ["תחמושת", "200 כדורים"], ["הגבהה", "‎-30° עד +60° (תלוי בבסיס)"], ["מתח עבודה", "24V נומינלי (22–36V) מהכלי"], ["צריכה ממוצעת", "80W"], ["סיבוב אופקי", "N×360°"], ["דיוק", "0.4 מיליראדיאן"], ["מהירות סיבוב והגבהה", "90° לשנייה"], ["מייצב", "2 צירים, דיוק 0.01°"], ["מצלמה תרמית", "זום 26–105 מ״מ, גילוי אדם עד 1000 מ׳"], ["מצלמת יום HD", "זום אופטי ×40, גילוי אדם עד 1600 מ׳"], ["מד טווח לייזר", "5.1 ק״מ (10 ק״מ באופציה), Class 1 ‏1550nm"], ["יכולות", "Point & Shoot, עקיבה יום ולילה, גילוי מטרות אוטומטי"], ["תקנים", "MIL-STD-810G, 882E, 461F, 464, 1275D"]]}}, {"h": "בקר מערכת הנשק"}, {"table": {"head": ["פרמטר", "ערך"], "rows": [["מידות / משקל", "36×6×21 ס״מ · ‏2.8 ק״ג"], ["מתח", "12–36VDC"], ["טמפ׳ עבודה", "‎-30° עד +70°C"], ["יכולות", "Point & Shoot, ממשק בטיחות FIZ ו־ACS, וידאו בזמן אמת, מונה תחמושת"], ["חיישנים", "עד 8 חיישנים למעבר אוטומטי למצב בטוח"], ["אטימות", "IP65, MIL-STD-810G"]]}}, {"note": "מקור: ROBOX System Technical Data, DOC00672-A REV.001.", "kind": "note"}], "en": [{"p": "**Pitbull** gun system by General Robotics."}, {"table": {"head": ["Parameter", "Value"], "rows": [["Dimensions (w/o weapon)", "75×175×63 cm"], ["Rotation diameter with weapon", "193 cm"], ["Weight (w/o weapon and ammo)", "< 95 kg"], ["Combat weight", "< 165 kg"], ["Mount", "Fast mounting, 4 bolts"], ["Main armament", "FN MAG, remote cocking"], ["Ammunition", "200 rounds"], ["Elevation", "-30° to +60° (platform dependent)"], ["Operating voltage", "24 V nominal (22–36 V) from the vehicle"], ["Average consumption", "80 W"], ["Traverse", "N×360°"], ["Accuracy", "0.4 mrad"], ["Traverse and tilt speed", "90°/s"], ["Stabilization", "Dual axis, 0.01° accuracy"], ["Thermal camera", "Zoom 26–105 mm, human detection < 1000 m"], ["HD day camera", "40× optical zoom, human detection < 1600 m"], ["Laser range finder", "5.1 km (10 km option), Class 1 1550 nm"], ["Features", "Point & Shoot, day/night tracking, automatic target detection"], ["Standards", "MIL-STD-810G, 882E, 461F, 464, 1275D"]]}}, {"h": "Gun system controller"}, {"table": {"head": ["Parameter", "Value"], "rows": [["Size / weight", "36×6×21 cm · 2.8 kg"], ["Voltage", "12–36 VDC"], ["Operating temp", "-30° to +70°C"], ["Features", "Point & Shoot, FIZ & ACS safety interface, real-time video, ammo counter"], ["Sensors", "Up to 8 for automatic transition to safe mode"], ["Rating", "IP65, MIL-STD-810G"]]}}, {"note": "Source: ROBOX System Technical Data, DOC00672-A REV.001.", "kind": "note"}]}, "group": "tech", "updated": "2026-11-10"}, {"id": "hlc-sw", "sec": "b-high-gen", "type": "guide", "title": {"he": "בקרה גבוהה – פלטפורמת התוכנה", "en": "High-level control – software platform"}, "summary": {"he": "ROS 2, גרסאות בשטח, דרישות רשת", "en": "ROS 2, field versions, network requirements"}, "body": {"he": [{"p": "מערכת השליטה וניהול הצי מבוססת על **ROS 2**. המפעיל שולט בכלי דרך ממשק Web, רואה מצלמות וטלמטריה בזמן אמת, ויכול לנהל כמה כלים במקביל."}, {"h": "גרסאות בשטח (ניסוי אוגוסט 2026)"}, {"table": {"head": ["רכיב", "גרסה"], "rows": [["בקרה נמוכה (LLC)", "0.2.14"], ["בקרה גבוהה (HLC)", "V1"], ["אפליקציית C2 (Optimus)", "4.3.0"], ["תוכנת צה״ל (SHOR)", "2.5.1"], ["קושחת מקמ״ש DTC", "8.4.4 · MeshUltra-M"]]}}, {"h": "דרישות וביצועים"}, {"table": {"head": ["פרמטר", "ערך"], "rows": [["השהיית שליטה", "פחות מ־100ms מקצה לקצה"], ["רוחב פס מינימלי", "2Mbps לכל כלי (מומלץ 5–10Mbps)"], ["השהיית רשת מרבית", "200ms"], ["וידאו", "15–30 FPS"], ["מחשב בכלי", "Jetson Xavier NX ומעלה, 8GB RAM, ‏20GB פנויים"], ["מחשב מפעיל", "טאבלט/מחשב נייד, 4GB RAM, ‏5GB פנויים, Chrome 100+"], ["מערכת הפעלה בכלי", "Ubuntu 22.04, ‏ROS 2 Humble, Docker"]]}}, {"note": "אם הווידאו מקרטע או שהשליטה מגיבה לאט, בדקו קודם את איכות הקישור (Tactical Display, ‏Levels): מתחת ל־2Mbps לכלי המערכת לא תעבוד כראוי.", "kind": "tip"}, {"h": "כלי אבחון במחשב הכלי"}, {"p": "`htop`, `iotop`, `nethogs`, `docker stats` לניטור משאבים · `journalctl`, `docker logs` ללוגים · `tcpdump`, `iftop`, Wireshark לרשת."}, {"note": "מקור: ROBOX System Technical Data, DOC00672-A REV.001.", "kind": "note"}], "en": [{"p": "The control and fleet management system is built on **ROS 2**. The operator drives through a web interface, sees cameras and telemetry in real time, and can manage several vehicles at once."}, {"h": "Field versions (August 2026 trial)"}, {"table": {"head": ["Component", "Version"], "rows": [["Low-level control (LLC)", "0.2.14"], ["High-level control (HLC)", "V1"], ["C2 application (Optimus)", "4.3.0"], ["IDF software (SHOR)", "2.5.1"], ["DTC radio firmware", "8.4.4 · MeshUltra-M"]]}}, {"h": "Requirements and performance"}, {"table": {"head": ["Parameter", "Value"], "rows": [["Control latency", "< 100 ms end-to-end"], ["Minimum bandwidth", "2 Mbps per vehicle (5–10 recommended)"], ["Max network latency", "200 ms"], ["Video", "15–30 FPS"], ["Vehicle computer", "Jetson Xavier NX or higher, 8 GB RAM, 20 GB free"], ["Operator computer", "Tablet/laptop, 4 GB RAM, 5 GB free, Chrome 100+"], ["Vehicle OS", "Ubuntu 22.04, ROS 2 Humble, Docker"]]}}, {"note": "If video stutters or control is slow, check link quality first (Tactical Display, Levels): below 2 Mbps per vehicle the system will not work properly.", "kind": "tip"}, {"h": "Diagnostic tools on the vehicle computer"}, {"p": "`htop`, `iotop`, `nethogs`, `docker stats` for resources · `journalctl`, `docker logs` for logs · `tcpdump`, `iftop`, Wireshark for the network."}, {"note": "Source: ROBOX System Technical Data, DOC00672-A REV.001.", "kind": "note"}]}, "group": "tech", "updated": "2026-11-10"}, {"id": "tripod-spec", "sec": "comm-tech", "type": "guide", "title": {"he": "סט ממסר חצובה (Tripod Relay Set) – נתונים", "en": "Tripod relay set – data"}, "summary": {"he": "טווח 5 ק״מ, עד 10 שעות", "en": "5 km range, up to 10 hours"}, "body": {"he": [{"table": {"head": ["פרמטר", "ערך"], "rows": [["חצובה – מידות", "1.6×1.6×1.9 מ׳, גובה מרבי 3.5 מ׳"], ["חצובה – משקל / עומס", "5 ק״ג · עד 50 ק״ג"], ["חצובה – התקנה", "4 אנטנות RF, אנטנת סלולר ו־GPS"], ["פליקן / קופסת תקשורת", "490×395×157 / 465×335×220 מ״מ · ‏8 ק״ג כל אחת"], ["ממשקים", "EMO, ‏ROCU-10, בקר Pitbull, 2 סוללות, חשמל חיצוני, 3×ETH, ‏4 אנטנות RF, ‏4 אנטנות סלולר"], ["תקשורת", "IP MESH Phase 5, סלולר"], ["טווח (Phase 5)", "5 ק״מ"], ["הזנה", "2 סוללות MR-2791 או חשמל חיצוני"], ["זמן עבודה", "עד 10 שעות"], ["טמפ׳ / אטימות", "‎-20°C עד +60°C · IP65"]]}}, {"note": "מקור: ROBOX System Technical Data, DOC00672-A REV.001.", "kind": "note"}], "en": [{"table": {"head": ["Parameter", "Value"], "rows": [["Tripod – size", "1.6×1.6×1.9 m, max height 3.5 m"], ["Tripod – weight / load", "5 kg · up to 50 kg"], ["Tripod – mounting", "4 RF antennas, cellular and GPS antenna"], ["Pelican / COM box", "490×395×157 / 465×335×220 mm · 8 kg each"], ["Interfaces", "EMO, ROCU-10, Pitbull controller, 2 batteries, external power, 3×ETH, 4 RF ants, 4 cellular ants"], ["Communication", "IP MESH Phase 5, cellular"], ["Range (Phase 5)", "5 km"], ["Power", "2 × MR-2791 batteries or external power"], ["Working time", "Up to 10 hours"], ["Temp / rating", "-20°C to +60°C · IP65"]]}}, {"note": "Source: ROBOX System Technical Data, DOC00672-A REV.001.", "kind": "note"}]}, "group": "tech", "updated": "2026-11-10"}, {"id": "atp-sys", "sec": "qa", "type": "atp", "title": {"he": "ATP System – ביזון (כל המערכת)", "en": "ATP System – BISON (full system)"}, "summary": {"he": "DOC00678-A REV 001 · ויזואלי, רכיבים, נשק, נסיעה, תקשורת ומסירה", "en": "DOC00678-A REV 001 · visual, components, gun, driving, comms, delivery"}, "body": {"src": "media/atp-system-bison.pdf", "rows": {"he": ["# בדיקה ויזואלית – ללא זחלים", "אין סדקים ואי־התאמות צבע. השלדה התחתונה והצירים לא מעוותים, כיסוי הפלסטיק שלם ולא פגוע.", "כל 6 הכיסויים העליונים מאובטחים בברגים ודסקיות.", "5 ברגים בכל אחד משמונת הגלגלים, נעולים כראוי.", "אין פגמים בצמיגים ולחץ האוויר תקין: קדמי 5, שני אמצעיים 7, אחורי 6 PSI. לא לעבור 7 PSI.", "2 לחצני חירום על הפלטפורמה עם כיסויים (ימין ושמאל), כל אחד מחובר בשישה ברגים.", "4 מצלמות היקפיות קיימות ותקינות (נהיגה, אחורית, ימין, שמאל): מחוברות, כבלים תקינים, עדשות בלי סדקים.", "מצלמת התורן (MAST) קיימת ותקינה: מחוברת, כבל תקין, עדשה בלי סדקים.", "5 אנטנות קיימות ומחוברות היטב: 4 RF ואחת סלולר ו־GPS.", "מפלס שמן מנוע בין הסימנים L ו־F במקל המדידה, ואין נזילות שמן סביב המנוע.", "מפלס נוזל בלמים תקין ואין נזילות באזור.", "מספיק דלק לבדיקה (בדיקה בלוח השעונים עם מתג הכלי דלוק). לא למלא מעל צוואר המילוי.", "# הדלקת המערכת (מנוע כבוי)", "גרסת התוכנה העדכנית מותקנת וכל ההגדרות מוכנות.", "מתג ה־NC דרוך: התוכנה מראה שהמערכת מחוברת וה־E-STOP כבוי.", "מצבר 12V לפחות 60% (במסך הלוח הקדמי או ב־ROCU10).", "מצבר 48V לפחות 60% (ב־ROCU10).", "יש Ping לכל רכיבי המערכת.", "פנסי ה־LED הקדמיים עובדים.", "# בדיקת רכיבים", "5 מצלמות היום משדרות ובפוקוס: נהיגה, אחורית, ימין, שמאל ותורן.", "4 המצלמות התרמיות משדרות ובפוקוס: נהיגה, אחורית, ימין ושמאל.", "המיקרופון עובד, הקול ברור ובלי השהיה.", "הרמקול עובד, הקול ברור ובלי השהיה.", "התוכנה מראה שהמנוע כבוי (RPM = 0).", "# מערכת נשק – בדיקה ויזואלית", "מערכת הנשק מחוברת ב־4 ברגים ואומים, ושני הכבלים מחוברים נכון ולא פגועים.", "מצלמות מערכת הנשק (יום ותרמית) תקינות, בלי סדקים או שריטות בעדשות.", "עוצר מכני בציר ההגבהה קיים וננעל ידנית. להשאיר אותו חופשי בסוף הבדיקה.", "אין חופש תנועה ברכיבים.", "נורית מצב הטעינה ביחידת הבקרה דולקת.", "הנורית הכחולה בתחתית המגירה האלקטרונית מהבהבת (מפסיקה כשהמערכת מתחברת).", "# מערכת נשק – בדיקה תפקודית", "מסך הפתיחה מוצג בבירור.", "התקשורת בין יחידת הבקרה ל־Pitbull תקינה: סמל התקשורת ירוק תוך פחות מדקה.", "שני העוצרים המכניים בציר קיימים, ננעלים ידנית ונעים בחופשיות. להשאיר חופשיים.", "מצלמות מערכת הנשק (יום ותרמית) משדרות ובפוקוס.", "הזום של מצלמת מערכת הנשק עובד.", "מערכת הנשק נעה בכל הכיוונים (X-Y-Z).", "סיבוב מלא (0°–360°) במהירות נמוכה, בחופשיות.", "תנועה מלאה בציר ההגבהה (‎-30° עד 60°) במהירות נמוכה, בחופשיות.", "בחירת מטרה – נשארת במרכז הצלב בזום.", "שחרור מנגנון הבטיחות וחזרה על הבדיקה עם כוונת הירי.", "בחירת מטרה – נשארת במרכז הצלב במצלמה התרמית.", "שחרור מנגנון הבטיחות וחזרה על הבדיקה עם כוונת הירי.", "מערכת הנשק יציבה בזמן תנועה.", "# לפני התנעה: ההילוך ב־N והאזור פנוי מאנשים! בדיקת חירום", "3 לחצני החירום עובדים (2 על הפלטפורמה ואחד בקופסת המפעיל): המנוע נכבה, והתוכנה מראה E-STOP ומערכת מנותקת.", "# נסיעה – ללא זחלים (שלבים 1–4 על מגבה)", "מצב טעינה: זרם האלטרנטור מעל 40mV (מד צבת TOL00968 על החוט האדום של האלטרנטור למצבר 12V).", "מפעיל הבלם: בלם משוחרר – הילוך N וגז עד 2,000 סל״ד, המיקרו־סוויץ׳ לחוץ. בלם מופעל – מדידת אורך הבוכנה, המיקרו־סוויץ׳ לא לחוץ.", "מצבי N: ב־Neutral standby (מנוע כבוי) ה־RPM נשאר 0 בלחיצה על הגז. ב־Neutral drive (מנוע פועל) ה־RPM משתנה.", "הילוכים ונסיעה: החלפת R-N-D מהבקר במצב ידני (ג׳ויסטיק גז 20 שנ׳), ב־High וב־Low. שני הצדדים מסונכרנים. בפנייה ימינה ב־Low הגלגלים הימניים נעולים, ובפנייה שמאלה – השמאליים.", "בלם היד ננעל ומשתחרר כראוי (לבדוק בעין כשמכסה המנוע פתוח – הבוכנה זזה), והתוכנה מראה את מצבו.", "בהעברה ל־R התצוגה עוברת אוטומטית ממצלמת הנהיגה לאחורית.", "נסיעה 200 מ׳ ב־Low וב־High, קדימה ואחורה, בקו ישר (ב־15 קמ״ש), ועצירה מלאה בבלימה.", "פניות ימינה ושמאלה ב־Low וב־High – הגלגלים נעים נכון.", "סיבוב במקום (Pivot) לשני הכיוונים ב־Low – הגלגל הקדמי באותו צד נשאר במקום.", "נסיעה של שעתיים לפחות על משטח ישר ב־Low וב־High: בלי אובדן תקשורת או רעשים חריגים, מצלמות משדרות.", "עלייה וירידה (שיפוע עד 45°): בלי רעשים חריגים, הבלמים מחזיקים והכלי יציב בלי החלקה.", "שיפוע צד (עד 20°): בלי רעשים חריגים, הבלמים מחזיקים והכלי יציב בלי החלקה.", "בדיקת חירום בנסיעה: המנוע נכבה, והתוכנה מראה E-STOP ומערכת מנותקת.", "# בדיקה ויזואלית – עם זחלים", "הגלגלים הועברו לצד ההפוך להתקנת זחלים (כ־13 ס״מ מקצה הפלסטיק לקצה הגלגל מבפנים).", "שני הזחלים מותקנים, המתיחה תקינה והפינים מאובטחים.", "# נסיעה – עם זחלים (שלבים 1–4 על מגבה)", "מצב טעינה: זרם האלטרנטור מעל 40mV (מד צבת TOL00968).", "מפעיל הבלם: בלם משוחרר – המיקרו־סוויץ׳ לחוץ ב־2,000 סל״ד ב־N. בלם מופעל – מדידת אורך הבוכנה.", "מצבי N: Neutral standby – RPM נשאר 0. Neutral drive – RPM משתנה.", "הילוכים ונסיעה: R-N-D מהבקר ב־High וב־Low, צדדים מסונכרנים, פניות תקינות.", "בלם היד ננעל ומשתחרר והתוכנה מראה את מצבו.", "בהעברה ל־R התצוגה עוברת למצלמה האחורית.", "נסיעה 200 מ׳ ב־Low וב־High, קדימה ואחורה, בקו ישר (15 קמ״ש), ועצירה מלאה.", "פניות ימינה ושמאלה ב־Low וב־High – הגלגלים נעים נכון.", "Pivot לשני הכיוונים ב־Low – הגלגל הקדמי באותו צד נשאר במקום.", "עלייה וירידה (עד 45°): בלי רעשים, בלמים מחזיקים, בלי החלקה.", "שיפוע צד (עד 20°): בלי רעשים, בלמים מחזיקים, בלי החלקה.", "נסיעה של שעתיים בחול רך: בלי רעשים, בלמים מחזיקים, בלי החלקה.", "נסיעה בחול עמוק במהירות מרבית ב־Low במשך 20 דק׳ ברצף, בלי עצירות מיותרות: בלי אובדן תקשורת או רעשים.", "נסיעה של שעתיים על משטח סלעי: בלי רעשים, בלמים מחזיקים, בלי החלקה.", "בדיקת חירום בנסיעה: המנוע נכבה והתוכנה מראה E-STOP.", "# בדיקת טווח תקשורת", "תקשורת סלולרית יציבה – המערכת מזהה את כל כרטיסי ה־SIM.", "תקשורת GPS יציבה – הנתונים משתנים.", "תקשורת RF יציבה עד 1 ק״מ בקו ראייה, בלי סלולר (BLUSDR → PHASE 5).", "# בדיקה ויזואלית לפני מסירה", "מצב טעינה: זרם האלטרנטור מעל 40mV (מד צבת TOL00968).", "מתיחת הזחלים תקינה.", "כל החיבורים תקינים (מכניים וכבלים).", "אין סדקים ואי־התאמות צבע; השלדה התחתונה והצירים לא מעוותים.", "5 ברגים בכל אחד משמונת הגלגלים, נעולים כראוי.", "אין פגמים בצמיגים ולחץ תקין: קדמי 5, אמצעיים 7, אחורי 6 PSI (לא לעבור 7).", "האנטנות מחוברות ולא פגועות."], "en": ["# Visual inspection – without tracks", "No cracks or paint mismatches. Lower chassis and axles not deformed; plastic cover complete and undamaged.", "All 6 top covers are secured with screws and washers.", "5 bolts on each of the eight wheels, correctly locked.", "No tire defects and correct pressures: front 5, 2× middle 7, rear 6 psi. Never exceed 7 psi.", "Two emergency stop buttons on the platform with covers (right and left), each secured with 6 screws.", "4 peripheral cameras present and intact (drive, rear, right, left): connected, cables OK, no cracked lenses.", "MAST camera present and intact: connected, cable OK, no cracked lens.", "5 antennas present and tight: 4 RF and 1 cellular & GPS.", "Engine oil between the L and F marks on the dipstick; no oil leaks around the engine.", "Brake fluid level OK; no leaks in the area.", "Enough fuel for testing (check on the dashboard with the vehicle switch on). Do not fill above the filler neck.", "# Turn the system on (engine off)", "Latest software version installed and all settings ready.", "NC switch armed: software shows the system connected and E-STOP off.", "12 V battery at least 60% (front panel screen or ROCU10).", "48 V battery at least 60% (ROCU10).", "Ping succeeds to all system components.", "Front LED lights work.", "# Components check", "All 5 day cameras streaming and in focus: drive, rear, right, left and mast.", "All 4 thermal cameras streaming and in focus: drive, rear, right and left.", "Microphone works, sound clear, no delay.", "Speaker works, sound clear, no delay.", "Software shows the engine off (RPM = 0).", "# Gun system – visual inspection", "Gun system fastened with 4 screws and nuts; both cables correctly connected and undamaged.", "Gun system cameras (day & thermal) in good condition, no cracked or scratched lenses.", "Mechanical stopper on the elevation axis present and locks manually. Leave it free after the check.", "No play in any component.", "Charge status indicator on the control unit is lit.", "Blue LED at the bottom of the electronic drawer flashes (stops once connected).", "# Gun system – functional inspection", "Startup screen displayed clearly.", "Control unit to Pitbull communication OK: comms icon green within a minute.", "Both mechanical stoppers on the axis present, lock manually and move freely. Leave free.", "Gun system cameras (day & thermal) streaming and in focus.", "Gun system camera zoom works.", "Gun system moves in all directions (X-Y-Z).", "Full rotation (0°–360°) at slow speed, moving freely.", "Full elevation movement (-30° to 60°) at slow speed, moving freely.", "Select a target – stays centered in the cross when zoomed.", "Release the safety and repeat with the firing reticle.", "Select a target – stays centered in the crosshairs with the thermal camera.", "Release the safety and repeat with the firing reticle.", "Gun system remains stable during motion.", "# Before starting: gear in N and area clear of people! Emergency check", "All 3 emergency stops work (2 on the platform, 1 in the operator box): engine turns off; software shows E-STOP on and system disconnected.", "# Driving check – without tracks (steps 1–4 on a lift)", "Charging mode: alternator current above 40 mV (clamp TOL00968 on the alternator red wire to the 12 V battery).", "Brake actuator: brake off – gear N, throttle to 2,000 rpm, microswitch pressed. Brake on – measure piston length, microswitch not pressed.", "Neutral modes: in neutral standby (engine off) RPM stays 0 on throttle; in neutral drive (engine on) RPM changes.", "Gears and drive: R-N-D shifts from the controller in manual mode (throttle joystick 20 s), in High and Low. Both sides synchronized. Right turn in Low – right wheels locked; left turn – left wheels locked.", "Handbrake engages and releases properly (check visually with the hood open – piston moves); software shows its state.", "Shifting to R switches the display from the drive camera to the rear camera automatically.", "Drive 200 m in Low and High, forward and back, in a straight line (at 15 km/h), and stop completely with the brakes.", "Right and left turns in Low and High – wheels move correctly.", "Pivot in both directions in Low – the front wheel on that side stays stationary.", "Drive at least 2 hours on flat ground in Low and High: no comms loss or unusual noise, cameras streaming.", "Uphill and downhill (max 45°): no unusual noise; brakes hold and the vehicle stays stable without slipping.", "Side slope (max 20°): no unusual noise; brakes hold and the vehicle stays stable without slipping.", "Emergency check while driving: engine turns off; software shows E-STOP on and system disconnected.", "# Visual inspection – with tracks", "Wheels switched to the opposite side for tracks (about 13 cm from the plastic edge to the wheel end, inside).", "Both tracks mounted, tension correct and pins secured.", "# Driving check – with tracks (steps 1–4 on a lift)", "Charging mode: alternator current above 40 mV (clamp TOL00968).", "Brake actuator: brake off – microswitch pressed at 2,000 rpm in N. Brake on – measure piston length.", "Neutral modes: standby – RPM stays 0; drive – RPM changes.", "Gears and drive: R-N-D from the controller in High and Low, sides synchronized, turns correct.", "Handbrake engages and releases; software shows its state.", "Shifting to R switches the display to the rear camera.", "Drive 200 m in Low and High, forward and back, straight (15 km/h), full stop.", "Right and left turns in Low and High – wheels move correctly.", "Pivot both ways in Low – front wheel on that side stays stationary.", "Uphill and downhill (max 45°): no noise, brakes hold, no slipping.", "Side slope (max 20°): no noise, brakes hold, no slipping.", "Drive 2 hours on soft sand: no noise, brakes hold, no slipping.", "Deep sand at max speed in Low for 20 minutes continuously, no unnecessary stops: no comms loss or noise.", "Drive 2 hours on rocky ground: no noise, brakes hold, no slipping.", "Emergency check while driving: engine off, software shows E-STOP.", "# Communication range check", "Stable cellular – system detects all SIM cards.", "Stable GPS – parameters are changing.", "Stable RF up to 1 km line of sight, without cellular (BLUSDR → PHASE 5).", "# Visual inspection before delivery", "Charging mode: alternator current above 40 mV (clamp TOL00968).", "Track tension OK.", "All connections OK (mechanical and cables).", "No cracks or paint mismatches; lower chassis and axles not deformed.", "5 bolts on each of the eight wheels, correctly locked.", "No tire defects, correct pressure: front 5, middle 7, rear 6 psi (never above 7).", "Antennas connected and undamaged."]}, "mb": 0.5}, "updated": "2026-11-10"}, {"id": "atp-container", "sec": "qa", "type": "atp", "title": {"he": "ATP קרון שליטה", "en": "ATP Control Container"}, "summary": {"he": "DOC00751-A REV 000 · חוץ, פנים ובדיקה תפקודית", "en": "DOC00751-A REV 000 · external, internal and functional"}, "body": {"src": "media/atp-control-container.pdf", "rows": {"he": ["# בדיקה ויזואלית ומכנית – חוץ", "קיימים מסמכי QC לרמסע, לחשמל ולריתוכי הקרון.", "אין שקעים, סדקים, קורוזיה או צבע מתקלף בקירות החיצוניים. הלוגו ברור.", "הרמפות מקובעות ומאובטחות, עולות ויורדות בחלקות, ומנגנון הנעילה תקין (פתיחה בלחיצה על הכפתור האדום). להשאיר את הרמפות למטה לשלב הבא.", "שתי הדלתות האחוריות נפתחות ונסגרות בחלקות ומנגנון הנעילה תקין (דלת ראשית ודלתות כניסת הכלים).", "הדלת האחורית הקטנה נפתחת ונסגרת בחלקות ומנגנון הנעילה תקין (עם מפתח).", "ארבעת כיסויי הפח האחוריים נפתחים ונסגרים בחלקות ומנגנון הנעילה תקין (עם מפתח).", "יחידת המזגן החיצונית מעוגנת, מקובעת ולא פגועה.", "הגנרטור מעוגן ב־4 נקודות ולא פגוע, הכבל מחובר ומאובטח, ומפתח הגנרטור קיים.", "שנאי הפחת (דיפרנציאלי) מעוגן ולא פגוע, וכבלי הכניסה והיציאה מוגנים ומחוברים.", "הקומפרסור מעוגן ולא פגוע, הכבלים (צהובים) מחוברים, הבקר קיים, צינור האוויר (כחול) מחובר ומחברי האוויר מקובעים.", "התורן החיצוני מאובטח וכל התפסים והברגים מהודקים.", "משאבת היד של התורן מעוגנת ומאובטחת, התפסים והברגים מהודקים.", "הסולם מעוגן ב־8 ברגים.", "אין סדקים ב־Hook Lift.", "פאנל אנטנות ה־RF (על הגג) מקובע ב־4 ברגים, 8 מחברי RF מחוברים לפאנל וכיסויי ה־RF קיימים.", "פאנל ה־IO (קיר ימני אחורי) מחובר ב־8 כבלי RF, מעוגן ב־6 ברגים, מחברים וכבלים לא פגועים.", "תווית קיימת.", "לחצן EMO קיים (ליד הסולם).", "שני גלגלי הקרון מעוגנים ב־4 ברגים.", "# בדיקה ויזואלית ומכנית – פנים", "אין שקעים, סדקים, קורוזיה או צבע מתקלף בקירות.", "תווית קיימת (ליד ארון החשמל הראשי).", "החלון נפתח ונסגר בחלקות בשני הצדדים.", "הרצפה (צבע שחור) שלמה, בלי סדקים או עיוותים.", "מנגנון הקלאפה של האחסון העליון נפתח ונסגר בחלקות, יש חבל אחיזה, ושלושת הפאנלים נבדקו.", "האחסון התחתון מתחת לשולחנות, האחסון התחתון בצד ימין (צד הלוח) והדלת העליונה שמעליו נפתחים ונסגרים בחלקות.", "מטף כיבוי קיים, בתוקף, ומד הלחץ בתחום הירוק.", "9 מסכי 24\" ו־6 מסכי 32\" מעוגנים לזרועות ולא פגועים.", "נעילת השולחן תקינה, הזרועות מחוברות לשולחן (2 ברגים כל אחת), ומנגנון השולחן עולה ויורד בחלקות.", "9 פאנלי התקשורת והחשמל שלמים, מחברי Power/ETH/HDMI לא פגועים וכיסויי ה־RF קיימים.", "קופסת התקשורת וכבלי החשמל מחוברים, וכבלי ההארקה (צהוב/ירוק) מחוברים לפאנל.", "המזגן מעוגן לקיר, כבל החשמל מחובר, ושלט המזגן מותקן לקיר (ליד הדלת הראשית).", "ארון החשמל מעוגן לקיר (ליד הדלת הראשית), מנעול הדלת תקין ומפתח הדלת קיים.", "הלוח הלבן מעוגן לקיר.", "קיימים: 9 כיסאות מתקפלים, כבל מאריך, 6 רצועות ראצ׳ט לעיגון הכלים לרצפה (באחסון העליון השמאלי).", "קיימים כבלי HDMI: CBL01434 ×2, ‏CBL01435 ×2, ‏CBL01363 ×2, ‏CBL1436 ×6 (יכולים להיות במדף התקשורת).", "מוט הארקה קיים.", "גלאי עשן קיים ומותקן.", "# בדיקה תפקודית (חשמל, תקשורת, תפעול)", "מפלס השמן והדלק בגנרטור מלאים.", "שני לחצני ה־EMO (בחוץ ובפנים) משוחררים.", "כל המפסקים בארון החשמל החיצוני למעלה, והמתג הראשי על „גנרטור”.", "כל המפסקים בארון החשמל הפנימי למעלה.", "מתג החשמל הראשי של המזגן ב־ON.", "הפעלת הגנרטור: מפסקים ראשיים דלוקים, מתג ראשי ל־I, לחיצה על ON – הנורית הירוקה דולקת, המסך עובד, הנורית האדומה (תקלה) כבויה והגנרטור יציב.", "לחיצה על כל אחד משני לחצני ה־EMO – החשמל בקרון נכבה. לשחרר ולוודא שהחשמל חזר לפני ההמשך.", "תורן עם משאבת יד: לחבר את צינור המשאבה במקום הקומפרסור, לשאוב – התורן עולה 5 מ׳, בלי דליפת אוויר.", "תורן עם קומפרסור: UP – התורן עולה עד הסוף והלחץ יציב. HOLD ל־30 דק׳ – התורן לא יורד ואין דליפה. DOWN – חוזר למצב הבית. בסוף להחזיר ל־HOLD (קומפרסור כבוי).", "מזגן: הפעלה מהשלט, קירור תקין, 30 דק׳ פעולה בלי טפטוף מים.", "תאורה: 5 נורות לבנות, 5 נורות אדומות ו־4 נורות חיצוניות דולקות.", "שקעי החשמל נבדקו עם TOL00947 (9 פאנלים, 27 שקעים).", "שקע ETH בכל אחד מ־9 הפאנלים: כבל RJ45 (CBL01436) למחשב – מהירות 1Gbps (ETH → Network & Internet → Ethernet).", "שקעי HDMI ומסכים: כל שקע מחובר למסך הנכון לפי התוויות, ותמונה תקינה וברורה בכל 15 המסכים.", "8 שקעי ה־RF: עם JIG00301-A משני הצדדים – נורית הג׳יג דולקת וכל שקע מחובר לשקע הנכון בפאנל הגג (1–8), אחד־אחד.", "יציאת כבל התורן (ETH ומתח): CBL01346-A לג׳יג JIG00299-A – ETH במהירות 1Gbps, ובדיקת מתח וזרם עם LOAD (ערך המתח במסמך: TBD). הכבל מחובר לפאנל ה־IO החיצוני.", "כיבוי הגנרטור.", "הרמת הקרון פעמיים: הגלגלים מסתובבים ולא תקועים, ואין נזק לחלקים הפנימיים אחרי ההורדה.", "הקרון מוכן למסירה: רמפות למעלה ונעולות, דלתות נעולות, מפתחות במקום, תורן למטה."], "en": ["# Visual and mechanical inspection – external", "QC documents for RAMSA, electricity and welding exist.", "No dents, cracks, corrosion or peeling paint on exterior walls. Logo is clear.", "Ramps fixed and secured, move up and down smoothly, locking mechanism OK (push the red button to open). Leave ramps down for the next step.", "Both back doors open and close smoothly; locking OK (main door and vehicle entrance doors).", "Small back door opens and closes smoothly; locking OK (with key).", "Four back sheet-metal covers open and close smoothly; locking OK (with key).", "External AC unit securely mounted, fixed and undamaged.", "Generator mounted at four points and undamaged; cable connected and secured; generator key present.", "Differential transformer securely mounted and undamaged; input and output cables protected and connected.", "Compressor mounted and undamaged; cables (yellow) connected; controller present; air pipe (blue) connected; air connectors fixed.", "External mast secured; all clamps and bolts fixed.", "Mast hand pump mounted and secured; clamps and bolts fixed.", "Ladder mounted and secured with 8 bolts.", "No cracks in the hook lift.", "RF antenna panel (roof bracket) fixed with 4 bolts; 8 RF connectors fixed; RF caps present.", "IO panel (back right wall) connected with 8 RF cables, mounted with 6 bolts; connectors and cables undamaged.", "Label present.", "EMO switch present (next to the ladder).", "Both container wheels mounted with 4 bolts.", "# Visual and mechanical inspection – internal", "No dents, cracks, corrosion or peeling paint on the walls.", "Label present (next to the main power box).", "Window opens and closes smoothly on both sides.", "Floor (black paint) intact, no cracks or deformation.", "Top storage flap opens and closes smoothly; hand rope present; all three panels checked.", "Lower storage under the tables, lower storage on the right (whiteboard side) and the upper door above it open and close smoothly.", "Fire extinguisher present, not expired, gauge in the green zone.", "Nine 24\" and six 32\" screens mounted to brackets and undamaged.", "Table lock OK; brackets fixed to the table (2 bolts each); table moves up and down smoothly.", "Nine communication/power panels intact; Power/ETH/HDMI connectors undamaged; RF caps present.", "Communication box and power cables connected; ground cables (yellow/green) fixed to the panel.", "AC mounted to the wall, power cable connected, AC controller on the wall (next to the main door).", "Electrical box mounted (next to the main door); door lock OK; door key present.", "Whiteboard mounted to the wall.", "Present: nine folding chairs, power extension cord, six ratchets for vehicle floor mounts (left upper storage).", "HDMI cables present: CBL01434 ×2, CBL01435 ×2, CBL01363 ×2, CBL1436 ×6 (may be in the communication shelf box).", "Grounding rod present.", "Smoke detector present and mounted.", "# Functional check (power, communication, operation)", "Generator oil and fuel levels full.", "Both EMO switches (outside and inside) released.", "All outside panel breakers up; main switch set to “Generator”.", "All interior panel breakers up.", "Main AC electrical switch ON.", "Start the generator: main breakers on, main switch to I, press ON – green LED on, screen on, red LED (fault) off, generator stable.", "Press each of the two EMO switches – container power goes off. Release and confirm power is back before continuing.", "Mast with hand pump: connect the hand pump hose instead of the compressor, pump – mast rises 5 m, no air leak.", "Mast with compressor: UP – mast rises fully, pressure stable. HOLD for 30 min – mast holds, no leak. DOWN – returns home. Finish on HOLD (compressor off).", "AC: turn on from the controller, cooling works, 30 min with no water dripping.", "Lights: all 5 white, 5 red and 4 outside lights turn on.", "Power sockets checked with TOL00947 (9 panels, 27 outlets).", "ETH socket in each of the 9 panels: RJ45 cable (CBL01436) to the computer – speed 1 Gbps (ETH → Network & Internet → Ethernet).", "HDMI sockets and screens: each socket goes to the correct screen per the labels; clear image without color issues on all 15 screens.", "8 RF sockets: with JIG00301-A on both sides – jig LED on and each socket goes to the correct roof panel socket (1–8), one by one.", "Mast cable output (ETH and voltage): CBL01346-A to jig JIG00299-A – ETH at 1 Gbps; check voltage and current with LOAD (voltage value in the document: TBD). Cable connected to the outside IO panel.", "Turn off the generator.", "Lift the container twice: wheels turn freely; no internal damage after lowering.", "Container ready for delivery: ramps up and locked, doors locked, keys in place, mast down."]}, "mb": 1.7}, "updated": "2026-11-10"}, {"id": "atp-rocu10", "sec": "qa", "type": "atp", "title": {"he": "ATP ROCU10", "en": "ATP ROCU10"}, "summary": {"he": "DOC00752-A REV 000 · בקר ROCU10", "en": "DOC00752-A REV 000 · ROCU10 controller"}, "body": {"src": "media/atp-rocu10.pdf", "rows": {"he": ["# בדיקה ויזואלית", "לנער את ה־ROCU ולוודא שאין חלקים זרים בפנים.", "אין סדקים או בעיות צבע בגוף ואין שריטות במסך.", "10 ברגים בגב המכשיר.", "4 ברגים מחזיקים את התושבות בחזית.", "הסוללה מותקנת ב־ROCU.", "# בדיקה תפקודית", "לחבר את CBL01377-A ו־CBL01378-A ל־ROCU – לפי סימוני הצבע: אדום לאדום בכבל החשמל, לבן ללבן בכבל ה־ETH.", "המחברים מתחברים ומתנתקים בקלות ובלי בעיות.", "לחבר את CBL01377-A לחשמל ואת CBL01378-A לכבל ETH.", "להדליק את ה־ROCU ולוודא שהמסך נדלק. כניסה: משתמש user, סיסמה password.", "הצבעים נכונים, התמונה לא מעוותת והבהירות עובדת.", "מסך המגע עובד היטב.", "ה־ROCU נטען דרך CBL01377.", "ניתוק CBL01377 – הטעינה מפסיקה.", "Wi-Fi ו־Bluetooth כבויים.", "חיבור ETH קיים: Settings → Network & Internet מציג „Ethernet Connected”.", "ניתוק CBL01378 – התצוגה משתנה ל־„Not Connected”.", "כל הלחצנים נלחצים בצורה חלקה והג׳ויסטיקים זזים בחופשיות.", "ללחצנים יש תאורה ירוקה ואפשר לכבות אותה."], "en": ["# Visual inspection", "Shake the ROCU and make sure there are no foreign parts inside.", "No cracks or paint issues on the body and no scratches on the screen.", "10 screws at the back.", "4 screws holding the brackets at the front.", "Battery is mounted in the ROCU.", "# Functional test", "Connect CBL01377-A and CBL01378-A to the ROCU – match colors: red to red for power, white to white for ETH.", "Connectors connect and disconnect easily without issues.", "Connect CBL01377-A to a power outlet and CBL01378-A to an ETH cable.", "Turn on the ROCU and verify the screen turns on. Log in: user / password.", "Colors correct, image not distorted, brightness works.", "Touchscreen works well.", "ROCU charges via CBL01377.", "Disconnect CBL01377 – charging stops.", "Wi-Fi and Bluetooth are disabled.", "ETH connected: Settings → Network & Internet shows “Ethernet Connected”.", "Disconnect CBL01378 – status changes to “Not Connected”.", "All buttons press smoothly and joysticks move freely.", "Buttons have green light and it can be turned off."]}, "mb": 0.5}, "updated": "2026-11-10"}, {"id": "atp-gun", "sec": "qa", "type": "atp", "title": {"he": "ATP Gun System – Pitbull", "en": "ATP Gun System – Pitbull"}, "summary": {"he": "DOC00753-A REV 000 · לפני התקנה על הכלי", "en": "DOC00753-A REV 000 · before installation on the vehicle"}, "body": {"src": "media/atp-gun-system.pdf", "rows": {"he": ["# בדיקה ויזואלית", "אין סדקים, שריטות או בעיות צבע.", "תווית הזיהוי (ID) קיימת בתחתית.", "כל הברגים והאומים מהודקים.", "כל המחברים קיימים ומחוברים כראוי.", "כל כיסויי המחברים קיימים.", "מחוון הלחות (Desiccant) כחול.", "כל העדשות נקיות, בלי סדקים או נזק.", "עוצר מכני בציר ההגבהה קיים וננעל ידנית. להשאיר חופשי בסוף הבדיקה.", "אין חופש תנועה ברכיבים.", "שני העוצרים המכניים בציר קיימים, ננעלים ידנית ונעים בחופשיות. להשאיר חופשיים.", "פין עצירה אחד מחובר לבסיס ועוד אחד בתיק ערכת הבקרה.", "לחצן EMO קיים.", "קופסת התחמושת נפתחת ונסגרת בחופשיות.", "ידיות ההדק והנצרה זזות בחופשיות וגלגלי ההדק זזים בחלקות.", "# בדיקת קופסת בקרה", "לחבר את ה־Pitbull ואת יחידת הבקרה לקופסת הבקרה.", "לחבר את קופסת הבקרה לחשמל.", "שני צדי המחבר מחוברים עד הסוף ואין נזק לפינים.", "# הדלקת המערכת", "נורית מצב הטעינה ביחידת הבקרה דולקת.", "הנורית הכחולה בתחתית המגירה האלקטרונית מהבהבת (מפסיקה כשהמערכת מתחברת).", "מסך הפתיחה של Pitbull מוצג בבירור.", "התקשורת בין יחידת הבקרה ל־Pitbull תקינה: סמל התקשורת ירוק תוך פחות מדקה.", "במעבר ל־ENABLE אי אפשר לבצע את הפעולות החסומות – המערכת לא מאפשרת אותן.", "START – שידור תקין ממצלמות היום והלילה.", "הזום של מצלמת היום עובד.", "לחיצה על כל לחצן ביחידת הבקרה 10 שניות – מופיעה הודעת „Button is pressed”.", "הזזה מהירה של המתגים כמה פעמים – המערכת מגיבה.", "מתג אפשור התנועה ל־ENABLE – מחוון מצב התנועה ירוק.", "סיבוב מלא (0°–360°) במהירות נמוכה, בחופשיות.", "תנועה מלאה בציר ההגבהה (‎-30° עד 60°) במהירות נמוכה, בחופשיות.", "בחירת מטרה – נשארת במרכז הצלב בזום.", "שחרור הנצרה וחזרה עם כוונת הירי.", "בחירת מטרה – נשארת במרכז הצלב במצלמה התרמית.", "שחרור הנצרה וחזרה עם כוונת הירי.", "נעילת העוצרים המכניים באזימוט ובהטיה ונסיעה אליהם במהירות מרבית 10 שניות – 5 פעמים לכל ציר ובכיוונים שונים.", "אזימוט 0° ולחיצה על „Return to park” – הגעה תוך פחות מ־2 שניות.", "הזנת טווח ידנית – הכוונת זזה בהתאם והטווח נשמר בפס העליון.", "דריכה מהירה, עצירה, והמשך הפעלת הידית ידנית קדימה ואחורה.", "שחרור הנצרה – היא ננעלת אוטומטית אחרי 60 שניות.", "שחרור הנצרה ולחיצה על שני לחצני הירי.", "יש ירי – לחזור 10 פעמים בכל מצב ירי.", "הגדרת אזור ללא תנועה – המערכת „מדלגת” עליו ומוצגת התראה בהתנגשות.", "בסיום פעולות הדריכה הנצרה ננעלת.", "כשהמטרה נעלמת המערכת מפסיקה לעקוב אוטומטית.", "בזמן עקיבה אפשר לתקן ידנית עם הג׳ויסטיק והעקיבה לא נפסקת.", "במצלמת היום – בחירת מטרות ב־4 פינות התצוגה.", "הכוונת מגיעה לתוך גבולות הריבוע הכחול.", "במצלמת היום – בחירת מטרה נעה, וה־Pitbull עוקב אחריה.", "# חיבור ה־Pitbull לכלי", "הפעלת ייצוב ונסיעה 5 דקות – הסחיפה נשארת בתוך ריבוע של 3×3 ס״מ בתצוגה.", "בחירת נקודה סטטית – המערכת נשארת עליה.", "Point & Shoot לפחות 10 פעמים.", "המערכת מגיעה לנקודה הרצויה ונשארת עליה.", "עקיבה אופטית עם מצלמת היום כשהייצוב פעיל.", "עקיבה אופטית עם המצלמה התרמית כשהייצוב פעיל.", "שחרור נצרה וירי בכל בדיקה!"], "en": ["# Visual inspection", "No cracks, scratches or paint issues.", "ID label present at the bottom.", "All screws and nuts are tight.", "All connectors present and properly connected.", "All connector caps present.", "Desiccant humidity indicator is blue.", "All lenses clean, no cracks or damage.", "Mechanical stopper on the elevation axis present and locks manually. Leave free after the check.", "No play in any component.", "Both mechanical stoppers on the axis present, lock manually and move freely. Leave free.", "One stop pin attached to the base and another in the control kit case.", "EMO button present.", "Ammunition box opens and closes freely.", "Trigger levers and safety const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
const jget=(k,d)=>{try{const v=JSON.parse(ls.get(k));return v??d}catch(e){return d}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const has=v=>Array.isArray(v)?v.length>0:!!(v&&String(v).trim());
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>{if(!d)return"";const p=String(d).slice(0,10).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:d};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
async function sha(s){if(!(window.crypto&&crypto.subtle))return null;const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{s.remove();rej(new Error(src))};document.head.appendChild(s)})}
const libLocal={};
async function needLib(k){
  if(LIBTEST[k]&&LIBTEST[k]())return;
  try{await loadScript(LIB[k][0]);libLocal[k]=true}catch(e){await loadScript(LIB[k][1])}
  if(k==="pdf")pdfjsLib.GlobalWorkerOptions.workerSrc=libLocal.pdf?LIB.pdfw[0]:LIB.pdfw[1];
}

const other=()=>lang==="he"?"en":"he";

const dirOf=l=>l==="he"?"rtl":"ltr";
const sec=id=>data().sections.find(s=>s.id===id);
const kids=id=>data().sections.filter(s=>(s.parent||null)===(id||null));
