function pathOf(id){const out=[];let s=sec(id),guard=0;while(s&&guard++<20){out.unshift(s);s=s.parent?sec(s.parent):null}return out}
function isEmpty(it){const b=it.body||{},t=it.type;
  if(t==="pdf")return !b.src;
  if(t==="steps"||t==="checklist"||t==="guide")return !((Array.isArray(b.he)&&b.he.length)||(Array.isArray(b.en)&&b.en.length));
  if(t==="text")return !(String(b.he||"").trim()||String(b.en||"").trim());
  if(t==="maint")return !(b.rows||[]).length;
  return false}
function countDeep(id){let n=itemsOf(id).filter(i=>!isEmpty(i)).length;for(const k of kids(id))n+=countDeep(k.id);return n}
function newDeep(id){let n=itemsOf(id).filter(isNew).length;for(const k of kids(id))n+=newDeep(k.id);return n}
function pick(o){if(!o)return{v:"",l:lang,fb:false};if(has(o[lang]))return{v:o[lang],l:lang,fb:false};if(has(o[other()]))return{v:o[other()],l:other(),fb:true};return{v:Array.isArray(o[lang])?[]:"",l:lang,fb:false}}
const P=o=>pick(o).v;
const isNew=it=>!admin&&prevSeen&&it.updated&&it.updated>prevSeen;
const isDirty=()=>admin&&draft&&JSON.stringify(draft)!==JSON.stringify(published);
const secLabel=id=>pathOf(id).map(s=>P(s.name)).join(" › ");
function saveDraft(){ls.set("fk-draft",JSON.stringify(draft))}

/* ---- IndexedDB for pending media (admin) ---- */
const idb={db:null,
  open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{const r=indexedDB.open("ondas",1);r.onupgradeneeded=()=>r.result.createObjectStore("media");r.onsuccess=()=>res(this.db=r.result);r.onerror=()=>rej(r.error)})},
  async put(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("media","readwrite");t.objectStore("media").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  async clear(){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("media","readwrite");t.objectStore("media").clear();t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  async all(){const db=await this.open();return new Promise((res,rej)=>{const out=new Map();const c=db.transaction("media").objectStore("media").openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.set(cur.key,cur.value);cur.continue()}else res(out)};c.onerror=()=>rej(c.error)})}
};
async function loadPending(){try{const m=await idb.all();for(const [k,b] of m){pending.set(k,b);pendingURL.set(k,URL.createObjectURL(b))}}catch(e){}}

/* ================= views ================= */
function crumbs(secs,extra){
  const parts=secs.map(s=>`<a href="#s-${esc(s.id)}">${esc(P(s.name))}</a>`);
  return `<nav class="crumbs"><a href="#home">${esc(T().home)}</a>${parts.map(p=>`<span aria-hidden="true">/</span>${p}`).join("")}${extra||""}</nav>`;
}
function tileHTML(s){
  const t=T(),n=countDeep(s.id),nn=newDeep(s.id),k=kids(s.id).length;
  const empty=n===0&&!admin;
  return `<a class="tile${empty?" soon":""}" href="#s-${esc(s.id)}">${s.kind==="assembly"?`<span class="kind">${esc(t.assembly)}</span>`:""}<span class="nm">${esc(P(s.name))}</span>
   <span class="ct">${esc(empty?t.soon:t.items(n))}${nn?`<span class="badge">${esc(t.newCount(nn))}</span>`:""}</span></a>`;
}
function hl(txt,words){let h=esc(txt);if(!words||!words.length)return h;for(const w of words){if(w.length<2)continue;const re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");h=h.replace(re,"<mark>$1</mark>")}return h}
function rowHTML(it,showPath,words){
  const t=T(),ti=pick(it.title),su=pick(it.summary),em=isEmpty(it)&&!admin;
  const sub=showPath?secLabel(it.sec)+(su.v?" · "+su.v:""):su.v;
  const tag=(t.types[it.type]||"")+(it.body&&it.body.mb?" · "+it.body.mb+"MB":"");
  return `<a class="row${em?" soon":""}" href="#i-${esc(it.id)}"><span class="tx"><div class="t1"><span dir="${dirOf(ti.l)}">${hl(ti.v,words)}</span>${em?`<span class="soonb">${esc(t.soon)}</span>`:""}${isNew(it)?`<span class="badge">${esc(t.isNew)}</span>`:""}</div>${sub?`<div class="t2">${esc(sub)}</div>`:""}</span>
   ${admin&&!showPath?`<button class="btn ghost small" data-act="up" data-id="${esc(it.id)}" aria-label="${esc(t.adm.up)}">▲</button><button class="btn ghost small" data-act="down" data-id="${esc(it.id)}" aria-label="${esc(t.adm.down)}">▼</button>`:""}
   <span class="rtype">${esc(tag)}</span><span class="chev" aria-hidden="true"></span></a>`;
}
function vHome(){
  const t=T();let h="";
  if(isPreview)h+=`<div class="note">${esc(t.preview)}</div>`;
  h+=`<div class="hero"><img class="heromark" src="media/ondas-symbol.png" alt="" onerror="this.remove()"><h1>IRONWAVE</h1><p class="lead">${esc(t.tagline)}</p><p class="hint" style="margin-top:-14px;margin-bottom:20px">${esc(t.ver(published.app.version,fmtDate(published.app.updated)))}</p></div>`;
  const top=kids(null),sysT=top.filter(x=>x.home==="sys"),domT=top.filter(x=>x.home!=="sys");
  if(sysT.length)h+=`<div class="gh">${esc(t.systems)}</div><div class="grid">${sysT.map(tileHTML).join("")}</div>`;
  if(domT.length)h+=`<div class="gh" style="margin-top:26px">${esc(t.domains)}</div><div class="grid">${domT.map(tileHTML).join("")}</div>`;

  return h;
}
function vSec(id){
  const t=T(),s=sec(id);if(!s)return vHome();
  const path=pathOf(id),subs=kids(id),its=itemsOf(id);
  let h=crumbs(path.slice(0,-1))+`<h1>${esc(P(s.name))}</h1>`;
  if(s.desc&&P(s.desc))h+=`<p class="lead">${esc(P(s.desc))}</p>`;else h+=`<div style="height:12px"></div>`;
  if(admin)h+=`<div class="btnrow"><button class="btn primary" data-act="addItem">${esc(t.adm.addItem)}</button><button class="btn ghost" data-act="addSec">${esc(t.adm.addSec)}</button><button class="btn ghost" data-act="editSec">${esc(t.adm.editSec)}</button><button class="btn danger" data-act="delSec">${esc(t.adm.delSec)}</button></div>`;
  if(subs.length)h+=`<div class="grid secgrid">${subs.map(tileHTML).join("")}</div>`;
  if(s.kind==="assembly"&&its.length){
    for(const g of [...GROUPS,"other"]){const gi=its.filter(i=>(GROUPS.includes(i.group)?i.group:"other")===g);if(!gi.length)continue;
      h+=`<div class="gh">${esc(t.groups[g])}</div><div class="list">${gi.map(i=>rowHTML(i,false)).join("")}</div>`}
  }else if(its.length){h+=`${subs.length?`<div style="height:18px"></div>`:""}<div class="list">${its.map(i=>rowHTML(i,false)).join("")}</div>`}
  if(!subs.length&&!its.length)h+=`<div class="empty">${esc(t.empty)}</div>`;
  return h;
}
function noteOf(o){const n=pick(o);return n.v?`<div class="note" dir="${dirOf(n.l)}">${esc(n.v)}</div>`:""}

function vItem(id){

  if(admin)h+=`<div class="btnrow"><button class="btn primary" data-act="editItem">${esc(t.adm.editItem)}</button><button class="btn danger" data-act="delItem">${esc(t.adm.del)}</button></div>`;
  switch(it.type){
    case"steps":{const p=pick(b);h+=fbNote(p)+(p.v.length?`<div class="card" dir="${dirOf(p.l)}"><ol class="steps">${p.v.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`:`<div class="empty">${esc(t.empty)}</div>`);break}

function fmt(x){return esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>")}

function guideHTML(blocks,l){const t=T();return `<div class="doc" dir="${dirOf(l)}">`+blocks.map(b=>{
  if(b.h)return `<h2>${fmt(b.h)}</h2>`;

  if(b.path)return `<p><span class="path"><span>${esc(b.label||"")}</span><span class="mono" dir="ltr">${esc(b.path)}</span></span></p>`;
  if(b.ul)return `<ul>${b.ul.map(x=>`<li>${fmt(x)}</li>`).join("")}</ul>`;

  if(b.note)return `<div class="callout ${esc(b.kind||"note")}"><div class="ck">${esc(t.callout[b.kind||"note"]||"")}</div>${fmt(b.note)}</div>`;
  if(b.img)return `<figure class="figure" style="margin-inline:0"><img src="${esc(mediaSrc(b.img))}" data-act="zoomImg" loading="lazy" alt="${esc(b.cap||"")}">${b.cap?`<figcaption class="cap">${fmt(b.cap)}</figcaption>`:""}</figure>`;

  return "";}).join("")+`</div>`}
function guideText(bl){if(!Array.isArray(bl))return"";return bl.map(b=>[b.h,b.h3,b.p,b.path,b.note,b.cap,...(b.ul||[]),...(b.ol||[]),...(b.table?[...b.table.head,...b.table.rows.flat().map(c=>c&&typeof c==="object"?c.t:c)]:[])].filter(Boolean).join(" ")).join(" ")}
function mediaOf(it){const b=it.body||{},out=[];if(b.src)out.push(b.src);for(const l of ["he","en"])if(Array.isArray(b[l]))for(const x of b[l])if(x&&x.img)out.push(x.img);return out}

let sigCtx=null;
function setupSigPad(getSig,setSig){
  const c=$("sig");if(!c)return;
  const dpr=Math.max(1,window.devicePixelRatio||1),w=c.clientWidth,hgt=180;
  c.width=w*dpr;c.height=hgt*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#0a1530";sigCtx=x;
  const cur=getSig();if(cur){const im=new Image();im.onload=()=>x.drawImage(im,0,0,w,hgt);im.src=cur}
  let drawing=false,last=null;
  const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  c.onpointerdown=e=>{drawing=true;last=pos(e);c.setPointerCapture(e.pointerId);$("sigHint").hidden=true;e.preventDefault()};
  c.onpointermove=e=>{if(!drawing)return;const p=pos(e);x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(p[0],p[1]);x.stroke();last=p;e.preventDefault()};
  const end=()=>{if(!drawing)return;drawing=false;setSig(c.toDataURL("image/png"))};
  c.onpointerup=end;c.onpointercancel=end;c.onpointerleave=end;
}
function setupSig(it){setupSigPad(()=>getRun(it).sig,v=>{const r=getRun(it);r.sig=v;ls.set(runKey(it),JSON.stringify(r))})}

async function saveChk(it){
  const c=T().cs,a=T().atp,p=pick(it.body),run=getCRun(it),st=jget("fk-chk-"+it.id,[]),err=$("chkErr");
  if(!run.f.first.trim()||!run.f.last.trim()){err.textContent=c.needName;return}
  if(!run.sig){err.textContent=a.needSig;return}
  const isH=x=>String(x).trim().startsWith("#");
  const rows=p.v.map((x,i)=>({h:isH(x),text:isH(x)?x.trim().replace(/^#+\s*/,""):x.replace(/\*\*/g,""),done:st.includes(i)}));
  const total=rows.filter(r=>!r.h).length,done=rows.filter(r=>!r.h&&r.done).length;
  if(done<total&&!confirm(a.notAll(done,total)))return;
  const rec={kind:"chk",id:uid("r"),lang,title:P(it.title),titleEn:it.title.en,f:clone(run.f),faults:run.faults,notes:run.notes,sig:run.sig,rows,done,total,savedAt:new Date().toISOString()};
  err.textContent="";openModal(`<h2>${esc(a.making)}</h2><div class="bigprog"><i style="width:60%"></i></div>`);
  let blob;try{blob=await makePdf(rec)}catch(e){$("sheet").innerHTML=`<p class="err">${esc(a.pdfErr)}</p><button class="btn ghost" onclick="closeModal()">${esc(T().off.close)}</button>`;return}
  const hist=jget(chKey(it),[]);hist.push(rec);
  while(!ls.set(chKey(it),JSON.stringify(hist))&&hist.length>1)hist.shift();
  ls.set("fk-chk-"+it.id,"[]");
  ls.set(crKey(it),JSON.stringify({f:{first:run.f.first,last:run.f.last,date:today(),platform:run.f.platform},faults:"",notes:"",sig:""}));
  const name=chkPdfName(rec);
  openModal(`<h2>${esc(c.saved)}</h2><p class="hint">${esc(name)}</p><div class="btnrow"><button class="btn primary" id="pDl">${esc(a.download)}</button>${canShareFiles()?`<button class="btn ghost" id="pSh">${esc(a.share)}</button>`:""}<button class="btn ghost" id="pCl">${esc(T().off.close)}</button></div>`);
  $("pDl").onclick=()=>downloadBlob(blob,name);if($("pSh"))$("pSh").onclick=()=>sharePdf(blob,name);
  $("pCl").onclick=()=>{closeModal();render()};
}

async function makePdf(rec){
  await needLib("h2c");await needLib("jspdf");
  const box=document.createElement("div");
  box.style.cssText="position:fixed;left:-12000px;top:0;width:794px;background:#fff;color:#0a1530;font-family:Heebo,Arial,sans-serif;padding:40px;box-sizing:border-box;line-height:1.45";
  box.dir=dirOf(rec.lang);box.innerHTML=(rec.kind==="chk"?reportChk:reportHTML)(rec);document.body.appendChild(box);
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    await Promise.all([...box.querySelectorAll("img")].map(img=>img.complete?0:new Promise(r=>{img.onload=img.onerror=r})));
    const top=box.getBoundingClientRect().top;
    const bounds=[...box.querySelectorAll("[data-br]")].map(e=>e.getBoundingClientRect().bottom-top).sort((a,b)=>a-b);
    const totalH=box.scrollHeight;bounds.push(totalH);
    const S=2,canvas=await html2canvas(box,{scale:S,backgroundColor:"#ffffff",useCORS:true});
    const pageH=Math.floor(794*297/210),margin=40;
    const pdf=new jspdf.jsPDF({unit:"pt",format:"a4"});const pw=pdf.internal.pageSize.getWidth();
    let s=0,first=true;
    while(s<totalH-1){
      const lim=s+pageH-(first?0:margin);let e=s;for(const b of bounds)if(b>s&&b<=lim)e=b;if(e<=s)e=Math.min(lim,totalH);
      const pc=document.createElement("canvas");pc.width=canvas.width;pc.height=Math.ceil((e-s+(first?0:margin))*S);
      const x=pc.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,pc.width,pc.height);
      x.drawImage(canvas,0,s*S,canvas.width,(e-s)*S,0,first?0:margin*S,canvas.width,(e-s)*S);
      if(!first)pdf.addPage();pdf.addImage(pc.toDataURL("image/jpeg",.92),"JPEG",0,0,pw,pc.height/S*pw/794);
      s=e;first=false;
    }
    return pdf.output("blob");
  }finally{box.remove()}
}

  }catch(e){if(pdfState.token===token)box.innerHTML=`<p class="err">${esc(t.pdf.err)}</p>`}

async function drawPdf(){
  const st=pdfState,box=$("pdfBox");if(!st||!st.doc||!box)return;
  const token=st.token,zoom=st.zoom,dpr=Math.min(window.devicePixelRatio||1,2),w=box.clientWidth-20;box.innerHTML="";
  const p1=await st.doc.getPage(1);if(pdfState.token!==token||pdfState.zoom!==zoom)return;
  const base=p1.getViewport({scale:1}),scale=(w/base.width)*zoom;

  st.io=io;
  for(let i=1;i<=st.doc.numPages;i++){const c=document.createElement("canvas");c.dataset.p=i;c.style.width=Math.floor(base.width*scale)+"px";c.style.height=Math.floor(base.height*scale)+"px";box.appendChild(c);io.observe(c)}
}
async function renderPdfPage(c,token,zoom,scale,dpr){

    const page=await pdfState.doc.getPage(+c.dataset.p);if(pdfState.token!==token||pdfState.zoom!==zoom)return;
    const vp=page.getViewport({scale:scale*dpr});c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);

}

async function compressImage(file){
  if(file.size<800*1024||/svg|gif/.test(file.type))return file;
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,2000/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
    const out=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));return out&&out.size<file.size?out:file}catch(e){return file}
}
async function takeFile(type,id,old){
  const f=$("bFile")?.files?.[0];if(!f)return old||"";
  const blob=type==="image"?await compressImage(f):f;const mb=blob.size/1048576;if(mb>MAX_MB)throw new Error(T().adm.tooBig(mb.toFixed(1)));
  const ext=type==="image"?(blob.type==="image/jpeg"?"jpg":(f.name.split(".").pop()||"png").toLowerCase().replace(/[^a-z0-9]/g,"")):"pdf";
  const slug=f.name.replace(/\.[^.]+$/,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
  const src="media/"+id+(slug?"-"+slug:"")+"."+ext;
  pending.set(src,blob);pendingURL.set(src,URL.createObjectURL(blob));try{await idb.put(src,blob)}catch(e){}
  return src;
}

  try{const r=await fetch("content.json",{cache:"no-store"});if(r.ok)c=await r.json()}catch(e){}
  if(!c||!Array.isArray(c.items)||!Array.isArray(c.sections)){c=SAMPLE;isPreview=true}
  published=c;
  const seen=ls.get("fk-seen");if(seen!==published.app.updated){if(seen)ls.set("fk-seen-prev",seen);ls.set("fk-seen",published.app.updated)}
  prevSeen=ls.get("fk-seen-prev");
  if(ss.get("fk-admin")==="1")await enterAdmin();
  route();
  if(!isPreview&&"serviceWorker" in navigator){try{await navigator.serviceWorker.register("sw.js");swOK=true;chrome()}catch(e){}}
})();
</script>
